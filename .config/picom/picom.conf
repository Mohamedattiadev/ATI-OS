#################################
#           SHADOWS              #
#################################

shadow = true;
shadow-radius = 4;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.45;

shadow-exclude = [
  "class_g = 'warpd'",
  "class_g = 'hintium'",
  "class_g = 'collector'",
  "name *= 'Dunst'",
  "QTILE_INTERNAL@:32c = 1"
];

#################################
#            FADING              #
#################################

fading = true;
# 0.08 per 5ms frame is ~65ms to full, against 170ms at the old 0.03. This is
# global because it has to be: this build takes one number, not a list of
# per-window rules -- `--help` advertises "specify a list of opacity rules"
# for -I, but the parser here accepts a list, a bare number and outright
# garbage with equal silence, so there is no way to tell support from the
# usual libconfig shrug. See the ANIMATIONS note below for what believing
# that silence cost last time. In is faster than out on purpose: a window you
# asked for should be there, a window you dismissed can take its time.
fade-in-step = 0.08;
fade-out-step = 0.03;
fade-delta = 5;

# hintium is deliberately NOT here. Its overlay is excluded from the slide
# animation instead (see animation-exclude), so fading is the whole of its
# entrance: chips ramp up in place rather than flying in from the top.
fade-exclude = [
  "class_g = 'warpd'",
  "class_g = 'collector'"
];

#################################
#        OPACITY / TRANSPARENCY  #
#################################

active-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
  "100:fullscreen",
  "100:QTILE_INTERNAL@:32c = 1",
  "100:name *= 'Dunst'",
  "100:class_g = 'warpd'",
  "100:class_g = 'hintium'",
  "100:class_g = 'collector'"
];

#################################
#         ROUNDED CORNERS        #
#################################

corner-radius = 6;

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'collector'"
  
];

#################################
#              BLUR              #
#################################
# (Disabled for performance — enable only if you really want it)

# blur-method = "dual_kawase";
# blur-strength = 5;

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'warpd'",
  "class_g = 'collector'"
];

#################################
#        GENERAL SETTINGS        #
#################################

backend = "glx";
glx-no-stencil = true;

animations = true;

vsync = true;
use-damage = true;

detect-client-opacity = true;
use-ewmh-active-win = true;
detect-transient = true;

daemon = false;
log-level = "warn";

#################################
#         WINDOW TYPES           #
#################################

wintypes:
{
  tooltip = {
    fade = true;
    shadow = false;
    opacity = 0.75;
    focus = true;
  };

  dock = {
    shadow = false;
    clip-shadow-above = true;
  };

  dnd = {
    shadow = false;
    animation = "none";
  };

  popup_menu = {
    opacity = 0.9;
  };

  dropdown_menu = {
    opacity = 0.9;
  };

  menu = {
    shadow = false;
  };
};


#################################
#        WARPD SAFETY NET        #
#################################

focus-exclude = [
  "class_g = 'warpd'",
  "class_g = 'hintium'",
  "class_g = 'collector'"
];

unredir-if-possible-exclude = [
  "class_g = 'warpd'",
  "class_g = 'hintium'",
  "class_g = 'collector'"
];

#################################
#          ANIMATIONS            #
#################################
# This is picom-ftlabs-git, NOT one of the forks with a rich
# match/trigger/curve "animation-rules" schema (jonaburg/dccsillag
# style) -- confirmed by reading its actual config parser
# (src/config_libconfig.c upstream): the only animation-related keys it
# recognizes are `animations`, the single global `animation-for-*`
# selectors below, the spring-physics tuning knobs, and `animation-exclude`.
# A prior version of this file had a whole match/trigger/curve
# "animation-rules" block here (per-app open/close/geometry curves for
# Rofi/Dunst/Eww/etc) -- libconfig silently ignores unknown top-level
# keys instead of erroring, so it parsed with no complaints but never
# actually did anything. Every one of those per-app effects was
# imaginary. Replaced with what this build actually supports.
animations = true;
# "zoom" (scale transform) triggered a real, recurring
# GL_INVALID_FRAMEBUFFER_OPERATION on every animated open/close --
# confirmed by toggling animations alone with everything else
# unchanged: error present with zoom, gone with slide-* presets (no
# scale, translation only). Tested clean under real open+close and
# real workspace switches. Stiffness keys are NOT "animation-stiffness"
# -- that key doesn't exist in this build (confirmed via `strings` on
# the binary + upstream src/config_libconfig.c); the real ones are
# -in-tag (open/close/etc.) and -tag-change (workspace switch),
# bumped above the 200/200 default for a snappier, faster feel.
animation-for-open-window = "slide-down";
animation-for-unmap-window = "slide-down";
animation-for-transient-window = "slide-down";
animation-for-next-tag = "slide-left";
animation-for-prev-tag = "slide-right";
animation-stiffness-in-tag = 350;
animation-stiffness-tag-change = 350;
animation-dampening = 30;
animation-window-mass = 1;
animation-clamping = true;

# qdrop already has its own GTK-driven slide animation (see
# qdrop.py REVEAL_MS/HIDE_MS / _slide_move) -- letting picom *also*
# animate it would fight that. Drag-and-drop icons (the thumbnail that
# follows the cursor while dragging a file) are override-redirect
# windows; excluding them here is defense-in-depth for whenever this
# animation system actually runs, even though it turned out to not be
# the cause of the reported drag lag (nothing was animating window
# geometry at all before this).
animation-exclude = [
  "class_g = 'qdrop'",
  # TODOS summary (Mod+Shift+S). qtile already places it centred at its final
  # geometry on the MapRequest, but slide-down animates the reveal, which reads
  # as the window drifting into position rather than simply being there. Same
  # reasoning as qdrop: a window that manages its own placement should not also
  # be animated by the compositor.
  "class_g = 'sum-md'",
  # hintium hint overlay. Its labels are drawn at absolute screen coordinates
  # on top of the buttons they point at, so animating the window slides every
  # hint away from its target and they arrive from the top instead of simply
  # being there. Same reasoning as qdrop and sum-md.
  "class_g = 'hintium'",
  "override_redirect = true"
];

