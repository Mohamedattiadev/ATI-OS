# FORK — new file. Feeds DictationOsdWindow.qml's waveform.
#
# This is a SEPARATE cava instance from the one IslandBackend spawns for the
# music EQ (see IslandSystemState.qml's cavaLevels / SystemServices) — that
# one reads the sink MONITOR (what is playing), this one reads the SOURCE
# (what the mic is hearing), because dictation has no "now playing" stream to
# tap. Two instances, two config files, no shared state: cheaper to reason
# about than teaching one cava process to switch inputs mid-run, and it only
# exists while shellRoot.dictationActive is true (see shell.qml) — this is
# not a second process idling forever alongside the real one.
[general]
# ONE bar, not sixteen. DictationOsdWindow.qml draws a time-domain scrolling
# waveform trace (Voxtype's own OSD shape), not a frequency-spectrum bar
# graph -- that needs one scalar amplitude sample per frame (the same role
# as Voxtype's own AudioBridge `peak` field), not a multi-band spectrum
# snapshot. shell.qml's dictationCavaProcess pushes each frame's single
# value onto a scrolling ring buffer and draws THAT.
bars = 1
framerate = 30
# Higher than the music feed's implicit default: a mic close-talked at
# normal speaking volume peaks much quieter than a mixed music track. NOT
# measured against actual speech (this was written and syntax-tested against
# silence only, see the fork's own report) -- autosens is on precisely so a
# wrong starting guess self-corrects rather than needing to be exactly right.
sensitivity = 160
autosens = 1

[input]
method = pulse
# "auto" resolves to whatever PipeWire reports as the default SOURCE, which
# on this machine already IS the mic (`pactl get-default-source` ->
# alsa_input...analog-stereo, not a `.monitor`) — confirmed, no override
# needed. whisper-stream captures the same source concurrently via its own
# SDL2 audio device; PipeWire fans one hardware capture node out to multiple
# client streams natively, so the two do not contend for the device the way
# two ALSA `hw:` opens would.
source = auto
#
# The multi-consumer claim above (cava + whisper-stream's SDL2 capture both
# reading the source at once, no contention) was checked with two `parec`-
# family clients open on this source simultaneously -- both ran without any
# device/exclusivity error, consistent with how PipeWire fans out a capture
# node. It was NOT checked with cava and a live whisper-stream running
# together, since that needs an actual spoken recording session to trigger.

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
# Found live: with this missing, cava refused to start at all --
# "fixed number of bars must be at least 1 with mono output and 2 with
# stereo output" -- and exited immediately, silently leaving
# dictationWaveformRing empty for the whole session (whisper-stream was
# running, the state file said "listening", nothing was wrong upstream of
# this file). `channels` here is cava's VISUAL/output channel count, not
# an input-capture setting -- cava's own [input] `channels` key is
# JACK-only and does nothing for `method = pulse`, which is what misled
# the first pass into leaving this unset. Explicit `mono` is what makes
# `bars = 1` a valid combination regardless of whether the mic source
# PipeWire hands cava is itself mono or stereo.
channels = mono
# 0..100 for the single bar, matching the 0..1 range shell.qml's
# dictationCavaProcess divides by 100 before pushing onto the waveform ring.
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
# Trimmed from cava's own default (higher) on the same reasoning as
# `sensitivity` above: a dictation waveform is meant to track syllables, and
# cava's default noise reduction is tuned for music, not speech. Also NOT
# measured against actual speech -- worth revisiting once someone can
# actually watch it react while talking.
noise_reduction = 40
