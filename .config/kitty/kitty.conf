# =============================
# TERMINAL TYPE
# =============================
env TERM xterm-256color

shell /usr/bin/fish
# =============================
# FONT (Exact match)
# =============================
font_family        FiraCode Nerd Font
bold_font          FiraCode Nerd Font Bold
italic_font        FiraCode Nerd Font Italic
bold_italic_font   FiraCode Nerd Font Bold Italic
font_size          11.0

# Alacritty font offset y = 1
modify_font cell_height 0px

# =============================
# CURSOR (Exact match)
# =============================
cursor                 #3498db
cursor_text_color      background
cursor_shape           block

# =============================
# COLORSCHEME (managed by theme-apply — symlink to themes/*.conf)
# =============================
include themes/current.conf

# =============================
# WINDOW (Exact match)
# =============================
background_opacity 0.95
dynamic_background_opacity no

window_padding_width 6 6
# resize_delay 0

# title Alacritty
# wm_class Alacritty,Alacritty

# =============================
# SCROLLBACK
# =============================
scrollback_lines 5000

# =============================
# KEYBOARD (EXACT REPLICA)
# =============================
map ctrl+shift+v      paste_from_clipboard
map ctrl+shift+c      copy_to_clipboard
map shift+insert      paste_from_selection

map ctrl+0            change_font_size all 0
map ctrl+equal        change_font_size all +1
map ctrl+plus         change_font_size all +1
map ctrl+minus        change_font_size all -1

map f11               toggle_fullscreen
# map ctrl+l            clear_log
# map ctrl+l            send_text all \x0c

map page_up           scroll_page_up
map page_down         scroll_page_down
map shift+home        scroll_home
map shift+end         scroll_end


# =============================
# MOUSE & SELECTION (Alacritty-like)
# =============================
copy_on_select  no
mouse_hide_wait 0


# Enable image support (✅ this is the key part)
# enable_images          yes
allow_remote_control   yes
listen_on unix:/tmp/kitty
enable_graphics yes
shell_integration      enabled



confirm_os_window_close 0



# --- ALACRITTY-LIKE SELECTION BEHAVIOR ---

# Release and grab the mouse (exact like Alacritty Ctrl+Shift+Space)
map ctrl+shift+space show_scrollback

# Normal copy/paste keys
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Immediate visual selection feedback
copy_on_select yes

# Let mouse selection work even if program grabs mouse
mouse_hide_wait 0

# Disable kitty scroll pager (avoid "less" mode confusion)
map ctrl+shift+h noop


# Scrolling always works.
# pixel_scroll yes = smooth sub-line scrolling on the touchpad. It makes kitty
# ignore wheel_scroll_multiplier (that only applies to low-precision devices),
# so touchpad *speed* is tuned via libinput's ScrollPixelDistance in
# ~/.config/qtile/autostart.sh instead. The multiplier below still governs a
# plain wheel mouse.
pixel_scroll yes
wheel_scroll_multiplier 2

# Force kitty not to trap mouse in apps
enable_audio_bell no

# map ctrl+shift+space launch --location=hsplit --stdin-source=@screen_scrollback nvim -c "setlocal buftype=nofile ft=man nonumber norelativenumber nolist showtabline=0 foldcolumn=0" -c "silent! %s#\\e\\[[0-9;]*[A-Za-z]##g" -c "silent! %s#\\e]133;A##g" -c "autocmd VimEnter * normal G"
# Scrollback in nvim. Yanking here has to survive nvim closing.
#
# It did not, and the reason is X11, not nvim: a yank to "+ makes NVIM the
# owner of the CLIPBOARD selection, and an X selection dies with the process
# that owns it. Close the scrollback pager and the clipboard is not just
# stale -- it is empty, and it has also destroyed whatever was in it before.
# Inside kitty the paste appeared to work only because kitty had its own
# copy.
#
# --cmd (before config, so LazyVim cannot override g:clipboard) routes the
# clipboard through copyq, which is already running as the clipboard manager
# and is a persistent daemon: it takes ownership and keeps serving the
# content long after nvim is gone.
map ctrl+shift+space launch --location=hsplit --stdin-source=@screen_scrollback nvim --cmd "let g:clipboard = {'name':'copyq','copy':{'+':'copyq copy -','*':'copyq copy -'},'paste':{'+':'copyq clipboard','*':'copyq clipboard'},'cache_enabled':0}" -c "set clipboard=unnamedplus" -c "setlocal buftype=nofile ft=man nonumber norelativenumber nolist showtabline=0 foldcolumn=0" -c "silent! %s#\\e\\[[0-9;]*[A-Za-z]##g" -c "silent! %s#\\e]133;A##g" -c "autocmd VimEnter * normal G"
