description: Packages `wizard.sh --audit` must not report as drift

# Deliberately installed-but-undeclared. Every entry needs a reason, or it
# is just a way to silence the audit and let real drift back in.
#
# NOT a module: this file lives outside modules/ so dcli never reads it.

packages:
  # --- chosen at runtime, cannot be declared statically ---
  - intel-ucode      # CPU-vendor specific. step_gpu picks intel-ucode or
  - amd-ucode        # amd-ucode from /proc/cpuinfo. Declaring either would
                     # ship the wrong microcode to half of all machines.

  # --- build artefacts, not things anyone chose ---
  # Note: anything matching *-debug is filtered by the audit itself --
  # makepkg emits one per source build, so naming them here would be a
  # list that grows every time a package is built from source.
  - spirv-headers    # `pactree -r` is empty for both: nothing requires
  - vulkan-headers   # them, leftovers from a build that no longer exists

  # --- built from a vendored, pinned PKGBUILD, not from a repo ---
  - picom-ftlabs-git
  - picom-ftlabs-pinned
                     # wm.yaml deliberately declares neither: the AUR
                     # package floats on branch `next`, so the wizard's
                     # picom-pin module builds a commit-pinned copy from
                     # arch-config/pkgbuilds/ instead. Whichever of the two
                     # is installed, it is intentional.

  # --- declared once by mistake; must NOT be reproduced ---
  - gtkmm            # the bare name resolves to gtkmm2 (1:2.24.5), dropped
                     # from the official repos, so system-tools.yaml was
                     # making every fresh install pay for an AUR compile.
                     # Nothing ever used it: `pactree -r gtkmm` lists only
                     # itself, pacman -Qi says Required By: None. Undeclared
                     # now, but still installed here -- removing a package
                     # from a working machine is not something an audit fix
                     # should do behind your back. Reclaim the 6.84 MiB
                     # whenever you like: pacman -Rns gtkmm

  # --- duplicates of something already declared ---
  - pcmanfm          # superseded by pcmanfm-qt (apps.yaml). The GTK build is
                     # still installed on the ati host and still pulled in as a
                     # dependency by parts of the LXDE stack; nothing in the
                     # config launches it any more. Harmless to leave, not
                     # worth reproducing on a fresh machine.

  - hyprpaper        # superseded by awww (wm.yaml). Nothing in the Hyprland
                     # session calls it any more: wallpaper-set.sh only
                     # resolves the path and execs wallpaper-sync.sh, which
                     # drives `awww img`. The remaining mentions are prose
                     # in REQUIREMENTS.md and comments recording the swap.
                     # qtile cannot want it back -- hyprpaper is Wayland-only
                     # and that session is X11. Left installed rather than
                     # removed, per the rule above: pacman -Rns hyprpaper
                     # whenever you like.

  # --- conflicts with a declared package; must NOT be reproduced ---
  - power-profiles-daemon
                     # fights auto-cpufreq (system-tools.yaml) for the CPU
                     # governor; archinstall installs it by default, so a
                     # fresh machine gets the conflict without choosing it.
                     # speed_boost.sh now disables it explicitly. Left
                     # installed but masked-off rather than removed -- it is
                     # a dependency of some desktop tooling.

  # --- superseded on this host; present only because archinstall added
  #     them. Declaring them would push a display manager and a second
  #     bootloader onto every fresh machine, which is the opposite of what
  #     the wizard's disable-dm and boot-fallback modules do. ---
  - grub
  - lightdm
  - lightdm-gtk-greeter

  # --- legacy DDX drivers. Modern Intel/AMD/NVIDIA all use the kernel
  #     driver plus xorg-server's built-in modesetting DDX; these separate
  #     X drivers are a known source of tearing and of picom's glx backend
  #     misbehaving, which is exactly the UI this repo cares about. ---
  - xf86-video-amdgpu
  - xf86-video-ati
  - xf86-video-nouveau
  - vulkan-nouveau

  # --- superseded by voxtype-bin (system-tools.yaml), same shape as the
  #     gtkmm/pcmanfm entries above: left installed rather than removed. ---
  - whisper.cpp-git  # the custom whisper.cpp pipeline voxtype-bin's own
                     # comment says it replaces (see system-tools.yaml:
                     # "replacing the old whisper.cpp-git/ati-voice-dictate").
                     # pacman -Rns whisper.cpp-git whenever you like.
  - cmake            # was whisper.cpp-git's build dependency (AUR builds
                     # from source). Not reclaimed alongside it: cmake is a
                     # generic build tool other AUR packages may still pull
                     # in, so removing it isn't as safe a call as the
                     # package it was actually installed for.
