# Fallback kernel entry -- pick this at the boot menu when a `linux`
# upgrade leaves the system unbootable. Repair from here instead of
# hunting for an Arch ISO.
#
# Uses vmlinuz + initramfs directly rather than a Unified Kernel Image:
# the main entry boots /EFI/Linux/arch-linux.efi (a UKI with the cmdline
# baked in), but linux-lts does not produce one, so this is a plain
# type-1 entry. Options copied from the RUNNING /proc/cmdline, which is
# authoritative -- arch.conf's options line has a stale PARTUUID and is
# ignored for UKI boots.
title   Arch Linux (LTS fallback)
linux   /vmlinuz-linux-lts
initrd  /intel-ucode.img
initrd  /initramfs-linux-lts.img
options root=PARTUUID=021e8f52-2c2d-40cf-b36a-d326af267740 zswap.enabled=0 rw rootfstype=ext4
