# Last-resort rescue entry. Same LTS kernel as arch-lts.conf, but paired
# with the -fallback initramfs built WITHOUT autodetect, so it carries
# every module rather than only those probed on the machine that built
# it. Slower to boot and ~205MB, but it still comes up when the trimmed
# image is missing something (hardware changed, a driver was not loaded
# at build time).
title   Arch Linux (LTS rescue - all modules)
linux   /vmlinuz-linux-lts
initrd  /intel-ucode.img
initrd  /initramfs-linux-lts-fallback.img
options root=PARTUUID=021e8f52-2c2d-40cf-b36a-d326af267740 zswap.enabled=0 rw rootfstype=ext4
