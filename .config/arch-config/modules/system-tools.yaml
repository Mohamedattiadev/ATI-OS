description: System utilities

packages:
  # Rescue editors. Small, and the thing you need at a TTY when the nvim
  # config is exactly what broke -- so they belong in the first pass, not
  # the optional one.
  - vim
  - nano
  - ufw
  - acpi
  - brightnessctl
  - powertop
  # - tlp               -- not using
  - smartmontools
  - unzip
  - zip
  - wget
  - xclip
  - xdotool
  - inotify-tools
  - translate-shell
  - sweet-gtk-theme-dark
  # gtkmm removed: the bare name resolves to gtkmm2 (1:2.24.5), dropped
  # from the official repos -- only gtkmm3 and gtkmm-4.0 are there now --
  # so declaring it made every fresh install pay for an AUR compile.
  # Nothing here ever used it: on a fully installed machine `pactree -r
  # gtkmm` lists only gtkmm itself and pacman -Qi reports
  # `Required By: None` / `Optional For: None`. If a C++ GTK binding is
  # ever genuinely needed, name the version: gtkmm3 or gtkmm-4.0.
  - libwnck3
  - auto-cpufreq
  - glow             # markdown renderer -- rofi_docs' fallback viewer when
                     # nvim is unavailable, and nicer than bat for prose
  - less             # NOT in the `base` group, and nothing else pulls it in.
                     # Every pager path in rofi_docs went through it -- `glow
                     # -p` and `bat --paging` both EXEC less rather than
                     # scrolling themselves, so on a host without it the
                     # viewer terminal opened and died in ~0.2s with
                     # "less: command not found". Declared, not assumed.
  - didyoumean
  - dmscripts-git
  - shell-color-scripts-git
  - findutils
  - shellcheck
  - udisks2
  # awk, sed, coreutils, findutils, man-db, man-pages already in base group
  - openssh
  - slop
  - ffmpeg
  - jq
  - evtest
  - xcape
  - python-tqdm
  - dmenu           # rofi fallback used by dmscripts
  - slock           # lock fallback in dm-logout
  # Hintium / homerow -- Hint-Mode, Scroll-Mode and the caret modes. All of
  # these were installed on the development machine and declared nowhere, so
  # a fresh install got a Super+Shift+F chord whose binary did not exist.
  # at-spi2-core is not optional decoration: the accessibility tree is the
  # entire premise of hint mode, and without it homerow sees no UI elements
  # at all and simply shows nothing.
  - at-spi2-core
  - libx11
  - libxtst
  - openbsd-netcat  # the homerow client talks to its daemon over a socket
  - vte3
  - poppler         # pdftotext, pdfinfo, pdftoppm, pdfimages — rofi_ilovepdf
  - ghostscript     # pdf compression + repair in rofi_ilovepdf
  # qpdf carries every page-level operation in rofi_ilovepdf: merge, split,
  # rotate, extract/delete pages, encrypt, decrypt. It was already on this
  # machine, but ONLY as a dependency of libcupsfilters -- so it would have
  # gone the moment the print stack did, and on a machine with a different
  # printing setup it may never arrive at all. Declared explicitly because
  # something depends on it directly now.
  #
  # gs is deliberately not used for merging: it re-writes every page through
  # its interpreter and silently drops form fields, annotations and
  # bookmarks. qpdf copies the page objects intact.
  - qpdf
  # OCR for rofi_ilovepdf's "make text selectable". The action is hidden
  # from the menu when tesseract is absent rather than failing, so this is
  # what turns the feature on. -data-eng is the language model; add
  # tesseract-data-<lang> for others.
  - tesseract
  - tesseract-data-eng
  - wl-clipboard    # wl-copy fallback in fish scripts
  - whisper.cpp-git # voice_dictate backend (AUR)
  - yt-dlp
  - xdg-utils
  - stow
  - imagemagick
  # files sys ,  mounts , media transfer
  - gvfs
  - gvfs-mtp
  - openslide
  - curl
  - gum
  # --- update safety net (see safe-update + TROUBLESHOOTING) ---
  - informant            # blocks -Syu until Arch news is read; those are the
                         # posts that say 'manual intervention required'
  - downgrade            # roll back ONE bad package without a full restore
  - pacman-static        # statically linked pacman -- still runs when a libc
                         # or libstdc++ upgrade breaks dynamic linking, which
                         # is exactly when normal pacman cannot help you.
                         #
                         # COST: this is BY FAR the longest build in the
                         # whole install -- it compiles pacman and every
                         # one of its dependencies (openssl, libarchive,
                         # curl, gpgme, ...) statically from source, much
                         # of it single-threaded through autotools
                         # configure. Measured in a 4-vCPU VM it ran for
                         # roughly an hour on its own, most of a fresh
                         # install's total time.
                         #
                         # Kept anyway: the one day it matters is the day
                         # nothing else can install anything, and an hour
                         # once beats an unrecoverable machine. But it is
                         # a deliberate trade, not a free one -- if you
                         # want faster installs, this is the line to move
                         # to optional.yaml.
  - python-pywal
  - papirus-icon-theme
  - papirus-folders        # AUR -- folder color swap used by theme-apply; silently
                            # no-ops (icons stay default color) if missing
  - flatpak
  - dbus-broker
  - libnotify              # notify-send (qupdate background completion notifications)
  - gammastep              # nightlight widget (w_nightlight) -- invisible without it
