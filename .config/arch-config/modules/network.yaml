description: Networking and wireless stack

packages:
  # The daemon behind wm.yaml's network-manager-applet. It was never
  # declared -- it is present on this host only because archinstall put it
  # there, so a fresh machine got the tray applet with nothing to talk to
  # and no network GUI at all.
  - networkmanager
  # Private mesh network. Two jobs here: it is how the phone reaches the
  # local Vaultwarden (Mod+p p) without opening a port to the LAN or the
  # internet, and `tailscale cert` issues a publicly-trusted certificate
  # for the *.ts.net name -- the only practical way to satisfy the
  # Bitwarden app, since Android does not trust user-installed CAs.
  - tailscale
  # mDNS. Present on this host only as a chromium/cups dependency, which
  # is the same accident networkmanager above was -- and it is load
  # bearing now: ati-phone-screen finds the phone's wireless-debugging
  # host:port by reading its _adb-tls-connect._tcp announcement through
  # avahi-browse. Arch's android-tools is built WITHOUT mDNS (`adb mdns
  # services` answers "unknown host service"), so adb cannot do that
  # lookup itself. Drop avahi and the phone mirror goes back to copying
  # a fresh random port off the phone by hand every session.
  - avahi
  - iwd
  - wpa_supplicant
  - wireless_tools
  - bluez
  - bluez-utils

exclude: []
conflicts: []
