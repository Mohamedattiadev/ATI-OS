description: Media and audio stack

packages:
  - pipewire
  - pipewire-alsa
  - pipewire-pulse
  - pipewire-jack
  - wireplumber
  - alsa-utils
  - libpulse
  # mpris widget + media keybindings, and since the lock screen grew a
  # now-playing card (hypr/scripts/lock-player.sh) it is also what that
  # reads. hyprlock has no widget that can take a click, so the card is
  # a readout and the transport stays on the hardware keys — which are
  # compositor binds and keep working while locked.
  - playerctl
  # The notch's resting state is specified as exactly two things: the clock
  # and a 4-bar EQ that moves only while music actually plays. Quickshell's
  # cava integration shells out to the cava binary, and without it the bars
  # render but their levels are pinned at zero -- so the EQ looks correct,
  # animates never, and nothing anywhere says why. Half the resting state.
  - cava
  - gst-plugin-pipewire
  - sox
  - espeak-ng
  - easyeffects     # dm-eq-profiles
  - timidity++      # dm-music MIDI
  - wildmidi        # dm-music MIDI

exclude: []
conflicts:
  - pulseaudio
  - pulseaudio-alsa
  # jack2 also provides the virtual `jack`, which ffmpeg, mpv and
  # timidity++ all depend on. If it gets chosen to satisfy that dependency
  # it conflicts with pipewire-jack above, and pacman aborts the ENTIRE
  # transaction -- so nothing installs at all and every later module fails
  # for want of its packages. A clean VM install came out 41 ok / 5 failed
  # from exactly this, with the desktop falling back to stock qtile.
  # wizard.sh's dcli-sync step installs pipewire-jack before syncing so the
  # provider is never ambiguous; this records why, next to the packages.
  - jack2
