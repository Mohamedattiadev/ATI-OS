description: Window manager and desktop environment && apps

packages:
  - qtile            # the WM itself -- was only ever pulled in as a
                     # qtile-extras dependency, so a packaging change
                     # upstream could have silently removed the desktop
  - qtile-extras
  - qt6ct            # Qt apps (telegram) ignore the GTK theme; qt6ct reads
  - qt5ct            # the palette theme-apply writes, so they follow the mode
  # picom is NOT declared here. The animation-capable fork is built from a
  # PINNED commit by the wizard's `picom-pin` module, from
  # arch-config/pkgbuilds/picom-ftlabs-pinned/.
  #
  # The AUR package picom-ftlabs-git tracks `#branch=next`, so it rebuilds
  # from whatever the branch tip is at install time. Two machines set up
  # from this repo months apart would get two different compositors from
  # the same declared name -- and picom decides whether animations, rounded
  # corners, shadows and blur look right. Declaring it here would have dcli
  # install the floating AUR build and conflict with the pinned one.
  - light
  - betterlockscreen
  - gromit-mpx
  - screenkey
  - espanso-x11
  - network-manager-applet
  # qrencode: the WiFi popup's QR share (Mod+p n, then s on a saved
  # network). The popup still runs without it -- the QR panel is the one
  # thing that says "qrencode not found" instead of drawing a code.
  - qrencode
  - blueman
  - syncthing

  # ---------------------------------------------------------------
  # Hyprland — the parallel Wayland session (see ../../hypr/).
  #
  # Declared here rather than in a module of its own so the existing
  # wizard step list and the docs claims about it stay accurate; this
  # is the window-manager module and Hyprland is a window manager.
  #
  # qtile remains the default session. Nothing here replaces it: both
  # are selectable at login and share theme state through theme-apply.
  # ---------------------------------------------------------------
  - hyprland
  - xdg-desktop-portal-hyprland   # screen sharing, file pickers, and the
                                  # portal every Electron app asks for
  # Wallpaper, fed by hypr/scripts/wallpaper-sync.sh. This was hyprpaper
  # until the transition work: hyprpaper has no transition of any kind --
  # `hyprctl hyprpaper wallpaper` swaps the buffer between two frames, so
  # every change was a hard cut. awww is what swww was renamed to, and
  # Arch ships it as extra/awww (NOT the AUR, and NOT under `swww` --
  # every guide still says swww, which is why the first attempt here
  # failed against a hyprpaper-only machine and looked like a bad
  # parameter name rather than a missing package).
  - awww
  - hypridle
  - hyprlock
  - qt5-wayland                   # without these, Qt apps fall back to
  - qt6-wayland                   # XWayland and ignore fractional scaling
  - polkit-kde-agent               # the auth prompt; X11 used lxqt-policykit
  # grim + slurp replace maim/xclip for the Print-key screenshot path.
  # There is no Wayland equivalent of a plain X11 screen grab, so losing
  # either one breaks the binding outright rather than degrading it.
  - grim
  - slurp
  # wtype synthesises keystrokes through zwp_virtual_keyboard_manager_v1.
  # Not part of any binding -- it exists so hyprlock can be TESTED. A lock
  # screen that accepts any password looks identical to a working one, so
  # it has to be driven with a deliberately wrong password and observed to
  # reject it. Doing that against the real session locks you out of the
  # machine you are testing from; instead run a nested Hyprland (it takes
  # the next free wayland-N socket), point wtype at that display, and only
  # the nested compositor locks. See MIGRATION.md.
  - wtype
  # The bar. Hyprland has no built-in one, and qtile's was 7,900 lines of
  # Python widgets that do not port -- see hypr/MIGRATION.md.
  #
  # tide-island is an AUR package (the wizard installs modules with yay,
  # so repo and AUR entries sit in the same list). It is a compiled
  # C++/Qt QML shell, NOT a drop-in Quickshell config directory: its
  # shell.qml imports the IslandBackend module, so it has to be built and
  # installed rather than pointed at with `qs -c`. Ours is only the
  # config, ~/.config/tide-island/userconfig.json, which is stowed from
  # this repo and carries the hypr/DESIGN-SPEC.md restyle.
  #
  # quickshell is listed explicitly even though tide-island pulls it in:
  # it is the runtime the bar executes under (`quickshell -p
  # /usr/share/tide-island`), and any future shell work depends on it
  # directly rather than transitively.
  - quickshell
  - tide-island
  # keyd remaps Caps to Alt at the evdev layer, BELOW the display server.
  # This laptop's physical Alt is dead in hardware (see hypr/input.conf),
  # and ~40 bindings use Alt. X11 solved it with ~/.Xmodmap, which does
  # not exist on Wayland, and xkb ships no caps:alt option. Doing it in
  # evdev means one remap serves both sessions instead of two configs
  # drifting apart -- so this is required for Hyprland and useful for
  # qtile, not optional for either.
  - keyd
