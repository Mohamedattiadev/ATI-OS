description: Xorg, input, and display utilities

packages:
  - xorg-server
  - xorg-xinit
  - xorg-xinput
  - xorg-xev
  - xorg-fonts-encodings
  - xorg-setxkbmap
  - xorg-xsetroot    # .xinitrc sets the root cursor with it; the call is
                     # guarded, so without this the cursor silently stayed
                     # the X11 default X on a fresh install
  - xorg-fonts-misc
  # All three arrive today only as dependencies of arandr / betterlockscreen
  # / xorg-xinit. That is the same fragility wm.yaml documents for qtile:
  # an upstream packaging change drops the dep and the desktop loses a
  # piece with no other warning. xrdb is the sharpest -- .xinitrc loads
  # .Xresources through it, and that is what sets cursor size and theme, so
  # losing it means every cursor silently reverts on a fresh install.
  - xorg-xrandr
  - xorg-xrdb
  - xorg-xset
  - wmctrl
  - xwallpaper
  # The X11 compatibility layer a Wayland compositor runs X clients under.
  # Arrives today only as a dependency, which is the same fragility the
  # three above document -- and it matters more here, because the whole
  # rofi/dmscripts launcher set, gromit-mpx and the Brave --app windows
  # all run through it in the Hyprland session (see ../../hypr/). Losing
  # it silently would take out ~30 keybindings there while leaving the
  # qtile session untouched, which is the hardest kind of breakage to
  # trace back to a packaging change.
  - xorg-xwayland

exclude: []
conflicts: []
