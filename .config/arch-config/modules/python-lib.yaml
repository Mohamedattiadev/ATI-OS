description: Python tooling and libraries

packages:
  - python-pip
  - python-pipx
  - python-setuptools
  - python-wheel
  - python-build
  - python-installer
  - python-packaging
  - python-rich
  - python-pillow
  - python-beautifulsoup4
  - python-gtts
  - python-dbus-next
  - python-dbus-fast
  - python-pulsectl
  - python-psutil
  - python-gobject      # qdrop + qupdate GTK3 UI, and the restart veil
                        # (qtile/scripts/qtile-restart-veil.py). Without it
                        # the veil cannot start and Super+Shift+R silently
                        # falls back to a plain restart -- the window pile
                        # comes back and nothing says why.
  - python-simplenote   # ati-simplenote-push: two-way sync between the Mod+Shift+S
                        # TODOS note and the Simplenote phone app (push on :w,
                        # pull when the window opens). Without it the hook logs
                        # an ImportError to ~/.local/state/simplenote-push/ and
                        # the note silently stops syncing -- by design the hook
                        # never interrupts a save, so nothing surfaces in nvim.
                        # AUR, and the last PKGBUILD bump was years ago; it is
                        # pinned to the API this script uses, so a drop from the
                        # AUR is the thing to watch, not a version bump.
  - python-xcffib       # veil's event-driven always-on-top (SubstructureNotify
                        # on root). Already pulled in by qtile; declared so a
                        # future qtile that drops it does not take the veil
                        # with it.

exclude: []
conflicts: []
