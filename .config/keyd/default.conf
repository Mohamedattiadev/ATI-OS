# keyd — /etc/keyd/default.conf
#
# keyd reads /etc, which is root-owned, so this file cannot be symlinked into
# place the way everything else under .config is. It is the source of truth
# and is COPIED, by hand, whenever it changes:
#
#     sudo install -m644 ~/.config/keyd/default.conf /etc/keyd/default.conf
#     sudo keyd reload
#
# It lives in the repo anyway because it is load-bearing for two things the
# desktop assumes and neither is discoverable from /etc: Caps behaving as
# Alt, and the AltGr repeat key. Before this file existed, /etc/keyd was the
# only record of either.

[ids]
*

[main]

# ---- CAPS IS ALT ----
# hypr/input.conf explains the whole reason this is done in keyd rather than
# in xkb: there is no `caps:alt` xkb option (it ships caps:super,
# caps:ctrl_modifier, caps:escape, caps:hyper -- but not alt), and xmodmap
# does not exist on Wayland. keyd is the remaining route.
capslock = leftalt

# ---- ALTGR: HOLD IS STILL ALTGR, TAP REPEATS THE LAST ACTION ----
#
# "making the altgr doing the last action i did for example i clciked :
# alt+space to open hintium , so i click again the altgr it bevioe like the
# alt+space got it ?"
#
# `overload(altgr, f13)` = hold it and it is AltGr exactly as before; tap it
# and release without pressing anything else, and it emits F13. Hyprland
# binds F13 to `ati-do --repeat`.
#
# THE HOLD BEHAVIOUR IS NOT OPTIONAL HERE. kb_layout on this machine is
# `us,ara,tr,de` (hypr/input.conf) and AltGr is how the Arabic, Turkish and
# German layouts reach their third level -- taking it away outright would
# cost real characters in three of the four layouts. overload keeps both.
#
# Why keyd and not a Hyprland bind on ISO_Level3_Shift: a compositor bind on
# a modifier cannot tell a tap from a hold, and the keysym the right Alt
# actually emits DIFFERS BY LAYOUT (Alt_R on plain `us`, ISO_Level3_Shift on
# `de`), so a keysym bind would work in some layouts and silently not in
# others. keyd sits below the layout and sees the physical key either way.
rightalt = overload(altgr, f13)
