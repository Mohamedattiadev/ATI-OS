--enable-features=WebContentsForceDark
--gtk-version=4
--load-extension=/home/ati/.config/qtile/browser-theme
# Interpolate between the coarse scroll events libinput sends on X11.
# Without this Chromium jumps a whole step per event instead of animating.
--enable-smooth-scrolling

# Exposes page content to AT-SPI so homerow can hint links and buttons.
# Costs memory per open tab; remove this line if that becomes a problem.
--force-renderer-accessibility
