# ============================================================
#  Autostart — ported from ../qtile/autostart.sh
#
#  Dropped, with reasons:
#    picom      — Hyprland IS the compositor; blur/shadows/animations
#                 are configured in looks.conf instead.
#    xinput ... — the touchpad scroll-distance loop is X11-only; the
#                 equivalent lives in input.conf's touchpad block.
#    hintium-daemon — X11-native, see binds.conf.
#    qdrop.py / qdrop_watch.py — replaced by special workspaces.
#    keyboard_layout_watcher — watched the X11 layout for the qtile
#                 widget; the bar will read layout state directly.
# ============================================================

# ------------------------------------------------------------
#  Session essentials — must come first
# ------------------------------------------------------------
# hyprpm's "enabled" flag persists, but it does NOT make a fresh
# compositor load the plugin — that needs an explicit reload each
# session, or hyprglass simply is not there and hyprglass.conf's
# settings sit inert with no error. -n suppresses the notification.
exec-once = hyprpm reload -n
exec-once = /usr/lib/polkit-kde-authentication-agent-1 &
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# lxqt-policykit-agent works on Wayland too; use it if the KDE one is
# not installed.  Only one should run.
# exec-once = lxqt-policykit-agent

# ------------------------------------------------------------
#  Daemons carried over unchanged — these were never X11-dependent
# ------------------------------------------------------------
# dunst is NOT started here any more. The island serves
# org.freedesktop.Notifications itself — see
# quickshell/tide-island-fork/qml/common/NotificationService.qml for why,
# and upgread_UI_UX.md P0-1 for the screenshot that proved every
# notification on this desktop was being drawn twice, by both of them, at
# the same moment.
#
# It is REMOVED FROM AUTOSTART, not uninstalled, and that distinction is
# load-bearing three times over:
#
#   1. `dunstctl` is still the daemon control this desktop uses. The
#      control centre's Silent/DND row was rewritten onto it, and
#      submap-indicator.sh falls back to `dunstify` when the island is
#      down — which is exactly the window this arrangement creates.
#   2. dunst ships /usr/share/dbus-1/services/org.knopwob.dunst.service,
#      so the bus will START IT ON DEMAND if a notification is sent while
#      nothing owns the name. Measured: with the island killed,
#      `busctl --user list` reports the name as "(activatable)" and
#      `notify-send` still succeeds. The "notifications stop system-wide
#      if the shell has a bug" hazard the plan warned about therefore does
#      not exist on this machine — the fallback is automatic and needs no
#      line here.
#   3. Which creates the one ordering problem worth knowing about: if
#      dunst gets activated that way, it HOLDS the name, and a later
#      island start would queue behind it forever rather than fail
#      loudly. island.sh clears that before launching. See the note there.
exec-once = copyq
exec-once = kdeconnectd
exec-once = nm-applet --indicator --no-agent
exec-once = blueman-applet

# ------------------------------------------------------------
#  Wayland-specific replacements
# ------------------------------------------------------------
# awww (formerly swww) replaces hyprpaper — hyprpaper has no transition at
# all, so every wallpaper change was a hard cut. wallpaper-sync.sh starts the
# daemon itself if it is not up, so this line is belt-and-braces rather than
# load-bearing; it is kept so the daemon is alive before anything else asks.
exec-once = awww-daemon
exec-once = hypridle
# Point hyprpaper at whatever pywal last applied, so both sessions agree
# on the wallpaper. Waits for the hyprpaper IPC socket rather than sleeping.
exec-once = ~/.config/hypr/scripts/wallpaper-sync.sh
# wl-paste watchers give copyq the same clipboard reach it had via X11.
exec-once = wl-paste --type text --watch copyq add -
exec-once = wl-paste --type image --watch copyq add -

# ------------------------------------------------------------
#  The bar — Tide Island, FORKED
#
#  NOT `qs -c tide-island`, and no longer the packaged `tide-island`
#  binary either.
#
#  The `qs -c` form assumed a plain Quickshell config directory, which
#  Tide Island is not: shell.qml imports IslandBackend, a compiled C++/Qt
#  QML module, so the package installs to /usr and its own launcher runs
#  `quickshell -p /usr/share/tide-island`.
#
#  Config alone could not reach three things the design asks for — the
#  animation curve, the notch morph, and a theme picker — so the QML is
#  now vendored into this repo at ../quickshell/tide-island-fork and
#  launched from there, keeping the packaged compiled backend. A QML tree
#  at any path still resolves `import IslandBackend`, because
#  /usr/lib/qt6/qml is a default Qt import path; that was verified before
#  committing to the approach. See that directory's FORK-NOTES.md.
#
#  The CONFIG is still ours too: ~/.config/tide-island/userconfig.json,
#  stow-symlinked into this repo, carrying the DESIGN-SPEC.md restyle
#  (black pill scaled to this panel, 11px margin, Inter, 24h clock).
#
#  The package also ships tide-island.service as a systemd user unit. We
#  start it here instead, so the bar's lifetime is tied to the Hyprland
#  session rather than to login — the qtile session must not get one too.
# ------------------------------------------------------------
# ---- WHICH BAR, AND WHY IT IS A SCRIPT AND NOT TWO exec-once LINES ----
#
# This session has TWO bars now: the island, and the Quickshell topbar that
# mirrors qtile's (scripts/topbar.sh, ../quickshell/topbar). Which one comes
# up is a SAVED CHOICE in ~/.cache/bar-mode, written by AtiScriptsV1/bar-switch
# and read by the qtile session too — so picking a bar in either session and
# logging into the other lands you on the bar you picked.
#
# Hyprland has no conditional in its config language, so the choice is made in
# a shell fragment. `bar-switch` is NOT used here even though it is the thing
# that owns the decision: it STOPS the other bar as part of switching, and at
# autostart there is no other bar running to stop — calling it would make
# every login a switch rather than a start, and its "bring the incoming bar up
# and check it before taking the outgoing one away" ordering has nothing to do
# at this point. Reading the file and launching one process is the whole job.
#
# Default is the island when the file is missing or unreadable, matching
# bar-switch's own DEFAULT_MODE. Note this is the OPPOSITE default from
# qtile's bar_switch_mode(), deliberately: there, "native" is the safe fall-back
# because qtile's own bar is the one that is definitely present; here the
# island is the bar this session has always had.
exec-once = sh -c 'if [ "$(cat ~/.cache/bar-mode 2>/dev/null | tr -d "[:space:]")" = native ]; then ~/.config/hypr/scripts/topbar.sh; else ~/.config/hypr/scripts/island.sh; fi'
# exec-once = waybar

# Chord indicator. qtile's KeyChord named the active mode in the bar;
# Hyprland submaps give no feedback at all, so entering one is invisible
# and the compositor just starts swallowing keys. This listens on
# Hyprland's event socket and raises a non-expiring notification naming
# the mode and its keys, cleared the moment the submap resets.
#
# It lands IN the island for free: Tide Island renders notifications in
# the capsule, so the mode shows up exactly where the bar used to say it.
exec-once = ~/.config/hypr/scripts/submap-indicator.sh

# Per-workspace layouts. Every qtile Group declares its own layout and the
# layout follows the group; Hyprland has no per-workspace layout at all and
# a `workspace = 7, layout:master` rule is accepted and discarded without
# an error. This watches the same event socket the chord indicator does and
# re-applies the workspace's layout on arrival, so the property lives with
# the workspace instead of with whatever you last pressed $mod Tab on.
# Table and reasoning in scripts/layout-cycle.sh.
exec-once = ~/.config/hypr/scripts/workspace-layout.sh

# ------------------------------------------------------------
#  Personal background scripts — verified WM-independent
# ------------------------------------------------------------
# ---- THE GUARD WAS MATCHING ITSELF, AND TWO OF THESE NEVER RAN ----
#
# Reported as "the adhkar notification never appears in the notification
# section". It is not a notification bug, not a font bug and not an Arabic
# bug — the island renders all three correctly, verified by sending one by
# hand. adhkar had simply never started, on any boot, since this line was
# written.
#
# `pgrep -f` matches against the WHOLE COMMAND LINE of every process, and
# the process running the guard is `sh -c 'sleep 40; pgrep -f "adhkar$"
# >/dev/null || adhkar'` — whose command line ENDS IN `adhkar`. So the
# guard found its own parent shell, concluded adhkar was already running,
# and the `||` short-circuited. Reproduced verbatim with a stub on PATH:
# the stub was never executed once.
#
# `pgrep -x` matches the process NAME instead — /proc/<pid>/comm, which
# bash sets to the script's own basename, measured as `adhkar` on pid
# 39834. The wrapper's comm is `sh`, so it cannot match, and the guard
# now answers the question it was asking.
#
# qupdate.py was NOT affected and is left on -f deliberately: its command
# line ends in `--daemon`, so it never self-matched, and `-x` would fail
# for it anyway — comm for that one is `python3`, not `qupdate.py`. The
# three lines differing is the correct outcome, not an inconsistency.
exec-once = sh -c 'sleep 40; pgrep -x adhkar >/dev/null || adhkar'
exec-once = sh -c 'sleep 40; pgrep -x battery-events >/dev/null || battery-events'
exec-once = sh -c 'sleep 40; pgrep -f "qupdate.py$" >/dev/null || python3 ~/.config/qtile/scripts/qupdate.py --daemon'

# Delayed qutebrowser launch, as in autostart.sh.  The --qt-flag
# disable-gpu was an X11 workaround; try without it first on Wayland.
exec-once = sh -c 'sleep 8; qutebrowser --target window https://yewtu.be/'
