# ============================================================
#  Keybindings — ported from qtile
#
#  Modifier map:
#      qtile mod4 (mod)     ->  SUPER
#      qtile mod1 (alt)     ->  ALT     (physically Caps, see input.conf)
#
#  Bindings that could NOT be ported are listed at the bottom of this
#  file, commented, each with the reason.  They are kept in place so
#  the key stays reserved and you can see at a glance what is missing.
# ============================================================

$mod = SUPER
$alt = ALT
$HINTIUM = ~/Attia-Pro/Projects/Hintium/bin/hintium

# ---- WHY THE TERMINAL CARRIES AN OPACITY FLAG ----
#
# "The glass terminal did not work yet" — and the plugin was never the
# problem. hyprglass refracts what is BEHIND a window; kitty.conf sets
# background_opacity 0.95, so there was nothing behind it to refract and
# the effect had no surface to appear on. Measured: with the same window
# at background_opacity 0.25 the full effect renders — lens bulge, edge
# refraction, chromatic fringing, specular rim — and at 0.95 the window
# is a flat rectangle whether the plugin is enabled or disabled.
#
# It is set HERE and not in kitty.conf because that file also serves the
# qtile/X11 session, which has no glass to show through it. Tune it here
# and nowhere else.
#
# Every route that opens a terminal goes through $term for this reason —
# the scratchpads and the $mod N toggler included. A kitty started by any
# other means keeps kitty.conf's own 0.95 and simply looks opaque.
#
# ---- "STILL NOT 100% GLASSY", AND WHY THIS IS ONLY HALF THE ANSWER ----
#
# Reported again after the preset fix. This number is one of TWO ceilings
# and it is the one everybody reaches for, so it is worth writing down
# that it cannot get there alone.
#
# From the regression measured in hyprglass.conf — on-screen luminance
# against the bare wallpaper's, 1.0 being a clean pane:
#
#     kitty alpha 0.70, glass off ....... 0.302   (== 1 - 0.70, exactly)
#     kitty alpha 0.70, apple preset .... 0.140   (46% of what reaches it)
#
# So the window admits 30% of the desktop and the MATERIAL then keeps
# less than half of that. Dropping this value alone raises the first
# number and the material still halves it; the second ceiling is
# `glass_opacity` in hyprglass.conf, which was 0.75 — a slab that is
# three-quarters opaque no matter how much light arrives behind it.
#
# Both are moved together, this one 0.70 -> 0.55 and glass_opacity
# 0.75 -> 0.60. 0.55 is the value the previous note here already
# identified as "shows more glass", and its stated cost — "reads slightly
# washed out" — was measured against a 0.75 slab. With the material
# thinner the wash is what turns into refraction rather than haze.
#
# THE COST IS TEXT CONTRAST AND IT IS REAL. This is the terminal the
# editor runs in. If body text starts to swim over a busy wallpaper, put
# THIS number back up before touching glass_opacity — legibility is worth
# more than the lens, and the wallpaper is the variable neither number
# can account for.
# $term_opacity comes from colors.conf, which looks.conf sources before
# this file. It is 0.55 on a dark palette and 0.92 on a light one: 45%
# transparency on a near-black page still reads as a terminal, and on a
# near-white page over a photograph it does not. See gen_hypr_colors.
$term = kitty -o background_opacity=$term_opacity

# ------------------------------------------------------------
#  Session / core
# ------------------------------------------------------------
bind = $mod, Return, exec, $term
# qtile's drun key, and it WAS `rofi -show drun -show-icons`. It is now the
# island's own application launcher, the same target $mod D already had.
#
# The comment further down this file argued for keeping both — "rofi's is
# the one that still works when the island is not running". That argument
# is now over, and losing it is the point: a session with the island down
# has no rofi LAUNCHER to fall back to anyway. Two keys onto one launcher
# is the honest state.
#
# This used to add "nothing in the Hyprland session opens a rofi window
# except the two wizards named in submaps.conf", and that was WRONG by
# one. `$mod SHIFT F6` runs `ati-phone-screen`, which pipes its device list
# through `rofi -dmenu` (AtiScriptsV1/ati-phone-screen, the `rofi -dmenu -i
# -format f` call). Three routes, not two.
#
# THE COUNT HAS MOVED AGAIN, and this time downward. The list was
# enumerated rather than recalled — every `exec` in binds.conf and
# submaps.conf resolved to its script, and every one of those grepped for
# `rofi` — and it came to four: rofi_anki, ati-ilovepdf, theme-toggle and
# ati-phone-screen. `rofi_anki` has since moved into the island's picker (see
# submaps.conf's `A`), so THREE remain and each has its reason written at
# its own bind:
#
#   $mod P -> V        ati-ilovepdf  multi-select, which the picker
#                                     protocol cannot express
#   $mod P -> SHIFT C  theme-toggle   the qtile session's picker; `c` is
#                                     already the island's
#   $mod SHIFT F6      ati-phone-screen   below
#
# It stays on rofi, deliberately. REQUIREMENTS.md item 3's policy is that
# rofi keeps the list-and-pick problems it already solves, and this is the
# purest example in the tree: an mDNS device list that appears, is picked
# from once, and goes away. Porting it into the island would buy nothing
# and would cost the one property that makes it useful — it works with the
# island down, which is exactly when you are most likely to be plugging a
# phone into a laptop to see what is wrong.
#
# Spelt out in full rather than through $qsi, which is defined 300 lines
# BELOW this one. A Hyprland variable used above its definition does not
# error: the bind stores the literal string "$qsi" and does nothing, and
# `hyprctl configerrors` stays empty. `hyprctl binds -j` is where it shows.
bind = $mod SHIFT, Return, exec, ati-bar-action tide toggleApplicationLauncher
bind = $mod SHIFT, C, killactive,
# The power menu, on qtile's own key. It WAS `dm-logout -r` here, which is
# what qtile spawned; it is now a state of the island, which is where
# DESIGN-SPEC.md's state list puts it. Same actions, read out of
# scripts/power-ctl.sh so the panel and the script cannot disagree about
# what a row does.
#
# WRITTEN OUT IN FULL, NOT $qsi — and this cost a measurement to catch.
# **A Hyprland variable only expands in lines that come AFTER its
# definition**, and $qsi is defined with the other panel bindings ~280
# lines below this one. Using it here is not an error: the config reloads
# with EMPTY `hyprctl configerrors` and the bind is stored with the
# literal text `$qsi tide togglePowerMenu`, so the key silently runs a
# command that does not exist. Measured with `hyprctl binds -j`, which is
# the only place the difference is visible — the two bindings below the
# definition expanded, this one did not.
bind = $mod SHIFT, Q, exec, ati-bar-action tide togglePowerMenu
# $mod SHIFT X (loginctl lock-session) removed on request -- not wanted as
# a keybind. Lock is still reachable through the power menu ($mod SHIFT Q).

# qtile had _smooth_restart (restart preserving window state).  Hyprland
# reloads config without touching windows at all, which is strictly better.
#
# ---- WHY IT ANNOUNCES ITSELF ----
#
# This bind already existed and already worked — `hyprctl binds -j` showed
# modmask 65 on R running `hyprctl reload`. It was reported as missing, which
# is the tell: a successful reload changes NOTHING on screen. There is no
# flash, no relayout, no message, so pressing it and pressing a dead key are
# the same experience, and the only way to know it fired was to have broken
# something first.
#
# So it says so. notify-send rather than the island's showText IPC because a
# config reload has to keep working when the shell is the thing being
# reloaded.
#
# $mod SHIFT F5 used to be a second binding for this exact command — kept
# only because qtile's dm-logout chord happened to also reach a reload. It
# no longer needs to: this key already covers reload duty, so F5 was freed
# for qtile's OWN mod+shift+F5, the actual ati-reset-pc hard reset. See that
# bind, further down, for why freeing it cost nothing.
bind = $mod SHIFT, R, exec, sh -c 'hyprctl reload && notify-send -t 1500 "Hyprland" "Config reloaded"'

# ------------------------------------------------------------
#  Focus / movement   (qtile: layout.left/down/up/right)
# ------------------------------------------------------------
# Through a script, not `movefocus` directly, and the reason is Max and
# TreeTab: layout-cycle.sh builds both out of a Hyprland GROUP, and
# movefocus moves between TILES — a group is one tile, so the windows
# stacked behind the visible one had no key that could reach them. That is
# the "Max and TreeTab switch but I cannot get to the app underneath"
# report. focus-move.sh sends changegroupactive when the focused window is
# grouped and movefocus when it is not; see the header there for qtile's
# own .when(layout=...) table, which is what the mapping reproduces.
$focus = ~/.config/hypr/scripts/focus-move.sh
bind = $mod, H, exec, $focus h
bind = $mod, J, exec, $focus j
bind = $mod, K, exec, $focus k
bind = $mod, L, exec, $focus l

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, L, movewindow, r
# NOTE: $mod SHIFT K was CheatSheet-Mode in qtile, not "move window up".
# Kept faithful — see submaps.conf.  If you would rather have the
# movement key back, uncomment the next line and drop the submap bind.
# bind = $mod SHIFT, K, movewindow, u

# ------------------------------------------------------------
#  Window state
# ------------------------------------------------------------
bind = $mod, F, fullscreen, 0
# $mod X was `fullscreen, 1` and was reported as doing nothing. The bind
# registers and the dispatcher works — both measured — and the key was
# still dead, because `fullscreen 1` is MAXIMIZE and a workspace with one
# tiled window already gives that window the whole usable area. Live
# proof: workspaces 1, 2, 3 and 5 each hold a single window at
# [10,43] 1346x715, and maximize produces [10,43] 1346x715.
#
# qtile's mod+x was lazy.layout.maximize() over MonadTall, i.e. toggle
# the MASTER RATIO between min_ratio 0.6 and max_ratio 0.85 — the stack
# is squeezed, never covered. master-maximize.sh ports that branch of
# libqtile exactly, and gives the one-window case the only reading of
# "maximize" that has any space left to give. Reasons in the script.
bind = $mod, X, exec, ~/.config/hypr/scripts/master-maximize.sh
bind = $mod, T, exec, ~/.config/hypr/scripts/toggle-floating.sh
bind = $mod SHIFT, SPACE, layoutmsg, togglesplit
# $mod Tab was lazy.next_layout() over qtile's THREE layouts — MonadTall,
# Max and TreeTab. What was here flipped Hyprland's general:layout between
# master and dwindle, which is two layouts, neither of which is Max, and it
# quietly dropped the two this config spends most of its time in.
#
# scripts/layout-cycle.sh maps all three; the mapping and the reason for
# each is at the top of that file. Individual layouts are also bound below,
# because qtile's next_layout only ever moved forward and getting to Max
# from TreeTab meant cycling through MonadTall.
#
# The layout these change is now PER-WORKSPACE, as qtile's was: each Group
# declared its own, and lazy.next_layout() changed that group's, not the
# session's. The remembered layout is re-applied on arrival by
# scripts/workspace-layout.sh (autostart.conf), which is a daemon because
# Hyprland has no per-workspace layout and no workspace rule that can set
# one — see that file for the measurement.
bind = $mod, TAB,        exec, ~/.config/hypr/scripts/layout-cycle.sh next
bind = $mod SHIFT, M,    exec, ~/.config/hypr/scripts/layout-cycle.sh monadtall
bind = $mod SHIFT, V,    exec, ~/.config/hypr/scripts/layout-cycle.sh max
bind = $mod SHIFT, G,    exec, ~/.config/hypr/scripts/layout-cycle.sh treetab

# ------------------------------------------------------------
#  Monitors   (qtile: prev_screen / next_screen)
# ------------------------------------------------------------
bind = $mod, comma, focusmonitor, l
bind = $mod, period, focusmonitor, r

# ------------------------------------------------------------
#  Workspaces 1-9
#
#  qtile bound these through go_to_group_or_notify(), which fell back to
#  a notification when the group did not exist.  Hyprland creates the
#  workspace on demand instead, so the notify path has no purpose.
# ------------------------------------------------------------
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# ------------------------------------------------------------
#  Scratchpads / dropdowns
#
#  qtile's ScratchPad+DropDown becomes Hyprland special workspaces.
#  Geometry (width/height/x/y from the DropDown definitions) moves to
#  the windowrules in rules.conf.
#
#  These go through scripts/scratchpad.sh rather than binding
#  `togglespecialworkspace` directly, because that dispatcher does NOT
#  spawn anything — on an empty special workspace it shows you nothing.
#  qtile's DropDown spawned on first use; the script restores that.
#  Commands below are transcribed verbatim from the DropDown() calls.
# ------------------------------------------------------------
$pad = ~/.config/hypr/scripts/scratchpad.sh

#  ---- WHY THE SCRATCHPAD TERMINALS HAVE THEIR OWN CLASS ----
#
#  They used to spawn a plain `kitty`, and that collided with the two
#  other things in this file that care about the class `kitty`:
#
#    1. rules.conf sends `match:class ^kitty$` to workspace 4, so every
#       scratchpad terminal carried a second, contradictory workspace
#       rule alongside its own `workspace special:termN`.
#    2. WORSE, and this is the one that was actually losing terminals:
#       $mod N is `toggle-app.sh "kitty" 4`, whose matcher is unanchored
#       and therefore matched the SCRATCHPAD kitties too. It takes the
#       first match, and if that was the scratchpad one it took the
#       special-workspace branch — `movetoworkspace 4` — which pulls the
#       terminal out of its scratchpad for good. The scratchpad then
#       looks empty, so the next $alt 1 spawns a second one.
#
#  A distinct class fixes both at the source: ^kitty$ no longer matches
#  it, and neither does the unanchored "kitty" regex, because
#  "scratch-term1" does not contain the substring "kitty".
bind = $alt, 1, exec, $pad term1 $term --class scratch-term1
bind = $alt, 2, exec, $pad term2 $term --class scratch-term2
# The calculator is the ISLAND's now, not a scratchpad.
#
# This read `$pad calc env GTK_THEME=Adwaita:dark qalculate-gtk`, and that
# env var is the whole argument for replacing it: qalculate-gtk cannot
# follow theme-apply, so it was nailed to one dark GTK theme and left
# there. Under `mono-light` the desktop goes light and the calculator does
# not; under all 22 palettes it is the same grey box.
#
# The engine did not change — the panel drives `qalc`, which is
# libqalculate's CLI and the thing qalculate-gtk is a front end FOR, so no
# package moves and no expression answers differently.
#
# WRITTEN OUT IN FULL, NOT $qsi: that variable is defined further down this
# file, and a Hyprland variable used above its definition stores the
# literal text and silently runs nothing. See the note on $mod SHIFT /.
bind = $alt, 5, exec, ati-bar-action tide toggleCalculator
bind = $alt, 0, exec, $pad chatgpt brave --profile-directory=Chatgpt --app=https://chat.openai.com
bind = $alt, 9, exec, $pad deepseek brave --profile-directory=Deepseek --app=https://chat.deepseek.com
bind = $alt, 8, exec, $pad whats brave --profile-directory=Whatsapp --app=https://web.whatsapp.com

# ------------------------------------------------------------
#  App togglers  (qtile: scripts/toggle_apps.py)
#
#  These are WORKSPACE toggles, not window toggles — that was the bug.
#  qtile's _toggle() takes you TO the app's group, and pressed again from
#  the app, BACK where you came from. The second argument is that home
#  workspace, and the values are the *_group constants at the top of
#  ../qtile/scripts/toggle_apps.py, not guesses:
#
#      terminal_group = "4"      file_manager_group  = "3"
#      brave_group    = "5"      qute_group          = "2"
#      telegram_group = "9"      google_chrome_group = "6"
#      obsidian_group = anki_group = "S"
#
#  Class regexes are matched case-insensitively against BOTH class and
#  initialClass, because Electron apps report these inconsistently, and
#  are unanchored so "qutebrowser" still catches the real Wayland app_id
#  org.qutebrowser.qutebrowser.  Verify any that misbehave with:
#      hyprctl clients -j | jq -r '.[].class'
# ------------------------------------------------------------
$toggle = ~/.config/hypr/scripts/toggle-app.sh

# ANCHORED. "brave" unanchored also matches the three browser scratchpads,
# whose classes brave derives from the URL and profile —
# `brave-chat.openai.com__-Chatgpt` and friends. The special-workspace
# guard in toggle-app.sh already stops it from dragging them out, but the
# anchor is the honest fix: $mod B means the browser, not everything brave
# ever made a window for.
bind = $mod, B,        exec, $toggle "^brave-browser$" 5 brave
bind = $mod, N,        exec, $toggle "kitty" 4 $term
bind = $mod, M,        exec, $toggle "pcmanfm|thunar|nemo" 3 pcmanfm-qt
bind = $mod, V,        exec, $toggle "qutebrowser" 2 qutebrowser
bind = $mod SHIFT, T,  exec, $toggle "telegram" 9 telegram-desktop
bind = $mod SHIFT, O,  exec, $toggle "obsidian|md\.Obsidian" name:S obsidian
bind = $alt SHIFT, A,  exec, $toggle "anki" name:S anki

# qtile's $mod SHIFT S — "Open or focus sum.md globally".
#
# NOT $toggle. This was routed through toggle-app.sh on the belief that the
# summary window lives on workspace S with Anki and Obsidian, via
# Group("S")'s `Match(title="nvimsum")`. That Match has not matched anything
# in qtile since alacritty was replaced by kitty: the window is spawned
# `--title sum.md`, and kitty's `--title` overrides the program's own, so
# there is nothing called `nvimsum` for it to catch. The behaviour comes
# from `scripts/sum_app.py` instead — float, centre, 55%x65%, follow you to
# the CURRENT workspace, and minimize when it is already focused.
#
# toggle-app.sh cannot express that. It is workspace-centric by design
# (go to where the app is, bounce back on a second press), which is right
# for Obsidian and wrong for a global floating scratch buffer. It also
# opened ~/sum.md, a path that does not exist on this machine — the real
# file is ~/ATITODOS/TODOS.md. Full write-up in scripts/sum-toggle.sh.
bind = $mod SHIFT, S,  exec, ~/.config/hypr/scripts/sum-toggle.sh

# ------------------------------------------------------------
#  Launchers / utilities that were plain spawn() — these port verbatim
# ------------------------------------------------------------
# qtile's "close the notification" key. It was `dunstctl close`, which was
# right while dunst was the notification server; the island serves
# org.freedesktop.Notifications itself now, so dunstctl talks to a daemon
# that is not running and the key did nothing.
#
# Spelt out rather than through $qsi, which is defined further down this
# file — a Hyprland variable used above its definition does not error, it
# stores the literal "$qsi" and the bind silently does nothing.
#
# This is the only keyboard route to dismissing a notification and that is
# structural rather than lazy: the notch takes no keyboard focus (it must
# not steal the keyboard from whatever you are typing in every time a
# message arrives), so no key can be pressed "into" it and a compositor
# bind is the only kind that reaches it. It matters most for a CRITICAL
# notification, which by specification does not auto-expire.
bind = $alt, N, exec, ati-bar-action tide dismissNotification

# Notification HISTORY, on request. The pair reads as one idea: $alt N
# dismisses the notification in front of you, $alt ` opens everything that
# has been dismissed.
#
# `grave` rather than a letter because it was already reserved for a bar
# widget that never ported (see the dead-bind section at the bottom), and
# because $mod ` is the system monitor — the hand already goes to that key
# for "show me state", and a notification history is the other half of
# that. The two do not collide: different modifier, different panel.
#
# Toggle, not show. It takes an exclusive keyboard grab while open, so a
# second press has to be able to give the keyboard back — and Escape and q
# now close it too, which they did not until the focus chain was fixed.
#
# WRITTEN OUT IN FULL, not as `$qsi tide ...`, and that is not a style
# choice. `$qsi` is defined at line ~478, BELOW this one, and Hyprland
# expands a variable only if it is already defined when the line is
# parsed. Written the short way here it registered as the literal string
# `$qsi tide toggleNotificationCenter` — confirmed in `hyprctl binds`,
# which is the only place it shows, since a bind with a nonsense command
# still registers, still reports ok on reload, and simply does nothing
# when pressed. MIGRATION.md records the same trap from the other end.
#
# Through `ati-bar-action bar systemBox` rather than named directly, because
# this key has a SECOND meaning: under the qtile-style topbar it is
# qtile's own $alt ` — the system widget box, CPU and memory. The two are
# different features, not two renderings of one, so the routing is by BOX
# and not by island function. See ati-bar-action's `bar` target; the dead-bind
# section at the bottom of this file is where that key was recorded.
bind = $alt, grave, exec, ati-bar-action bar systemBox

bind = $alt, P, exec, clock_popup
# Clipboard history, ported to the island's picker. ati-copyq-rofi is
# untouched and the qtile session still uses it. ONE behavioural
# difference, and it is unavoidable: the rofi version ends with
# `xdotool key ctrl+v`, which is X11-only. This one puts the entry on
# the clipboard and leaves the paste to you. See island-picker.py.
bind = $alt, V, exec, ati-bar-action tide showPicker clipboard
# Opens a ROFI window — one of the three routes that still do, listed at
# the top of this file. Kept on rofi on purpose: see that note, and
# REQUIREMENTS.md item 3. The short version is that an mDNS device list is
# the purest list-and-pick problem in the tree, and it has to keep working
# with the island down, which is exactly when you are attaching a phone to
# a laptop to find out what is wrong.
bind = $mod SHIFT, F6, exec, ati-phone-screen
# Dictation, on Voxtype now — Omarchy's own voice-to-text tool (voxtype-bin,
# AUR), not the hand-rolled whisper-stream/xdotool pipeline this used to run
# (ati-voice-dictate-live/ati-voice-dictate, now unbound; their scripts are
# still on disk but nothing calls them). `record toggle` matches how F8
# already behaved here — press to start, press again to stop — rather than
# the push-to-talk start/stop-on-release binding Omarchy's own default uses.
# The old F9 batch-dictate bind is gone outright, not reassigned: Voxtype's
# one daemon replaces both of the old scripts' modes.
bind = $alt, F8, exec, voxtype record toggle

# Screenshot: the X11 script used maim/xclip; grim+slurp is the Wayland
# equivalent, same "select area -> clipboard" behaviour.
#
# ---- WHY slurp NEEDS FOUR FLAGS ----
#
# Bare `slurp` was unusable: its default background is a heavy light wash
# over the WHOLE screen, so during selection the desktop goes flat grey
# and you cannot see what you are aiming at — which is the entire job.
# Screenshotted mid-selection to confirm it, since the overlay is a layer
# surface and grim captures it like anything else.
#
#   -b 00000040   dim to 25% BLACK instead. Dark enough to show you are in
#                 selection mode, light enough to still read the screen.
#   -s 00000000   the selection itself is fully transparent — inside the
#                 box you see the real, undimmed pixels, which is the only
#                 way to judge the crop you are about to take.
#   -c ffffffffff→ffffffff  a plain white border. Deliberately NOT the theme
#                 accent: this has to be visible over 22 palettes and over
#                 whatever happens to be on screen, and white is the only
#                 colour that always is.
#   -w 2          thin enough not to eat the edge pixels you are selecting.
#
# -d prints the dimensions while dragging, which the old maim/xclip
# version had no equivalent for and is free here.
bind = , Print, exec, grim -g "$(slurp -b 00000040 -s 00000000 -c ffffffff -w 2 -d)" - | wl-copy

# qtile's mod+shift+F5 runs ~/.config/AtiScriptsV1/ati-reset-pc — the hard
# reset (kill apps, restart services, restart the WM's own bar), not a
# config reload. This key used to run `hyprctl reload` too, redundantly
# with $mod SHIFT R above; that duplicate is what got replaced, not a live
# binding, so nothing is lost by putting the actual qtile action here
# instead. hypr/scripts/reset-pc.sh is the Wayland-adapted twin of
# ati-reset-pc — see its header for what had to change and why — and it
# announces its own start/end via notify-send, so this bind does not wrap
# it in another one the way R wraps a silent `hyprctl reload`. Same
# action, same key, as the power popup's "Hard reset" row
# (hypr/scripts/power-ctl.sh).
bind = $mod SHIFT, F5, exec, ~/.config/hypr/scripts/reset-pc.sh

# ------------------------------------------------------------
#  Media / hardware keys
# ------------------------------------------------------------
bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/media-osd.sh volume up
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/media-osd.sh volume down
bindl  = , XF86AudioMute,        exec, ~/.config/hypr/scripts/media-osd.sh volume mute
bindl  = , XF86AudioMicMute,     exec, ~/.config/hypr/scripts/media-osd.sh volume micmute
bindel = , XF86MonBrightnessUp,   exec, ~/.config/hypr/scripts/media-osd.sh brightness up
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/media-osd.sh brightness down
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous

# ------------------------------------------------------------
#  Mouse
# ------------------------------------------------------------
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
# mouse:272 is also watched, non-consuming, by qdrop's shake detector — the
# binds and the whole argument are down in the qdrop block. They cannot
# collide with these two: those are declared on $mod and a bind with an
# empty modmask never matches a press with $mod held.

# ------------------------------------------------------------
#  Submap entry points   (qtile KeyChord -> Hyprland submap)
#  Definitions live in submaps.conf
# ------------------------------------------------------------
bind = $mod, R,        submap, resize
bind = $mod, P,        submap, rofi
# Media-Mode. Was commented out down in the NOT PORTED block on the
# strength of a binding count — 17 — that is mostly the workspace keys
# every chord repeats. See submaps.conf.
bind = $mod, slash,    submap, media
bind = $mod, SPACE,    submap, lang
# WAS `submap, draw`, relaying to gromit-mpx. gromit is X11-only, proxied
# through XWayland-rootless — MEASURED live: its pointer grab only
# intercepts input over an XWayland surface, of which this desktop has
# none, so drawing only ever appeared inside gromit's own leftover help
# window. wayscriber replaces it: genuinely Wayland-native (wlr-layer-shell
# — confirmed live via `hyprctl layers`, its own two surfaces appearing and
# disappearing cleanly on toggle, not an XWayland proxy), same daemon+
# single-toggle shape gromit had. No submap and no separate hint surface
# here: wayscriber is one self-contained overlay with its own status bar
# (tool/color/size, F9 toolbar, F1 help — see ~/.config/wayscriber/config.toml
# for what's trimmed) and its own rich shortcut set, config'd with gromit
# parity where a real equivalent exists (C clear, Z undo, R redo — same
# file). A standalone corner HUD (DrawModeHudWindow.qml) was built and
# then deleted this same session when wayscriber's own status bar turned
# out to already cover the "what are the keys" job; do not re-add it
# without checking whether that's still true.
# Self-healing, added after wayscriber.service was found dead (SIGTERM'd
# hours earlier, `enabled` but `inactive` — systemd does not restart a
# clean exit(0), and --daemon-toggle has nothing to talk to if the daemon
# isn't up) — "win+shift+w, why not opening the draw one? ... i want it to
# launch when i click win shift w" if the app wasn't launched. Checked
# live: `systemctl --user is-active --quiet` is instant, so the common
# case (daemon already up) pays no cost; only a dead daemon takes the
# extra ~0.3s to come back before the toggle fires.
bind = $mod SHIFT, W, exec, bash -c 'systemctl --user is-active --quiet wayscriber.service || { systemctl --user start wayscriber.service; sleep 0.3; }; wayscriber --daemon-toggle'
# Passthrough is three things, not one — the bar moves to the bottom and two
# notifications bracket the mode. See scripts/passthrough.sh and the submap.
# Two binds on one key: Hyprland runs both, and `exec` before `submap` so the
# notification is on its way before the keyboard is handed over.
bind = $mod, F12,      exec, ~/.config/hypr/scripts/passthrough.sh enter
bind = $mod, F12,      submap, passthrough
# CheatSheet-Mode, on qtile's key. This is why $mod SHIFT K is NOT
# "move window up" — see the note beside the movement binds above.
#
# It stays a CHORD, and after the split below that is a deliberate
# difference rather than an accident of history. This key is "show me the
# keys for <thing>", and the thing is chosen with the second press —
# K hypr, V vim, F fish, I island. `$mod SHIFT /` is the other shape: one
# key, one surface, no question asked.
bind = $mod SHIFT, K,  submap, cheatsheet

# `$mod SHIFT /` — "win+?" — was THE DOCS OVERLAY (ati-docs directly, no
# chord: "qtile's chip was one click that PUT A SURFACE ON SCREEN" is the
# design reasoning that earned this key its own binding instead of being
# folded into the cheatsheet chord below). Reassigned to ati-menu, the
# declarative command tree (Style/System/Docs/Install/Remove/Update) --
# same shape, one key/one surface/no chord, and ati-docs itself stays
# reachable two other ways that were never this key: the topbar's logo
# chip, and the Super+P,D chord entry.
#
#   $mod SHIFT /   opens ati-menu directly
#   $mod SHIFT K   the cheatsheet chord — hypr / vim / fish / island
#
# No collision: `$mod, slash` is the media submap and stays untouched —
# checked against the LIVE table, `hyprctl binds -j`, not just this file,
# because a bind can also come from a submap or a sourced config.
bind = $mod SHIFT, slash, exec, ati-bar-action tide toggleMenu

# The tour. qtile reaches its eww version from the bar's 💡 tooltip; this
# session has no bar to hang an icon off, so it gets a key.
#
# Reachable AGAIN, and that is the requirement rather than a nicety: an
# onboarding you can only see once cannot be tested, and the one thing
# every tour needs is to be re-openable on the day you have forgotten the
# key it told you about.
#
# `$mod SHIFT I`, for "intro". NOT `$mod SHIFT N`, which was the first
# choice and was already `toggleNotificationCenter` — grepping this file
# for "SHIFT, N" would have missed it, because the notification-centre
# bind is written with the panel bindings further down. `hyprctl binds -j`
# after a reload is what caught it, showing two exec binds on modmask 65
# key N. That is the whole reason the rule says to check the LIVE table.
#
# WRITTEN OUT IN FULL, NOT $qsi, for the third time in this file: $qsi is
# defined ~40 lines BELOW here, a Hyprland variable only expands in lines
# after its definition, and using it above is not an error — the bind
# stores the literal text and the key silently runs nothing while
# `hyprctl configerrors` stays empty. Verified in `hyprctl binds -j`,
# which is the only place the difference shows.
bind = $mod SHIFT, I, exec, ati-bar-action tide showOnboarding 0

# ---- SWAP THE WHOLE BAR: this session's own ↔ the Tide Island ----
#
# Same key as qtile's, because it is the same question asked of either
# session.
#
# ---- IT IS NOT $mod SHIFT B, AND THE REASON IS THIS FILE'S OWN LESSON ----
#
# B was the obvious key — "bar" — and it is free in qtile. Grepping this
# file for it found nothing, so it went in. `hyprctl binds -j` after the
# reload then showed TWO exec binds on modmask 65 key B: the new one and
# toggleWallpaperPicker.
#
# The grep missed it for the same reason the $mod SHIFT I note above
# records: these lines are written with `$mod`, so a search for `SUPER`
# cannot see them, and the wallpaper bind lives in a different section
# under a different heading. This is the second time that has happened in
# this file, which is why the rule is to read the LIVE TABLE and not the
# source. Hyprland does not warn — `hyprctl configerrors` stayed empty
# and one of the two keys simply wins.
#
# P for "panel", verified free on modmask 65 in the live table and free
# in qtile's Key list. NOT $mod SHIFT Z: that is qtile's top/bottom bar
# swap and is being kept for the day Hyprland has two bars of its own to
# swap between — see the NOT-PORTED note near the bottom of this file.
#
# It runs a SCRIPT rather than an IPC call or a `hyprctl dispatch`, and
# that is not laziness: the choice is written to ~/.cache/bar-mode, which
# BOTH sessions read at startup, so picking a bar here is still your bar
# after logging into qtile. AtiScriptsV1/bar-switch owns the ordering —
# bring the incoming bar up, check it, only then take the outgoing one
# away — because the one rule is that no path may leave the desktop with
# no bar at all.
#
# On Hyprland today this can only refuse in one direction: `native` needs
# the Quickshell topbar that mirrors qtile's, which is not built yet, so
# the script says so and leaves the island alone rather than hiding it.
# The qtile session has both halves and switches for real.
bind = $mod SHIFT, P, exec, bar-switch toggle

# ---- qtile's OTHER bar swap, on qtile's own key ----
#
# $mod SHIFT B / $mod SHIFT P chooses WHICH BAR the session wears — the
# island or the qtile-style one. This chooses which EDGE the qtile-style
# bar sits on.
#
# NO LONGER shell.qml's two separate forms (28px top bar of chips vs 40px
# bottom bar of bare widgets, BottomBar.qml) — "the qtile like one will be
# disabled" retired that bar from bar-switch's `native` mode entirely.
# redesign-e-final.qml is what runs now, and its own Win+Shift+Z ("i want
# to make the button bar same style like the new bar and i can switch
# with win+shift+z like before") is the SAME bar re-anchored to the other
# edge rather than a second design — see its own `demo.setPosition`.
#
# FIXED PATH: was `-p ~/.config/quickshell/topbar` (the directory, which
# resolved to shell.qml back when topbar.sh launched it that way) —
# topbar.sh now launches redesign-e-final.qml directly, a different
# Quickshell instance identity, so this silently reached nothing
# ("win+shift+z ... not working"). Same fix as ati-bar-action's own
# topbar_call().
#
# A no-op while the ISLAND is the active bar, and harmlessly so: the
# topbar process is not running, and `qs ipc call` against a config with
# no instance exits 0 having done nothing.
bind = $mod SHIFT, Z, exec, qsipc -p ~/.config/quickshell/topbar/redesign-e-final.qml ipc call topbar toggle

# ---- "WHICH SHAPE DO YOU WANT" ----
#
# The bar chooser, asked for as "a way or keymap or something to click and
# ask which shape do you want, A or B — as a popup for the island and as rofi
# for the qtile". It is one key and it asks in whichever shell is up:
# ati-bar-action routes it to island-picker.py's `bars` page under the island and
# to AtiScriptsV1/bar-chooser under the topbar.
#
# THREE shapes, not two. The qtile-style bar genuinely has two forms — its
# 28 px top bar of chips and its 40 px bottom "normal user" bar with the
# launcher row — so the list is Island / Topbar-top / Topbar-bottom and the
# current one is marked. $mod SHIFT Z above still flips the two topbar forms
# directly, for when you already know which you want.
#
# $mod SHIFT Y: D, E, F, U and Y were the letters still free on modmask 65,
# checked in `hyprctl binds -j` rather than by grepping this file — which is
# the lesson from $mod SHIFT B, where a grep missed a collision because the
# other bind was written with $mod rather than SUPER.
bind = $mod SHIFT, Y, exec, ati-bar-action tide showPicker bars

# ------------------------------------------------------------
#  Tide Island panels
#
#  The island already ships several of the popups this migration was
#  going to rebuild — they were simply never bound, which is why they
#  looked absent. Discovered with:
#
#      qs -p ~/.config/quickshell/tide-island-fork ipc show
#
#  So the WallpaperPopup (9 qtile bindings) is answered by the island's
#  own picker rather than by a port, and the control centre covers a
#  chunk of what AudioPopup and the connectivity popups did.
#
#  $qsi is the island's IPC entry point. `ipc call <target> <function>`.
#
#  The path MUST match what autostart.conf launched, character for
#  character — Quickshell keys its IPC socket by the config path, so
#  `-p /usr/share/tide-island` against the fork does not find a instance
#  and fails silently from a bind (no window, no error, nothing).
# ------------------------------------------------------------
$qsi = qs -p ~/.config/quickshell/tide-island-fork ipc call

# Wallpaper picker. The key that matters is $mod P then `w`, in
# submaps.conf, which is where qtile's WallpaperPopup lived. This is a
# direct second route to the same IPC, kept because it is one keystroke
# shorter and costs nothing; the theme picker's equivalent is $mod P
# then `c`.
bind = $mod SHIFT, B,     exec, ati-bar-action tide toggleWallpaperPicker

# The island's own application launcher. It was the FIRST state in
# DESIGN-SPEC.md's list of "states of the one shape" and it was sitting
# there unbound — the same miss as the Wi-Fi and Bluetooth lists, found the
# same way, with `ipc show`.
#
# $mod D was chosen because $mod SHIFT Return was rofi's drun and that key
# is a qtile port, so the two launchers sat side by side on purpose. That
# ended with the rofi port: $mod SHIFT Return now opens this same launcher
# (see the note on it near the top of this file) and $mod D is kept as the
# spec's key rather than removed, because it is the one DESIGN-SPEC.md
# names and removing a working key to tidy a duplicate costs more than it
# saves.
# $mod D (toggleApplicationLauncher) removed on request -- not wanted as a
# keybind. $mod SHIFT Return still opens the same launcher.

# Control centre (audio, connectivity, battery) and notification centre.
bind = $mod SHIFT, A,     exec, ati-bar-action tide toggleControlCenter

# ---- $mod ` — qtile's second system widget box ----
#
# It was `lazy.widget["2nd_system_widgetbox"].toggle()`, and the label
# table in config.py says what was in it:
#
#     system_widgetbox      (mod2 + `)   "CPU + Memory"
#     2nd_system_widgetbox  (mod  + `)   "Updates · Disk · Volume"
#
# So this key meant "show me the system readout".
#
# ---- WHAT IT USED TO DO, AND WHY THAT ENDED ----
#
# It opened the CONTROL CENTRE. There was no widget box to toggle — the
# island has no collapsible tray on a bar, because it has no bar — so the
# key was aimed at the nearest surface that was the same IDEA rather than
# the same mechanism: the one surface in the shell whose job is status
# rather than a task. It was deliberately the second key onto a panel
# $mod SHIFT A already opened, on the grounds that the muscle memory
# being served is a single unshifted key next to Escape.
#
# The comment that stood here also said what was wrong with the
# substitution, and it is worth quoting because it is the reason this
# line changed rather than a reason it should not have:
#
#     "NOT faithful in one respect, and worth saying rather than hiding:
#      the control centre has Volume but no Disk and no Updates. Updates
#      never ported at all ... and disk usage has no home in the island
#      yet. Both are content gaps in the panel, not reasons to leave the
#      key dead."
#
# Disk now has a home in the island. So does CPU, and so does memory —
# quickshell/tide-island-fork/qml/sysmon/SystemMonitorPanel.qml, which is
# three dials and a row per mounted filesystem. Against the label table
# above it covers system_widgetbox entirely ("CPU + Memory") and two
# thirds of this box ("Disk"), which is more of qtile's system readout
# than has been reachable from any key since the migration.
#
# Two of the four labels are still not here and neither is being hidden.
# Volume stays where it is: it is a control, not a readout, and it is one
# row of the control centre and a pair of media keys. Updates never
# ported at all — qtile's own Updates-Mode is commented out in config.py
# with "will be used later" — so there is nothing to point at.
#
# Nothing became unreachable. $mod SHIFT A is the control centre's
# primary binding and the comment above named it as such; this key was
# always the duplicate, and it is now the only key onto a panel of its
# own rather than the second key onto someone else's.
# Same two-meanings arrangement as $alt ` above: the island's system
# monitor here, qtile's 2nd_system_widgetbox (updates · disk · volume)
# under the topbar. ati-bar-action's `bar` target picks.
bind = $mod, grave,       exec, ati-bar-action bar secondBox

# The third box, on qtile's own key. The dead-bind section below recorded
# $alt Tab as "toggle systray widget box" and called it ported once the
# topbar landed — it was not; what landed was the top/bottom SWAP on
# $mod SHIFT Z, which is a different feature. There is a tray box now, so
# the key is live again on the thing it always named.
bind = $alt, TAB,         exec, ati-bar-action bar trayBox

# ---- qdrop, THE DROP SHELF — and what it is not ----
#
# Reported as "the qdrop not working, make it work, shift+alt+d". It was
# not bound at all here, and the dead-bind section at the bottom of this
# file explained why in a sentence that is wrong twice over: "the X11
# dropdown manager, now replaced by the special workspaces". qdrop.py's
# own docstring is the correction — "native drop-stash for qtile,
# macOS-shelf-like": you drag files or text INTO it and drag them back
# out, newest first, persisted in ~/.cache/qdrop.json. A special workspace
# holding a terminal is not that, so nothing had replaced it.
#
# GDK_BACKEND=x11, deliberately. It is GTK3 and it POSITIONS ITSELF —
# `move()` to top-centre, a slide-down reveal — which Wayland does not
# permit a client to do at all. Under XWayland it does, and Hyprland
# honours it: measured, the window arrives at 372,42 at 622x329, floating,
# with nothing in its log. Without the variable GTK would pick the Wayland
# backend and the shelf would open wherever the compositor felt like.
#
# --toggle rather than a daemon in autostart.conf: it auto-spawns the
# daemon on first use and holds a single-instance lock, so the first press
# starts it and every press after that shows or hides it. That is also
# what qtile's binding did.
#
# The script lives in ../qtile/scripts/ and is used from here as-is rather
# than copied. It is not qtile-specific — no libqtile import anywhere in
# its 2,187 lines — and a second copy would be a second thing to fix.
# Through scripts/qdrop.sh rather than straight at qdrop.py, and the wrapper
# earns its existence: the shelf hides by moving OFF-SCREEN rather than by
# unmapping, so its window never gets re-placed and opened on the workspace
# its daemon was born on — "it opens only in the 4th workspace". The wrapper
# moves it to the active workspace while it is still parked off-screen, then
# hands over. GDK_BACKEND=x11 moved in there with it.
bind = $alt SHIFT, D,     exec, ~/.config/hypr/scripts/qdrop.sh --toggle

# ---- AND THE OTHER WAY IN: SHAKE A DRAGGED FILE ----
#
# The key above is half of qdrop. The other half is the gesture — shake the
# mouse while you are carrying something and the shelf comes to you — and it
# has never worked in this session. `../qtile/scripts/qdrop_watch.py` is what
# implements it and autostart.conf dropped it with the same wrong reason it
# dropped qdrop.py: "replaced by special workspaces".
#
# It could not simply be started, and that was measured, not assumed:
# `xinput --test-xi2 --root` under Hyprland warns it is talking to Xwayland,
# lists only xwayland-pointer:1, and reports ZERO RawMotion events across 5 s
# of real pointer motion. The tree's own rule — an X11 tool under Hyprland
# succeeds and sees nothing.
#
# scripts/qdrop-shake.py is the Wayland detector. It gets pointer motion from
# `cursorpos` over Hyprland's request socket; what it cannot get from anywhere
# is the state of mouse button 1, and these three lines are where that comes
# from.
#
# `event` and NOT `exec`. The event dispatcher writes one line to socket2 —
# measured, `custom>>qdropshake:down` arrives 2 ms after the press — and
# spawns nothing. `exec` would have been two `sh` spawns (1.80 ms each,
# measured) on EVERY LEFT CLICK IN THE SESSION, forever, for two bits of
# state. The three shell listeners already on socket2 all dispatch with a
# `case` over a prefix and no default branch, so an event none of them names
# costs them a `read` and nothing else.
#
# `n` — non-consuming, and that is the load-bearing letter. Verified by
# driving a real press-drag-release through /dev/uinput and reading the
# PRIMARY selection afterwards: the drag still reached the client and still
# selected text, so the bind observes the click without eating it.
#
# THE PRESS BINDS ARE ENUMERATED AND THE RELEASE BIND IS NOT, deliberately.
# A Hyprland bind with an empty modmask is modifier-EXACT — measured, a click
# with SUPER held emitted `up` and no `down` at all — so listing the modifier
# states a file drag can start in IS the "this is not a window move" gate,
# for free, and `bindm = $mod, mouse:272, movewindow` above can never be
# mistaken for a drag. The release carries `i` (ignore mods) so that it
# lands whatever the modifiers are doing by the time you let go: measured, a
# press made bare and released with SHIFT grabbed mid-drag still delivered
# `up`. A release that did not land would leave the detector believing a
# button is still down.
bindn   = ,             mouse:272, event, qdropshake:down
bindn   = SHIFT,        mouse:272, event, qdropshake:down
bindn   = CONTROL,      mouse:272, event, qdropshake:down
bindn   = CONTROL SHIFT, mouse:272, event, qdropshake:down
bindrni = ,             mouse:272, event, qdropshake:up

bind = $mod SHIFT, N,     exec, ati-bar-action tide toggleNotificationCenter

# Focus / do-not-disturb, on the third N.
#
# The three notification keys are deliberately one letter with three
# modifiers, because they are three answers to the same question:
#
#   $alt, N          dismiss the one on screen
#   $mod SHIFT, N    show me the ones I missed
#   $alt SHIFT, N    stop showing me any
#
# Until now the only way to reach do-not-disturb was to open the control
# centre and click a tile — a lot of ceremony for the control you reach
# for precisely when you are trying to concentrate, and the reason it went
# a whole session without anyone noticing it only silenced one thing.
#
# What it silences is every interruption the shell DRAWS and nothing you
# asked for: notifications, a bluetooth device connecting, and the player
# expanding on a track change. Your own keypresses still answer. The shell
# plays no sound, so a chime heard while this is on came from the sending
# application, not from here.
bind = $alt SHIFT, N,     exec, ati-bar-action tide toggleFocus

# Workspace overview — qtile had no equivalent; it is the closest thing
# to the group overview the bar used to give at a glance.
#
# MOVED off $mod ` onto $mod SHIFT `. "win+` not working as expected" was
# this: the key was not dead, it was answering with a workspace overview,
# and the hand pressing it wanted qtile's system readout. An INVENTED
# binding had been given a key that the migration already owed to
# something else — and because the overview does open, it reads as the
# wrong feature rather than as a missing one, which is why it was
# reported as "not as expected" instead of "does nothing".
#
# The rule this settles for the rest of the port: a key qtile used belongs
# to what qtile did with it. Anything with no qtile ancestor takes a free
# key, and SHIFT of its own natural key is the cheapest free key there is.
bind = $mod SHIFT, GRAVE, exec, ati-bar-action overview toggle

# Display panel — the port of qtile's DisplayPopup, on the key it had
# there. $alt 4 is where the arandr scratchpad used to sit, and qtile
# rebound it to Display-Mode for the same reason: one keystroke.
#
# It is NOT a submap. qtile needed a KeyChord because its popup could not
# take keyboard focus at all; this panel is a layer surface with an
# exclusive keyboard grab, so it reads j/k/Enter/i/e/m/... itself. That
# also means the keys cannot leak: they only exist while the panel is up.
# The full keymap, which is qtile's key for key, is at the top of
# quickshell/tide-island-fork/qml/display/DisplayPanel.qml.
# Calendar, power menu and settings — the three states DESIGN-SPEC.md's
# "states of the one shape" listed and nothing here answered.
#
# The CALENDAR has no qtile ancestor at all: qtile had `widget.Clock` and
# no calendar popup, so there was nothing to port and nothing to match.
# It is on $alt 6 because $alt 3/4 were already qtile's audio and display
# keys and this is the same family of "a panel on an alt digit".
#
# SETTINGS is a state of the island rather than a patch to the packaged
# config app, which is a compiled binary (/usr/bin/tide-island-config-app,
# pacman package tide-island) that the next upgrade would overwrite. It
# also reaches fork-only keys — notch mode, the chord HUD — that the
# packaged app has no property for and never will.
bind = $alt, 6,           exec, ati-bar-action tide toggleCalendar
bind = $alt, 7,           exec, ati-bar-action tide toggleSettings
# SHIFT 7 opens the full settings APP rather than the in-island panel. The
# two edit the same schema through the same island-settings.py, and the
# split is not simple-vs-advanced: the panel runs under a Hyprland keyboard
# grab and so cannot own a text field, which is why the four font families
# and the wallpaper folder are `panel: false` and appear only in the app.
#
# Written out in full rather than through a $var, for the reason recorded
# above the notification-history bind: Hyprland expands only what is already
# defined at the point the bind is parsed, and a bind referring to a variable
# defined later registers the LITERAL text and silently does nothing.
bind = $alt SHIFT, 7,     exec, python3 ~/.config/hypr/scripts/island-settings-app.py
bind = $alt, 4,           exec, ati-bar-action tide toggleDisplayPanel

# Audio panel — the port of qtile's AudioPopup, on qtile's own $alt 3.
#
# The control centre ($mod SHIFT A) has ONE Sound slider, on the default
# sink. This is the other seven-eighths of that popup: which output is the
# default AND dragging the live streams over with it, the default
# microphone, per-application volume, per-application routing, the card
# PROFILE (A2DP vs HSP/HFP — hi-fi with no mic, or a working mic that
# sounds like a telephone) and the output PORT (speakers vs the headphone
# jack on one and the same card). pavucontrol is not installed, so none of
# that had any path at all before this.
#
# Not a submap, for the same reason the display panel is not: it takes an
# exclusive keyboard grab and reads its own keys, so none of them can leak
# to the window behind it. The full keymap — qtile's, key for key — is at
# the top of quickshell/tide-island-fork/qml/audio/AudioPanel.qml, and the
# pactl side is hypr/scripts/audio-ctl.py, which runs from a shell.
bind = $alt, 3,           exec, ati-bar-action tide toggleAudioPanel

# Wi-Fi and Bluetooth. qtile reached these through the Rofi chord —
# $mod P then n for WifiPopup, $mod P then b for BluetoothPopup — and
# the same two keys still do it, in submaps.conf.
#
# The island's control centre already OWNED both lists; they were just
# unreachable except by opening it and clicking a chevron, so 26
# bindings' worth of function was present and unbound. These land
# straight in the list, which is what the qtile chord did.

# ============================================================
#  NOT PORTED — kept visible on purpose.  See MIGRATION.md.
# ============================================================

# --- Hintium (6 binds) -- LIVE NOW -----------------------------------
# Was blocked on the theory that Wayland forbids reading the window tree
# and synthesising clicks to ordinary clients, full stop. Half true: it
# does, but hyprctl's IPC answers the window-tree half directly (see
# hintium/hypr.py), and wlroots forwards XTest sent through the rootless
# XWayland connection into the real compositor seat regardless of
# whether the focused window is XWayland or native — so the click/key
# half of hintium/x11.py needed no Wayland-side change at all.
#
# A second, separate bug showed up once that was fixed: the overlay
# itself (every mode's fullscreen window) is a plain GTK toplevel, and
# there is no xdg-shell equivalent of X11's DOCK type hint a client can
# ask for — so a tiling compositor tiled it like any other window, and
# hints landed in a small tiled box instead of over the real screen.
# Fixed with gtk-layer-shell (see hintium/overlay.py's
# init_fullscreen_layer): the overlay is a real layer-shell surface now,
# never tileable, on any wlroots compositor. See
# ~/Attia-Pro/Projects/Hintium's README (Limits) for what is and is not
# covered.
bind = $alt, SPACE,    exec, $HINTIUM
bind = $alt, C,        exec, $HINTIUM --caret
bind = $alt SHIFT, C,  exec, $HINTIUM --caret-search
bind = $alt, E,        exec, $HINTIUM --edit
bind = $alt, J,        exec, $HINTIUM --scroll
bind = $alt, slash,    exec, $HINTIUM --search

# (app togglers moved up into the live section — see $toggle above)

# --- Bar / widget-box controls -- ALL THREE ARE LIVE NOW -------------
# This block stood for a year saying these keys "have no meaning until the
# Quickshell bar exists and exposes IPC". It does, it does, and all three
# are bound in the live section above — through `ati-bar-action bar <box>`,
# which is the piece that was actually missing. The routing matters more
# than the binding: each of these keys has TWO meanings now, one per bar,
# and until that target existed there was nowhere to put the second.
#
# bind = $alt, grave,    ...  toggle system widget box
#   -- "CPU + Memory". LIVE. Under the topbar it is exactly that box;
#      under the island it is the notification centre, which is the
#      meaning this key was given while the topbar did not exist and
#      which the note here argued for at length. Both kept.
# bind = $mod, grave,    ...  toggle 2nd system widget box
#   -- "Updates · Disk · Volume". LIVE, and under the island it stays the
#      system monitor panel — CPU, memory and disk in one surface, which
#      is the same readout by another route.
# bind = $alt, TAB,      ...  toggle systray widget box
#   -- LIVE, on the thing it always named. The note here previously
#      claimed this was "PORTED" to the bar swap on $mod SHIFT Z; that
#      was wrong — swapping the top and bottom bars is a different
#      feature that happens to also involve two bars. The tray box is a
#      tray box, and the topbar has one.

# --- Popup-driven submaps -- deferred with their popups --------------
# Wifi (14) and Bluetooth (12) remain as CHORDS; both landing places are
# live on $mod P then n / b, which is what the chords existed to reach.
# Media-Mode is LIVE — see the submap entry above.
# Audio-Mode (25), Display-Mode (28), WallpaperPicker (9) and
# CheatSheet-Mode (16) are DONE and live above.
# Their key handlers are lambdas closing over qtile popup objects
# (popups/*.py, built on qtile.extras.popup.toolkit) and cannot be
# expressed as commands at all.
# ($alt 3 / audio and $alt 4 / display are LIVE now — see the island
#  panels above. Neither is a submap: both are layer surfaces that take
#  the keyboard themselves.)
# bind = $mod, slash,    submap, media
bind = $mod SHIFT, F,  submap, hint

