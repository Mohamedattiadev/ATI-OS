# ============================================================
#  hyprglass — liquid glass
#
#  Transcribed from the settings and warnings in the "How to Get Liquid
#  Glass on Hyprland" video.  Full notes in DESIGN-SPEC.md.
#
#  NOT SOURCED BY DEFAULT.  hyprglass is not installed yet, and sourcing
#  config for an absent plugin makes Hyprland noisy.  Enable with:
#
#      hyprctl version                        # check FIRST, see below
#      hyprpm add https://github.com/hyprnux/hyprglass
#      hyprpm enable hyprglass
#      # then uncomment the source line in hyprland.conf
#      # and set decoration:blur:enabled = false in looks.conf
#
#  VERSION TRAP — the #1 reason people bounce off this plugin:
#  the current release targets Hyprland 0.56.  On 0.55, either update
#  Hyprland or take the v0.6.4 release, which targets 0.55.4.  The plugin
#  compares its build-time ABI signature against the running compositor.
#  Re-run `hyprpm update` after every Hyprland upgrade.
#
#  NOTE ON FORMAT: this is the legacy .conf form, which the plugin already
#  marks deprecated as of Hyprland 0.55 and will likely drop.  The Lua
#  equivalent is in hyprglass.lua — prefer that one if your Hyprland
#  config is Lua.  Both are kept so neither path is a rewrite.
# ============================================================

plugin {
    hyprglass {
        enabled = true

        # ----------------------------------------------------------
        #  The Apple preset — restraint, deliberately
        #
        #  "Apple's material is desaturated, low contrast, gentle
        #   refraction.  Everyone's first instinct is to crank every
        #   slider and the result looks like a car windshield in the
        #   rain."
        #
        #  The plugin's own defaults are already calibrated near this,
        #  so these values sit close to them on purpose.
        # ----------------------------------------------------------
        preset = apple

        blur_strength = 1.0
        refraction_strength = 0.35
        chromatic_aberration = 0.3
        lens_distortion = 0.25
        fresnel_strength = 0.5
        specular_strength = 0.4
        edge_thickness = 0.18
        glass_opacity = 0.85

        # Tone mapping.  Apple sits below 1.0 on contrast; the punchier
        # numbers (contrast 1.7, vibrancy 0.8, aberration 0.8, distortion
        # 0.9) belong to the video author's own "glass" preset — noted in
        # DESIGN-SPEC.md if you want to move that way later.
        brightness = 1.0
        contrast = 0.95
        saturation = 0.9
        vibrancy = 0.12

        # The adaptive half — what makes it work over any wallpaper.
        # dim pulls down bright areas so dark themes stay readable;
        # boost lifts dark areas so light themes don't go muddy.
        adaptive_dim = 0.35
        adaptive_boost = 0.25

        # Tint: 0xRRGGBBAA, last two digits are alpha.
        # Once theme-apply gains its Hyprland target (REQUIREMENTS.md
        # item 4), this becomes wallpaper-derived — which is exactly what
        # the video author does with his own colours file.
        tint_color = 0x11111b40

        # ----------------------------------------------------------
        #  Layer surfaces — bars, notifications, widgets
        #
        #  THE TRAP, quoted from the video: "Each hg.layer call
        #  whitelists that namespace.  If your only call is an exclude,
        #  the whitelist stays empty — and an empty whitelist means
        #  every layer on your system gets glassed."
        #
        #  Exclusions are evaluated first, then an empty filter returns
        #  true for everything.  So: whitelist deliberately, and give
        #  every entry a threshold.
        #
        #  SECOND TRAP: the effect masks to visible content by alpha, and
        #  SHADOWS COUNT AS VISIBLE CONTENT.  Default mask_threshold is
        #  0.001 — basically anything — so a widget with a drop shadow
        #  gets a glass rectangle around its shadow box.  Raise the
        #  threshold above your shadow's alpha; start at 0.05 and climb
        #  until the rectangle dies.
        #
        #  Left OFF until the Quickshell bar exists.  The video author
        #  tried 0.3 and 0.7 for his Quickshell surfaces and ended up
        #  excluding them entirely — expect to do the same.  Layer
        #  support also hooks private Hyprland internals and is the
        #  first thing to break across updates.
        # ----------------------------------------------------------
        layers_enabled = false
        mask_threshold = 0.05
    }
}

# ------------------------------------------------------------
#  Per-window control
#
#  Glass on a video player is wasted GPU and looks wrong.
# ------------------------------------------------------------
windowrule = tag +hyprglass_disabled, match:class ^(mpv|mpvk)$
windowrule = tag +hyprglass_disabled, match:fullscreen true

# Per-app themes and presets, as demonstrated in the video:
# light glass in the browser, punchier glass on the terminal.
windowrule = tag hyprglass_theme_light, match:class ^(firefox|brave-browser|brave)$
windowrule = tag hyprglass_preset_high_contrast, match:class ^(kitty)$

# Live tuning without a reload — tag, look, adjust:
#   hyprctl dispatch tagwindow +hyprglass_preset_subtle
