# ============================================================
#  hyprglass — liquid glass
#
#  Enable with:
#      hyprpm add https://github.com/hyprnux/hyprglass
#      hyprpm enable hyprglass
#      # then uncomment the source line in hyprland.conf
#
#  VERSION TRAP: the plugin compares its build-time ABI signature
#  against the running compositor. Re-run `hyprpm update` after every
#  Hyprland upgrade or it silently refuses to load.
#
#  ############  THIS FILE WAS REWRITTEN AGAINST THE REAL PLUGIN  #####
#
#  The first draft was transcribed from the video's narration, before
#  the plugin was installed. Checked against hyprglass's own README,
#  four things in it were wrong, and none would have errored loudly:
#
#    1. `preset = apple` — WRONG KEY AND WRONG VALUE. The key is
#       `default_preset`, and there is no `apple` preset. The built-ins
#       are high_contrast, subtle, clear, glass. The video's "just run
#       the Apple preset" refers to a look, not a shipped preset. It is
#       DEFINED below instead, so the spec's intent survives.
#    2. `layers_enabled` / `mask_threshold` are not top-level keys.
#       Layers are a nested block, and mask thresholds are per-namespace.
#    3. `edge_thickness = 0.18` is out of range — the documented range
#       is 0.0-0.15.
#    4. The theme/preset windowrule tags were missing their leading `+`.
#
#  NOTE ON BLUR: an earlier comment here claimed native blur must be
#  turned off globally before this loads. It does not. `manage_window_blur`
#  (default on) sets `noblur` on each glassed window itself, so native
#  blur keeps serving everything hyprglass does NOT touch. What DOES
#  matter is `blur:new_optimizations`, whose cached blur hides the glass
#  on static windows — looks.conf already has it false, with the reason.
# ============================================================

plugin:hyprglass {
    enabled = 1

    # Let the plugin set `noblur` per glassed window itself.
    manage_window_blur = 1

    # FOLLOWS THE PALETTE. This was pinned to `dark`, and the `:light`
    # variant of every preset below sat defined and unreachable — so on
    # mono-light the glass ran `adaptive_dim`, which pulls BRIGHT areas
    # down, on the one palette whose whole surface is bright. Reported
    # as "the light not looking good".
    #
    # theme-apply writes $glass_theme into colors.conf from the
    # background's luminance, and looks.conf sources that at line 49 of
    # hyprland.conf — before this file at 66, which is the only reason a
    # variable works here at all.
    default_theme = $glass_theme
    # `videoglass`, not `apple` — the video author's own numbers. See the
    # preset block below for why this changed on the fourth report of
    # "still not the same as the video". `apple` is still defined and
    # this line is the only thing to change to go back to it.
    default_preset = videoglass

    # Tint follows the palette. theme-apply writes $glass_tint into
    # colors.conf as 0xRRGGBBAA (alpha last, 0x40 == 25%), and looks.conf
    # has already sourced it by the time this file is read.
    tint_color = $glass_tint

    # ----------------------------------------------------------
    #  The "Apple" preset, defined here because the plugin has no such
    #  built-in. The video is emphatic about why it is the right target:
    #
    #    "Apple's material is desaturated, low contrast, gentle
    #     refraction. Everyone's first instinct is to crank every slider
    #     and the result looks like a car windshield in the rain."
    #
    #  So every value below sits at or BELOW the plugin's own default.
    #  For contrast, the video author's personal "glass" look runs
    #  chromatic_aberration 0.8, lens_distortion 0.9, contrast 1.7,
    #  vibrancy 0.8 — recorded in DESIGN-SPEC.md, deliberately not used.
    #
    #  Preset values WIN over the global settings above (resolution is
    #  preset chain -> theme override -> global -> hardcoded default),
    #  which is why the tuning lives in the preset and not loose in the
    #  block where it would be silently outranked.
    # ----------------------------------------------------------
    #  ---- REPORTED: "still not glass, it is blurred more" ----
    #
    #  Correct, and the previous values are why. Read out of the running
    #  plugin (`hyprctl getoption plugin:hyprglass:*`, which reports the
    #  built-in default when `set: false`):
    #
    #      blur_strength        default 2.0   was 1.0   (half of default)
    #      refraction_strength  default 0.6   was 0.35  (well BELOW default)
    #
    #  Both were under their defaults, which is what the note above claims
    #  and it is true — but it is the RATIO that decides what the material
    #  reads as, not the absolute values. Blur at half strength against
    #  refraction at a bit over half of ITS default leaves blur dominant,
    #  and a dominant blur is frosted glass: you cannot see through it, so
    #  there is nothing to refract and nothing that reads as a lens.
    #
    #  Inverted here. Blur drops well under its old value and refraction
    #  goes to just above the plugin default, so the effect is carried by
    #  bending what is behind the window rather than by smearing it.
    #  lens_distortion up for a visible bulge at the edges, where glass
    #  announces itself; glass_opacity down so more of the desktop reaches
    #  the lens in the first place.
    #
    #  chromatic_aberration stays at 0.3 and the fresnel/specular rim stays
    #  put: those are what DESIGN-SPEC.md's "desaturated, low contrast,
    #  gentle refraction" is made of, and cranking them is the exact
    #  "windshield in the rain" failure quoted above.
    #
    #  This is a MATERIAL, and it needs something behind it. `$term` in
    #  binds.conf carries the terminal's background_opacity for that
    #  reason — at kitty.conf's own 0.95 the whole block below is invisible
    #  no matter what these numbers say.
    #
    #  ---- AND NONE OF THE ABOVE EVER REACHED THE TERMINAL ----
    #
    #  The tuning is right and the reasoning above holds, but it was
    #  judged against a window that was not running it. A
    #  `+hyprglass_preset_high_contrast` tag on every kitty class outranked
    #  `default_preset = apple`, so the terminal ran a plugin BUILT-IN
    #  instead. Proof, before that rule was deleted: zeroing every single
    #  parameter on this line — blur, refraction, distortion, opacity, all
    #  of it to 0.0 — and reloading produced a BYTE-IDENTICAL screenshot of
    #  the terminal. See the note beside the windowrules at the bottom of
    #  this file for the numbers.
    #
    #  Two things follow. First: `hyprctl keyword plugin:hyprglass:preset`
    #  is inert — presets are read at config parse only, and re-issuing one
    #  with an existing name is silently dropped, so live-tuning this line
    #  requires editing the file and `hyprctl reload`. Five wildly
    #  different presets pushed with `hyprctl keyword` gave five identical
    #  screenshots, which is exactly what a working change looks like if
    #  you are not diffing the pixels. Second: check `hyprctl clients -j`
    #  for a `hyprglass_preset_*` tag on the window before believing any
    #  measurement of this block.
    #
    #                                        plugin default -> ours
    #  ---- glass_opacity 0.75 -> 0.60, THE SECOND CEILING ----
    #
    #  Reported a third time as "still not 100% glassy", after the
    #  high_contrast tag was deleted and the terminal finally started
    #  running this preset at all. The tag was a real bug and removing it
    #  was a real gain; it was not the last one.
    #
    #  The measurement recorded above says why, and it was already on the
    #  page before anyone read it that way:
    #
    #      kitty alpha 0.70, glass off ....... 0.302
    #      kitty alpha 0.70, apple preset .... 0.140
    #
    #  The window admits 30% of the desktop and the material keeps less
    #  than half of THAT. Every previous pass tuned how the material
    #  BENDS light — refraction up, blur down, distortion up — and none
    #  of them touched how much light it lets past at all, which is this
    #  number and only this number. A slab three-quarters opaque cannot
    #  read as glass however good its lens is, because the lens is
    #  operating on the quarter that gets through.
    #
    #  0.60 rather than lower: glass_opacity is also what gives the
    #  terminal's own background something to be, and below ~0.5 the
    #  wallpaper starts competing with the text for the same pixels.
    #  Moved together with binds.conf's $term 0.70 -> 0.55, which raises
    #  the first number; changing either alone leaves the other ceiling
    #  in place, which is the mistake this comment exists to stop being
    #  repeated a fourth time.
    #
    #  Everything else on this line is unchanged and deliberately so —
    #  see the "windshield in the rain" note above. This is not a crank;
    #  it is the one parameter that was never turned.
    preset = name:apple, blur_strength:0.35, refraction_strength:0.65, chromatic_aberration:0.3, lens_distortion:0.35, fresnel_strength:0.55, specular_strength:0.45, edge_thickness:0.15, glass_opacity:0.60, saturation:0.9, vibrancy:0.12

    # Theme variants. Brightness/contrast have no global default at all —
    # they fall through to per-theme values — so they belong here.
    preset = name:apple:dark, brightness:0.82, contrast:0.90, adaptive_dim:0.35
    preset = name:apple:light, brightness:1.12, contrast:0.92, adaptive_boost:0.25

    # ----------------------------------------------------------
    #  `videoglass` — THE VIDEO AUTHOR'S OWN PRESET, AND NOW THE DEFAULT
    #
    #  NOT named `glass`. The plugin SHIPS a built-in preset with that
    #  name (see item 1 of this file's header: the built-ins are
    #  high_contrast, subtle, clear, glass), and this file already
    #  records that re-issuing a preset under an existing name is
    #  silently dropped. Defining ours as `glass` would therefore have
    #  been a coin flip between our numbers and the plugin's, resolved
    #  quietly, with a screenshot that looks plausible either way.
    #
    #  Reported a FOURTH time: "the glass effect from the video still not
    #  the same fix i want the one in the video".
    #
    #  Every previous round tuned `apple` — blur down, refraction up,
    #  distortion up, glass_opacity 0.75 -> 0.60, $term 0.70 -> 0.55 — and
    #  each was a real improvement measured against the round before it.
    #  None of them could ever land, because they were all converging on
    #  the wrong target.
    #
    #  DESIGN-SPEC.md has had the answer written down the whole time, in
    #  the table headed "His own `glass` preset vs the `apple` preset, in
    #  his numbers":
    #
    #      setting                apple     his glass
    #      chromatic_aberration   0.3       0.8
    #      lens_distortion        —         0.9   ("almost maximum dome")
    #      contrast               <1.0      1.7
    #      vibrancy               0.12      0.8
    #
    #  and this config chose `apple` deliberately, quoting his own
    #  "everyone's first instinct is to crank every slider and the result
    #  looks like a car windshield in the rain".
    #
    #  That argument is HIS, it is a good one, and it is about restraint in
    #  general — but the thing on screen in the video, the thing being
    #  pointed at four times, is the preset he actually runs. Following his
    #  advice instead of his settings is how a config ends up demonstrably
    #  tasteful and not what was asked for.
    #
    #  So: his four numbers exactly, and the rest carried over from the
    #  tuning that was already measured. blur stays LOW and refraction goes
    #  HIGHER still, because the ratio note above this block is the one
    #  finding from those rounds that is independent of which preset is
    #  being aimed at — a dominant blur is frosted glass, and frosted glass
    #  has nothing to refract.
    #
    #  `apple` is left in the file, unchanged and one word away. Going back
    #  is `default_preset = apple`.
    # ----------------------------------------------------------
    preset = name:videoglass, blur_strength:0.30, refraction_strength:0.85, chromatic_aberration:0.8, lens_distortion:0.9, fresnel_strength:0.70, specular_strength:0.60, edge_thickness:0.15, glass_opacity:0.55, saturation:1.0, vibrancy:0.8

    #  contrast 1.7 in BOTH variants, because it is one of his four numbers
    #  and is not a per-theme concern. brightness and the adaptive pair
    #  stay per-theme: those exist so a dark palette does not go muddy and
    #  a light one does not blow out, which is a fact about the wallpaper
    #  behind the glass rather than about the material.
    preset = name:videoglass:dark, brightness:0.85, contrast:1.70, adaptive_dim:0.35
    preset = name:videoglass:light, brightness:1.10, contrast:1.70, adaptive_boost:0.25

    # ----------------------------------------------------------
    #  Layer surfaces — bars, notifications, widgets
    #
    #  OFF. Two reasons, and the first is a footgun:
    #
    #  THE EMPTY-WHITELIST TRAP: `namespaces` empty means ALL layers get
    #  glassed, not none. An exclude-only config therefore glasses
    #  everything on the system. If this is ever turned on, name the
    #  namespaces explicitly.
    #
    #  THE SHADOW TRAP: the effect masks to visible content by alpha, and
    #  layer shadows count as visible content. Default mask_threshold is
    #  0.001 — essentially any pixel — so a widget with a drop shadow
    #  gets a glass rectangle around its shadow box. Raise the per-
    #  namespace threshold above the shadow's alpha; 0.05 is a start.
    #
    #  Tide Island's namespace is `quickshell`. The video author tried
    #  0.3 and 0.7 on his own Quickshell surfaces and ended up excluding
    #  them outright. Layer support also hooks Hyprland's private render
    #  pipeline and is the first thing to break across updates — which is
    #  the open question from REQUIREMENTS.md, answered here as
    #  "windows only, for now".
    # ----------------------------------------------------------
    layers {
        enabled = 0
        # If ever enabled, start from exactly this and nothing broader:
        # namespaces = quickshell
        # namespace_mask_thresholds = quickshell=0.3
    }
}

# ------------------------------------------------------------
#  Per-window control
#
#  Glass on a video player is wasted GPU and looks wrong. Note these use
#  0.56 matcher syntax (`match:class ^(x)$`), NOT the `class:x` form in
#  hyprglass's README, which predates the rule rewrite — see MIGRATION.md.
# ------------------------------------------------------------
windowrule = tag +hyprglass_disabled, match:class ^(mpv|mpvk)$
windowrule = tag +hyprglass_disabled, match:fullscreen true

# ---- AND THE ONE THAT TAKES IT BACK OFF ----
#
# A rule-applied tag is ADDITIVE AND STICKY. Hyprland re-evaluates the
# rule when the window's fullscreen state changes and adds the tag, but
# nothing ever removes it — so a window that was fullscreen ONCE stays
# `hyprglass_disabled` for the rest of its life. Measured on a scratch
# kitty:
#
#     spawned          fs=0   []
#     fullscreened     fs=2   [hyprglass_disabled*]
#     unfullscreened   fs=0   [hyprglass_disabled*]   <- stuck
#
# Which means: watch one video fullscreen, leave fullscreen, and that
# browser has no glass again until you close it. Every long-lived window
# on this desktop drifts glassless over a session, one fullscreen at a
# time, and nothing about it is visible at the moment it happens.
#
# The `-` counterpart fires on the same state change in the other
# direction and clears it. Verified over the same round trip: the tag is
# gone at fs=0. The `*` in `hyprctl clients` marks a tag as rule-applied,
# and a rule is the ONLY thing that can clear one: `hyprctl dispatch
# tagwindow -hyprglass_disabled address:0x...` answers `ok` and leaves the
# tag exactly where it was. Tested, on a window that had it stuck.
#
# It clears on the next fullscreen TRANSITION, not on reload — a window
# already carrying the stuck tag when this rule went in keeps it until it
# is fullscreened and restored once, or restarted. Same for the windows
# still holding `hyprglass_preset_high_contrast*` from the rule deleted
# below: `hyprctl reload` does not re-derive tags, it only stops handing
# out new ones.
windowrule = tag -hyprglass_disabled, match:fullscreen false

# Light glass in the browser.
windowrule = tag +hyprglass_theme_light, match:class ^(firefox|brave-browser|brave)$

# ---- THE TERMINAL NEVER USED THE PRESET ABOVE ----
#
# There was a second rule here:
#
#     windowrule = tag +hyprglass_preset_high_contrast, match:class ^(kitty|scratch-term[12]|nvimsum)$
#
# meant as "punchier glass on the terminal". It is deleted, and it is the
# whole of "the terminal still is not glass". `high_contrast` is a plugin
# BUILT-IN, and a preset tag outranks `default_preset`, so every kitty on
# this desktop ran the built-in and NOT the `apple` preset defined at the
# top of this file. All of that tuning went to windows that are not the
# terminal — which is the one window the report was ever about.
#
# Measured on a 500x300 kitty at background_opacity 0.70, floated over the
# same patch of wallpaper, as the regression slope of on-screen luminance
# against the bare wallpaper's (1.0 = a clean pane, 0.0 = paint):
#
#     glass off, kitty alpha only    0.302     (== 1 - 0.70, exactly)
#     + apple preset                 0.140     46% of what reaches it
#     + high_contrast tag            0.054     18%   <- was shipping
#
# 5% of the desktop was arriving through the terminal. Wallpaper contrast
# of SD 42.6 came out the other side as SD 2.5 — under the ~2 LSB of
# dither noise the panel adds anyway, which is the literal definition of
# invisible. `high_contrast` is high contrast in the WINDOW, by making the
# slab opaque; it is not a punchier lens.
#
# Nothing needs to replace it. `default_preset = apple` already reaches
# every glassed window, so deleting the rule is the fix, and it retires
# the class-list fragility the old comment here warned about: the
# scratchpads and the sum.md editor have their own classes (see
# binds.conf), an anchored ^(kitty)$ silently stopped matching them the
# day that happened, and a list that has to be kept in sync with every
# future `--class` is a trap with no error message. There is no list now.
#
# On window SIZE, since that was the suspicion: same preset, same patch of
# wallpaper, 500x300 vs 1340x730 measured 0.140 vs 0.126 — a 10% edge to
# the small window, against the 160% the preset was worth. Size is real
# and it is not the problem; a big window just shows you more square
# inches of whatever the material is, so a dead material reads deader.

# ---- GLASS NEEDS A WINDOW YOU CAN SEE THROUGH ----
#
# Nothing below this line makes glass appear on an opaque window, and
# that — not the plugin, not this file — is why the terminal showed no
# glass for the whole first pass. The effect refracts what is BEHIND the
# window. kitty.conf sets background_opacity 0.95, which leaves 5% of the
# background to refract, and the result is a flat rectangle that looks
# identical with the plugin enabled and disabled. Measured both ways.
#
# The terminal's opacity is therefore set at the spawn site, in
# binds.conf's $term, so it applies under Hyprland without changing the
# kitty config the qtile/X11 session also reads.
#
# The same applies to anything else you want glassed: give it
# transparency first, then tag it.

# Live tuning without a reload — tag, look, adjust:
#   hyprctl dispatch tagwindow +hyprglass_preset_subtle
