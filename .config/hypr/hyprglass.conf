# ============================================================
#  hyprglass — liquid glass
#
#  Enable with:
#      hyprpm add https://github.com/hyprnux/hyprglass
#      hyprpm enable hyprglass
#      # then uncomment the source line in hyprland.conf
#
#  VERSION TRAP: the plugin compares its build-time ABI signature
#  against the running compositor. Re-run `hyprpm update` after every
#  Hyprland upgrade or it silently refuses to load.
#
#  ############  THIS FILE WAS REWRITTEN AGAINST THE REAL PLUGIN  #####
#
#  The first draft was transcribed from the video's narration, before
#  the plugin was installed. Checked against hyprglass's own README,
#  four things in it were wrong, and none would have errored loudly:
#
#    1. `preset = apple` — WRONG KEY AND WRONG VALUE. The key is
#       `default_preset`, and there is no `apple` preset. The built-ins
#       are high_contrast, subtle, clear, glass. The video's "just run
#       the Apple preset" refers to a look, not a shipped preset. It is
#       DEFINED below instead, so the spec's intent survives.
#    2. `layers_enabled` / `mask_threshold` are not top-level keys.
#       Layers are a nested block, and mask thresholds are per-namespace.
#    3. `edge_thickness = 0.18` is out of range — the documented range
#       is 0.0-0.15.
#    4. The theme/preset windowrule tags were missing their leading `+`.
#
#  NOTE ON BLUR: an earlier comment here claimed native blur must be
#  turned off globally before this loads. It does not. `manage_window_blur`
#  (default on) sets `noblur` on each glassed window itself, so native
#  blur keeps serving everything hyprglass does NOT touch. What DOES
#  matter is `blur:new_optimizations`, whose cached blur hides the glass
#  on static windows — looks.conf already has it false, with the reason.
# ============================================================

plugin:hyprglass {
    enabled = 1

    # Let the plugin set `noblur` per glassed window itself.
    manage_window_blur = 1

    default_theme = dark
    default_preset = apple

    # Tint follows the palette. theme-apply writes $glass_tint into
    # colors.conf as 0xRRGGBBAA (alpha last, 0x40 == 25%), and looks.conf
    # has already sourced it by the time this file is read.
    tint_color = $glass_tint

    # ----------------------------------------------------------
    #  The "Apple" preset, defined here because the plugin has no such
    #  built-in. The video is emphatic about why it is the right target:
    #
    #    "Apple's material is desaturated, low contrast, gentle
    #     refraction. Everyone's first instinct is to crank every slider
    #     and the result looks like a car windshield in the rain."
    #
    #  So every value below sits at or BELOW the plugin's own default.
    #  For contrast, the video author's personal "glass" look runs
    #  chromatic_aberration 0.8, lens_distortion 0.9, contrast 1.7,
    #  vibrancy 0.8 — recorded in DESIGN-SPEC.md, deliberately not used.
    #
    #  Preset values WIN over the global settings above (resolution is
    #  preset chain -> theme override -> global -> hardcoded default),
    #  which is why the tuning lives in the preset and not loose in the
    #  block where it would be silently outranked.
    # ----------------------------------------------------------
    #                                        plugin default -> ours
    preset = name:apple, blur_strength:1.0, refraction_strength:0.35, chromatic_aberration:0.3, lens_distortion:0.25, fresnel_strength:0.5, specular_strength:0.4, edge_thickness:0.15, glass_opacity:0.85, saturation:0.9, vibrancy:0.12

    # Theme variants. Brightness/contrast have no global default at all —
    # they fall through to per-theme values — so they belong here.
    preset = name:apple:dark, brightness:0.82, contrast:0.90, adaptive_dim:0.35
    preset = name:apple:light, brightness:1.12, contrast:0.92, adaptive_boost:0.25

    # ----------------------------------------------------------
    #  Layer surfaces — bars, notifications, widgets
    #
    #  OFF. Two reasons, and the first is a footgun:
    #
    #  THE EMPTY-WHITELIST TRAP: `namespaces` empty means ALL layers get
    #  glassed, not none. An exclude-only config therefore glasses
    #  everything on the system. If this is ever turned on, name the
    #  namespaces explicitly.
    #
    #  THE SHADOW TRAP: the effect masks to visible content by alpha, and
    #  layer shadows count as visible content. Default mask_threshold is
    #  0.001 — essentially any pixel — so a widget with a drop shadow
    #  gets a glass rectangle around its shadow box. Raise the per-
    #  namespace threshold above the shadow's alpha; 0.05 is a start.
    #
    #  Tide Island's namespace is `quickshell`. The video author tried
    #  0.3 and 0.7 on his own Quickshell surfaces and ended up excluding
    #  them outright. Layer support also hooks Hyprland's private render
    #  pipeline and is the first thing to break across updates — which is
    #  the open question from REQUIREMENTS.md, answered here as
    #  "windows only, for now".
    # ----------------------------------------------------------
    layers {
        enabled = 0
        # If ever enabled, start from exactly this and nothing broader:
        # namespaces = quickshell
        # namespace_mask_thresholds = quickshell=0.3
    }
}

# ------------------------------------------------------------
#  Per-window control
#
#  Glass on a video player is wasted GPU and looks wrong. Note these use
#  0.56 matcher syntax (`match:class ^(x)$`), NOT the `class:x` form in
#  hyprglass's README, which predates the rule rewrite — see MIGRATION.md.
# ------------------------------------------------------------
windowrule = tag +hyprglass_disabled, match:class ^(mpv|mpvk)$
windowrule = tag +hyprglass_disabled, match:fullscreen true

# Light glass in the browser, punchier glass on the terminal.
windowrule = tag +hyprglass_theme_light, match:class ^(firefox|brave-browser|brave)$
windowrule = tag +hyprglass_preset_high_contrast, match:class ^(kitty)$

# Live tuning without a reload — tag, look, adjust:
#   hyprctl dispatch tagwindow +hyprglass_preset_subtle
