# ============================================================
#  Appearance, layout behaviour, animations
#
#  Colours: the qtile side is pywal-driven (colors.py reads
#  ~/.cache/wal).  Hyprland cannot read pywal directly, but pywal
#  writes ~/.cache/wal/colors-hyprland.conf when its Hyprland
#  template is installed — see MIGRATION.md.  Until then the
#  literals below match the qtile bar's base (#11111b).
# ============================================================

# Live theme colours, written by AtiScriptsV1/theme/theme-apply's gen_hypr_colors.
# Covers all 20+ named themes AND wal mode, so this tracks whatever
# theme-toggle last selected — the same palette qtile/eww/kitty get.
#
# The fallbacks below apply until theme-apply has run once under this
# config.  Hyprland takes the LAST assignment, so sourcing after them
# means generated values win when the file exists, and nothing breaks
# when it doesn't.
$accent   = rgb(89b4fa)
$inactive = rgb(313244)
$bg       = rgb(11111b)
$border_active   = rgb(89b4fa)
$border_inactive = rgb(313244)

source = ./colors.conf

# Kept as an alias: earlier revisions of this file used $active.
$active = $accent

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    # Borders track qtile's layout_theme, where border_focus = colors[8]
    # (the cyan slot), NOT the accent. Using $accent here is what made
    # every theme show a green border — see gen_hypr_colors in
    # AtiScriptsV1/theme-apply.
    col.active_border = $border_active
    col.inactive_border = $border_inactive

    # qtile ran MonadTall as the daily layout; `master` is its analogue
    # (one master column, stack beside it) and keeps mod+h/l meaning
    # shrink/grow rather than "move focus into a binary tree".
    layout = master

    allow_tearing = false
    resize_on_border = true
}

decoration {
    rounding = 10

    # NATIVE BLUR — active only until hyprglass goes in.
    #
    # hyprglass replaces this entirely; it cannot run alongside native blur
    # on the same windows, and it sets `noblur` on every glass window
    # itself.  When the plugin is enabled, set enabled = false here.
    #
    # new_optimizations is deliberately OFF.  With it on, Hyprland caches a
    # blurred frame captured BEFORE plugin decorations draw — which is the
    # exact cause of the "glass appears while dragging, vanishes on release"
    # bug the hyprglass video calls out.  Costs a little performance, saves
    # an evening of debugging.  See DESIGN-SPEC.md, video 2, bug 1.
    blur {
        # OFF because hyprglass is loaded. The comment above has said to do
        # this since the plugin went in, and it had not been done — which is
        # the whole of "the glass terminal does not work, it is just blurred".
        # Native blur and hyprglass both claim the same window: the gaussian
        # pass runs and you get frosting, never refraction. Measured: plugin
        # loaded (hyprglass 1.0.0 by Hyprnux) and decoration:blur:enabled
        # still reading `int: 1`.
        enabled = false
        size = 6
        passes = 2
        new_optimizations = false
        ignore_opacity = true
    }

    # NOTE: this blur reaches LAYER SURFACES too, not only windows. See the
    # `layerrule` lines after this block for the one that had to be exempted
    # and why.

    # The qtile dropdowns used opacity=1 except deepseek at 0.95;
    # rules.conf reproduces the per-window values, so the global
    # defaults stay opaque.
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 12
        render_power = 3
        color = rgba(0000009a)
    }
}

# ------------------------------------------------------------
#  Layer rules
# ------------------------------------------------------------
#  "When I take a screenshot and try to select an area it shows the whole
#  screen as blur." Real, and the cause is the blur block above, not
#  slurp's flags.
#
#  **Hyprland's blur applies to LAYER SURFACES, not just windows**, and
#  slurp's selection overlay is a full-screen one — measured while it was
#  up:
#
#      level 3   ns='selection'   1366 x 768
#
#  It is translucent by design (`-b 00000040`, a 25% black dim), so the
#  blur pass has something to work with and duly blurs the entire desktop
#  behind it. `ignore_opacity = true` guarantees it: that setting exists
#  precisely to blur a surface regardless of how transparent it is.
#
#  Which defeats the one job an area selector has — you cannot aim at what
#  you cannot resolve. The four slurp flags in binds.conf were an earlier
#  attempt on the same symptom from the wrong end: they fixed the DIM (a
#  heavy light WASH over everything) and could never have touched the blur,
#  because the blur was never slurp's. It is the compositor's.
#
#  noanim rides along: a selector that fades in is a selector you wait for,
#  and Print is pressed in a hurry.
layerrule = blur false, match:namespace ^(selection)$
layerrule = animation none, match:namespace ^(selection)$

#  ---- ROFI DOES NOT FADE OUT, AND THAT IS A BUG FIX ----
#
#  Reported: picking a theme from the rofi picker "freezes rofi for ~0.4 s"
#  before the new palette arrives. The 0.4 s is not a coincidence and it is
#  not the theme code — it is `animation = fade, 1, 4` below, which is 400 ms
#  in Hyprland's deciseconds.
#
#  Measured, with a control run that changed no theme at all — rofi opened and
#  dismissed with Escape, frames differenced over the panel only (the first
#  attempt sampled the whole screen and read the driving terminal's own
#  scrolling as change, which is a trap this tree has recorded before):
#
#      +3558 ms   Hyprland drops the layer from `hyprctl layers`
#      +3593 ms   the panel STARTS changing — the fade begins here
#      +3996 ms   d(prev) reaches the noise floor
#
#  So rofi is painted for ~400 ms after the compositor says it is gone, with
#  or without a theme change. During a theme change the overlay screenshots
#  the screen and holds it, so it freezes a HALF-FADED rofi in front of you —
#  which is the reported "freeze and glitch", and why NEXT-SESSION.md's guess
#  that "the frozen frame holds a rofi that has already exited" was right
#  about the symptom and wrong about who was late.
#
#  Waiting 400 ms in theme-toggle would also fix it and would charge every
#  theme change 400 ms for one program's exit animation. Removing the
#  animation costs nothing and is the same call `selection` above already
#  makes for the same reason: a launcher you have finished with should be
#  gone, not dissolving.
layerrule = animation none, match:namespace ^(rofi)$

#  ---- HINTIUM'S SCROLL MODE DID NOT GLITCH-CLOSE-AND-REOPEN ITSELF ----
#
#  Reported: pressing j/k in scroll mode makes the label and outline
#  flicker "like it closes and opens the mode" on every keystroke. Same
#  root cause as the rofi entry above, on hintium's own overlay this time:
#  ydotool's synthetic wheel event does not reach the window under a mapped
#  gtk-layer-shell surface at all, even with its input region emptied for
#  click-through -- confirmed live with a minimal reproduction outside
#  hintium entirely. The only working fix found is for hintium to hide and
#  immediately remap that same surface around every single wheel dispatch
#  (see hintium/scroll.py's _hidden_for_dispatch), which without this rule
#  runs into the identical 400ms fade `animation = fade, 1, 4` gives every
#  layer surface -- read by the fade as "dismissed, then reopened" on every
#  keystroke, i.e. exactly the reported glitch, not a rendering bug in
#  hintium's own drawing.
#
#  hintium sets an explicit "hintium" namespace on its own overlay for
#  this rule to target -- every gtk-layer-shell app defaults to the
#  library's own literal namespace "gtk-layer-shell" otherwise, which this
#  is deliberately not matching.
layerrule = animation none, match:namespace ^(hintium)$

#  ---- NO FADE FOR NOTIFICATIONS OR THE QML "ROFI-LIKE" POPUPS EITHER ----
#
#  "i dont want animtion for the dunset notifications and dont want also
#  animaiton for these popup rofi like qml scirpts ... to be smooth" — same
#  400ms `animation = fade, 1, 4` every layer surface gets by default, on
#  the same two kinds of surface that fire constantly and are gone again
#  in under a second: dunst's popups (measured namespace "notifications",
#  confirmed live via `hyprctl layers` — dunst does not set a custom one,
#  so it is the literal string the binary itself uses) and ati-menu's own
#  dmenu view (Menu.qml's PanelWindow, WlrLayershell.namespace
#  "omarchy-menu" — the thing rofi_input/rofi_select/ati-menu-select
#  route spellcheck/translate/record's prompts through on Wayland).
layerrule = animation none, match:namespace ^(notifications)$
layerrule = animation none, match:namespace ^(omarchy-menu)$

animations {
    enabled = true

    # An island-ish feel: quick, slightly overshooting, never floaty.
    bezier = island, 0.16, 1, 0.3, 1
    bezier = snap,   0.25, 0.1, 0.25, 1

    animation = windows,     1, 4, island, popin 90%
    animation = windowsOut,  1, 3, snap,   popin 90%
    animation = border,      1, 6, snap
    animation = fade,        1, 4, snap
    animation = workspaces,  1, 4, island, slide
    animation = specialWorkspace, 1, 4, island, slidevert
}

master {
    # ---- WHY `slave` AND NOT `master` ----
    #
    # This used to say `new_status = master`, which reads like the right
    # thing for a layout whose whole point is a master pane — and is the
    # opposite of what qtile did. MEASURED on an empty workspace 9, three
    # alacritty windows opened one after another with focus left where
    # each spawn put it (screen 1366x768, gaps 4/8, so the tiling area is
    # x=10..1356):
    #
    #     new_status = master        new_status = slave (now)
    #     -------------------        ------------------------
    #     A:  [10,43] 1346x715       A:  [10,43] 1346x715
    #     +B: B [10,43] 1005x715     +B: A [10,43] 1005x715
    #         A [1027,43] 329x715        B [1027,43] 329x715
    #     +C: C [10,43] 1005x715     +C: A [10,43] 1005x715
    #         B [1027,43] 329x352        B [1027,43] 329x352
    #         A [1027,407] 329x351       C [1027,407] 329x351
    #
    # So with `master`, every new terminal SEIZED the left column and shoved
    # the window you were working in into the 329px stack on the right. That
    # is the behaviour being complained about: "when I am in master and open
    # a new one it should [stay] in the left side not the right side".
    #
    # qtile's MonadTall (../qtile/config.py:7322) does not work that way.
    # Its clients list is [master, slave, slave, ...] and
    # new_client_position defaults to 'after_current' — with focus on the
    # master, index 0, a new client is inserted at index 1, i.e. the TOP of
    # the stack. The master is never displaced by opening a window; the only
    # way to become master there is an explicit swap. `slave` is that.
    #
    # new_on_top = true for the same line of reasoning: qtile inserts
    # after_current, and after the master is the top of the stack. This is
    # only an approximation — qtile inserts after whichever window is
    # focused, so with focus on the SECOND slave qtile puts the new window
    # third while Hyprland still puts it first. Hyprland's master layout has
    # no per-position insert, only the top/bottom flag, so the closest
    # available match is the one that gets the master case (the case in the
    # complaint) exactly right.
    #
    # mfact stays 0.55 in the file but is not what the session runs: it is
    # overwritten live to 0.75 by layout-cycle.sh, which is where qtile's
    # own ratio=0.75 is transcribed. `hyprctl getoption master:mfact`
    # returns 0.75 on a running session.
    new_status = slave
    new_on_top = true
    mfact = 0.55
}

# ---- THE TREETAB TAB BAR ----
#
# layout-cycle.sh's third layout. Its own header explains the port: Hyprland
# has no Max and no tabbed layout, so both are ONE mechanism — a group — with
# the groupbar hidden (Max) or shown (TreeTab). The groupbar IS the window
# list, and drawing that list is "the only thing TreeTab adds to Max".
#
# Which makes it the one part of the port that had never been configured at
# all. Every option below read `set: false` from `hyprctl getoption`, so the
# tab bar was running Hyprland's built-in defaults:
#
#     col.active    66ffff00   yellow at 40% alpha
#     col.inactive  66777700   olive at 40% alpha
#     text_color    0xffffffff opaque white
#     font_size     8
#
# So the tab bar was YELLOW on all 21 palettes — the one piece of window
# chrome that ignored theme-apply entirely — and the titles were white at 8px
# over a 40%-alpha fill, i.e. over whatever happened to be behind the window.
# That is the reported symptom exactly: "the colors not follow the theme and
# the text of names not really appearing so I can not see what is what."
#
# ---- WHY THESE COLOURS ----
#
# The tabs take the BORDER roles, not new ones. A groupbar sits directly on
# top of the window it belongs to, so painting the active tab in the same
# colour as the focused window's border is what makes the bar read as part of
# that window rather than as a strip parked above it. $border_active is the
# cyan slot for the reason `general` above states — qtile's border_focus was
# colors[8], not the accent.
#
# ---- WHY ONE TEXT COLOUR, AFTER TRYING TWO ----
#
# The first version of this block set text_color = $bg and
# text_color_inactive = $fg, on the assumption that Hyprland fills each tab
# with col.active / col.inactive the way qtile's TreeTab fills its rows with
# active_bg / inactive_bg. That was modelled across all 21 palettes (worst
# case 5.89:1) and it was still WRONG, because the premise was wrong.
#
# MEASURED, grim on a headless output with two grouped terminals: the tab
# BODY samples #111111 — the desktop behind the window — on both the active
# and the inactive tab, while rows 63-65 sample #7dcfff (tokyonight's cyan,
# i.e. $border_active) under the active tab and #16161e ($bg_alt) under the
# inactive one.
#
# So Hyprland 0.56 does not fill tabs at all. col.active / col.inactive paint
# ONLY the `indicator_height` strip along the bottom, and the title is drawn
# over the gap above the window. Setting `gradients = true` changed nothing,
# and raising indicator_height to the full bar height did not fill it either.
#
# That makes a dark active ink actively harmful: $bg over the desktop is dark
# on dark, which is the reported bug reintroduced from the other side — and
# it is what the first version of this block shipped for one test cycle.
#
# There is exactly one surface here, so there is one ink. $fg is the palette's
# own colour for ink over the desktop, so it is legible on every theme by
# construction, and it moves with theme-apply. text_color_inactive is left
# UNSET deliberately: it falls back to text_color, and no palette slot is a
# dimmed $fg — using a semantic slot ($accent, $purple) to mean "dimmer"
# would be inventing a role the palette does not have. Active vs inactive is
# carried by the indicator strip, which is the one thing this renderer
# genuinely draws per state.
#
# ---- THE FONT IS NOT qtile's ----
#
# qtile's TreeTab is `font="Ubuntu Bold"` and copying that string here would
# have been silent breakage: `fc-match "Ubuntu Bold"` returns
# NotoSansCJK-Regular.ttc — there is no such family on this machine, and
# fontconfig substitutes a CJK face rather than failing. Every tab title
# would have rendered in Noto Sans CJK with nothing in any log. Inter Medium
# is what hyprlock.conf already uses and it fc-matches to a real Inter face.
#
# font_size 11 is qtile's TreeTab fontsize; height 20 is what an 11px Inter
# line needs, where the default 14 was built for the default 8px.
group {
    col.border_active = $border_active
    col.border_inactive = $border_inactive

    groupbar {
        # ---- OFF, AND DECLARED HERE SO A RELOAD CANNOT TURN IT BACK ON ----
        #
        # Reported: "when I am in max mode and reload the config, a
        # '--------' appears on top of the opened app with its name". It is
        # the groupbar, and the cause is that this block never set `enabled`.
        # Max and TreeTab are both GROUPS (see scripts/layout-cycle.sh), and
        # that script turns the groupbar off at runtime for both — but a
        # runtime `keyword` is not a config value, so `hyprctl reload` puts
        # every undeclared option back to its default. Measured:
        #
        #     before reload   int: 0, set: true
        #     after  reload   int: 1, set: false
        #
        # `set: false` is the tell — the option went back to being Hyprland's
        # rather than ours. Any option this config only ever sets by keyword
        # has the same hole; declaring it is what makes the reload a no-op.
        #
        # False for BOTH layouts, not just Max: TreeTab draws its own sidebar
        # (treetab.qml) and layout-cycle.sh's own note explains that showing
        # Hyprland's strip as well would draw the window list twice and take
        # 20 px out of the window's height for the second copy.
        enabled = false

        font_family = Inter Medium
        font_size = 11
        height = 20

        # Flat: with one colour per state there is no second stop to ramp to,
        # and the rest of this shell's chrome is flat fills.
        gradients = false

        # The indicator strip, which is the only thing these two actually
        # paint. Same roles as the window border directly below it, so the
        # active tab's underline and the focused window's border are one line
        # of the same colour rather than two nearly-matching ones.
        col.active = $border_active
        col.inactive = $border_inactive

        text_color = $fg
    }
}

dwindle {
    # dwindle:pseudotile was removed as a config option in 0.5x.
    # Pseudotiling is still available, but as a dispatcher rather than a
    # mode: bind a key to `pseudo` if you want it.
    preserve_split = true
    force_split = 2
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0

    # qtile's focus model did not warp the cursor between screens.
    mouse_move_focuses_monitor = true

    # misc:vfr was removed in 0.5x — variable refresh is handled by the
    # renderer now and is on by default, so there is nothing to set.

    # ---- THE "Terminate / Wait" BOX THAT APPEARS ON A CONFIG RELOAD ----
    #
    # Reported as: reloading the Hyprland config sometimes puts up a message
    # offering "terminal or wait". That is Hyprland's own ANR box, and the
    # report is a near-perfect transcription of it — the process is spawned
    # literally as
    #
    #     hyprland-dialog --title Application Not Responding
    #       --text An application <name> is not responding.
    #             What do you want to do with it?
    #       --buttons Terminate;Wait
    #
    # Captured verbatim from /proc/<pid>/cmdline by freezing a throwaway
    # kitty with SIGSTOP; "Terminate" is the word being read as "terminal".
    #
    # It fires when a client misses `anr_missed_pings` consecutive pings.
    # CALIBRATED on this machine, by SIGSTOPping that window and timing the
    # box, rather than assuming a ping is a second:
    #
    #     anr_missed_pings = 5   ->  box after  7.9 s
    #     anr_missed_pings = 20  ->  box after 30.8 s
    #
    # i.e. ~1.53 s per ping, linear. The default 5 is therefore an EIGHT
    # SECOND verdict on whether an app is dead.
    #
    # The reload is the trigger you notice, not the cause. A plain
    # `hyprctl reload` is 25-100 ms (timed 6x) and never trips it, and
    # neither does reloading 6x under 16 busy loops. What trips it is a
    # reload that arrives inside a saturated moment — and the reload this
    # desktop performs most often is the one `theme-apply` makes at line 462
    # of AtiScriptsV1/theme/theme-apply, in the middle of killing and relaunching
    # brave, repacking a Chromium extension and regenerating the boot
    # splash. rules.conf caught it there: qutebrowser missed its five pings
    # at t=13.93 s and was answering again by t=15.04 s.
    #
    # That last number is the whole argument. The app was never hung — the
    # box was WRONG, and it was obsolete 1.1 s later, which is faster than
    # you can read it and decide.
    #
    # rules.conf used to argue against touching this, on the grounds that
    # "an app that really has hung is worth being told about". That is true
    # of `enable_anr_dialog = false`, which really does trade the feature
    # away, and it is NOT true of this key — the two were lumped together
    # and only one of them deserved the objection. A genuinely hung app is
    # hung permanently, so raising the count does not lose it; you are told
    # at ~31 s instead of ~8 s. All that is given up is being told about
    # stalls in the 8-31 s band, and every stall in that band observed on
    # this machine so far has resolved itself unaided.
    #
    # `enable_anr_dialog` deliberately stays ON (default) for that reason.
    anr_missed_pings = 20
}
