# ============================================================
#  Appearance, layout behaviour, animations
#
#  Colours: the qtile side is pywal-driven (colors.py reads
#  ~/.cache/wal).  Hyprland cannot read pywal directly, but pywal
#  writes ~/.cache/wal/colors-hyprland.conf when its Hyprland
#  template is installed — see MIGRATION.md.  Until then the
#  literals below match the qtile bar's base (#11111b).
# ============================================================

# Live theme colours, written by AtiScriptsV1/theme-apply's gen_hypr_colors.
# Covers all 20+ named themes AND wal mode, so this tracks whatever
# theme-toggle last selected — the same palette qtile/eww/kitty get.
#
# The fallbacks below apply until theme-apply has run once under this
# config.  Hyprland takes the LAST assignment, so sourcing after them
# means generated values win when the file exists, and nothing breaks
# when it doesn't.
$accent   = rgb(89b4fa)
$inactive = rgb(313244)
$bg       = rgb(11111b)
$border_active   = rgb(89b4fa)
$border_inactive = rgb(313244)

source = ./colors.conf

# Kept as an alias: earlier revisions of this file used $active.
$active = $accent

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    # Borders track qtile's layout_theme, where border_focus = colors[8]
    # (the cyan slot), NOT the accent. Using $accent here is what made
    # every theme show a green border — see gen_hypr_colors in
    # AtiScriptsV1/theme-apply.
    col.active_border = $border_active
    col.inactive_border = $border_inactive

    # qtile ran MonadTall as the daily layout; `master` is its analogue
    # (one master column, stack beside it) and keeps mod+h/l meaning
    # shrink/grow rather than "move focus into a binary tree".
    layout = master

    allow_tearing = false
    resize_on_border = true
}

decoration {
    rounding = 10

    # NATIVE BLUR — active only until hyprglass goes in.
    #
    # hyprglass replaces this entirely; it cannot run alongside native blur
    # on the same windows, and it sets `noblur` on every glass window
    # itself.  When the plugin is enabled, set enabled = false here.
    #
    # new_optimizations is deliberately OFF.  With it on, Hyprland caches a
    # blurred frame captured BEFORE plugin decorations draw — which is the
    # exact cause of the "glass appears while dragging, vanishes on release"
    # bug the hyprglass video calls out.  Costs a little performance, saves
    # an evening of debugging.  See DESIGN-SPEC.md, video 2, bug 1.
    blur {
        # OFF because hyprglass is loaded. The comment above has said to do
        # this since the plugin went in, and it had not been done — which is
        # the whole of "the glass terminal does not work, it is just blurred".
        # Native blur and hyprglass both claim the same window: the gaussian
        # pass runs and you get frosting, never refraction. Measured: plugin
        # loaded (hyprglass 1.0.0 by Hyprnux) and decoration:blur:enabled
        # still reading `int: 1`.
        enabled = false
        size = 6
        passes = 2
        new_optimizations = false
        ignore_opacity = true
    }

    # NOTE: this blur reaches LAYER SURFACES too, not only windows. See the
    # `layerrule` lines after this block for the one that had to be exempted
    # and why.

    # The qtile dropdowns used opacity=1 except deepseek at 0.95;
    # rules.conf reproduces the per-window values, so the global
    # defaults stay opaque.
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 12
        render_power = 3
        color = rgba(0000009a)
    }
}

# ------------------------------------------------------------
#  Layer rules
# ------------------------------------------------------------
#  "When I take a screenshot and try to select an area it shows the whole
#  screen as blur." Real, and the cause is the blur block above, not
#  slurp's flags.
#
#  **Hyprland's blur applies to LAYER SURFACES, not just windows**, and
#  slurp's selection overlay is a full-screen one — measured while it was
#  up:
#
#      level 3   ns='selection'   1366 x 768
#
#  It is translucent by design (`-b 00000040`, a 25% black dim), so the
#  blur pass has something to work with and duly blurs the entire desktop
#  behind it. `ignore_opacity = true` guarantees it: that setting exists
#  precisely to blur a surface regardless of how transparent it is.
#
#  Which defeats the one job an area selector has — you cannot aim at what
#  you cannot resolve. The four slurp flags in binds.conf were an earlier
#  attempt on the same symptom from the wrong end: they fixed the DIM (a
#  heavy light WASH over everything) and could never have touched the blur,
#  because the blur was never slurp's. It is the compositor's.
#
#  noanim rides along: a selector that fades in is a selector you wait for,
#  and Print is pressed in a hurry.
layerrule = blur false, match:namespace ^(selection)$
layerrule = animation none, match:namespace ^(selection)$

animations {
    enabled = true

    # An island-ish feel: quick, slightly overshooting, never floaty.
    bezier = island, 0.16, 1, 0.3, 1
    bezier = snap,   0.25, 0.1, 0.25, 1

    animation = windows,     1, 4, island, popin 90%
    animation = windowsOut,  1, 3, snap,   popin 90%
    animation = border,      1, 6, snap
    animation = fade,        1, 4, snap
    animation = workspaces,  1, 4, island, slide
    animation = specialWorkspace, 1, 4, island, slidevert
}

master {
    # ---- WHY `slave` AND NOT `master` ----
    #
    # This used to say `new_status = master`, which reads like the right
    # thing for a layout whose whole point is a master pane — and is the
    # opposite of what qtile did. MEASURED on an empty workspace 9, three
    # alacritty windows opened one after another with focus left where
    # each spawn put it (screen 1366x768, gaps 4/8, so the tiling area is
    # x=10..1356):
    #
    #     new_status = master        new_status = slave (now)
    #     -------------------        ------------------------
    #     A:  [10,43] 1346x715       A:  [10,43] 1346x715
    #     +B: B [10,43] 1005x715     +B: A [10,43] 1005x715
    #         A [1027,43] 329x715        B [1027,43] 329x715
    #     +C: C [10,43] 1005x715     +C: A [10,43] 1005x715
    #         B [1027,43] 329x352        B [1027,43] 329x352
    #         A [1027,407] 329x351       C [1027,407] 329x351
    #
    # So with `master`, every new terminal SEIZED the left column and shoved
    # the window you were working in into the 329px stack on the right. That
    # is the behaviour being complained about: "when I am in master and open
    # a new one it should [stay] in the left side not the right side".
    #
    # qtile's MonadTall (../qtile/config.py:7322) does not work that way.
    # Its clients list is [master, slave, slave, ...] and
    # new_client_position defaults to 'after_current' — with focus on the
    # master, index 0, a new client is inserted at index 1, i.e. the TOP of
    # the stack. The master is never displaced by opening a window; the only
    # way to become master there is an explicit swap. `slave` is that.
    #
    # new_on_top = true for the same line of reasoning: qtile inserts
    # after_current, and after the master is the top of the stack. This is
    # only an approximation — qtile inserts after whichever window is
    # focused, so with focus on the SECOND slave qtile puts the new window
    # third while Hyprland still puts it first. Hyprland's master layout has
    # no per-position insert, only the top/bottom flag, so the closest
    # available match is the one that gets the master case (the case in the
    # complaint) exactly right.
    #
    # mfact stays 0.55 in the file but is not what the session runs: it is
    # overwritten live to 0.75 by layout-cycle.sh, which is where qtile's
    # own ratio=0.75 is transcribed. `hyprctl getoption master:mfact`
    # returns 0.75 on a running session.
    new_status = slave
    new_on_top = true
    mfact = 0.55
}

dwindle {
    # dwindle:pseudotile was removed as a config option in 0.5x.
    # Pseudotiling is still available, but as a dispatcher rather than a
    # mode: bind a key to `pseudo` if you want it.
    preserve_split = true
    force_split = 2
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0

    # qtile's focus model did not warp the cursor between screens.
    mouse_move_focuses_monitor = true

    # misc:vfr was removed in 0.5x — variable refresh is handled by the
    # renderer now and is on by default, so there is nothing to set.
}
