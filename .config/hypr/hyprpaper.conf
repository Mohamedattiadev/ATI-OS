# ============================================================
#  hyprpaper — wallpaper
#
#  Reads the wallpaper theme-apply/pywal last selected, so both
#  sessions agree on the wallpaper without a second source of truth.
#  pywal records its last image at ~/.cache/wal/wal.
#
#  hyprpaper cannot read that file itself, so autostart.conf runs
#  scripts/wallpaper-sync.sh which preloads whatever it points at.
#  This file is only the fallback for a cold machine.
# ============================================================

ipc = on
splash = false

# Fallback only — wallpaper-sync.sh overrides this at startup.
# preload = ~/.config/wallpapers/default.jpg
# wallpaper = , ~/.config/wallpapers/default.jpg
