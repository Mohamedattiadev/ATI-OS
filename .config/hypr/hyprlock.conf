# ============================================================
#  hyprlock — lock screen
#
#  Follows the design described in the notch video (DESIGN-SPEC.md):
#  not a wallpaper, but your actual desktop at the instant of locking,
#  frozen, blurred and dimmed, with a macOS-style clock stack over it.
#
#  hyprlock's `path = screenshot` does the capture natively, so the
#  JPEG-vs-PNG timing problem that video hit does not apply here — that
#  was his own Quickshell implementation encoding the frame himself.
#
#  ############  SECURITY — READ BEFORE TRUSTING THIS  ############
#
#  The author of that video wired his lock screen to a standard-looking
#  PAM configuration and it accepted ANY password — any string at all —
#  and he only found out because he tested it deliberately.
#
#  hyprlock uses /etc/pam.d/hyprlock, which the package ships. AFTER
#  INSTALLING, TEST IT:
#
#      1. Lock the session      (hyprlock)
#      2. Type a WRONG password and press Enter
#      3. Confirm it is REJECTED
#      4. Only then trust it
#
#  If step 3 fails, do not use this until it is fixed. A lock screen
#  that looks right and admits anyone is worse than none, because you
#  will believe you are protected.
#  ################################################################
# ============================================================

source = ./colors.conf

general {
    hide_cursor = true

    # `grace`, `no_fade_in` and `disable_loading_bar` used to live here.
    # hyprlock 0.9.6 rejects all three ("config option does not exist")
    # and carries on with the rest, so they were dead lines rather than
    # errors — the only way to see it is hyprlock's own stderr, not
    # `hyprctl configerrors`, which knows nothing about this file.
    #
    # grace is now a COMMAND-LINE flag, not a config option. It defaults
    # to 0 (no grace period), which is the value we wanted anyway, and
    # hypridle passes it explicitly — see hypridle.conf's lock_cmd.
    # The other two were removed outright with no replacement.
    #
    # Valid general keys in 0.9.6, for when this needs editing again:
    #   fail_timeout  fractional_scaling  hide_cursor  ignore_empty_input
    #   immediate_render  screencopy_mode  text_trim
}

background {
    monitor =
    # The live desktop, frozen at the moment of locking.
    path = screenshot

    blur_passes = 3
    blur_size = 8
    noise = 0.011
    contrast = 0.9
    # ~20% dim, matching the spec — enough that the clock reads cleanly
    # over arbitrary content without hiding what was underneath.
    brightness = 0.8
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# ------------------------------------------------------------
#  The top gradient — DESIGN-SPEC.md: "soft gradient at top so the clock
#  stays readable".
#
#  IT IS AN IMAGE, AND EVERY OTHER OPTION WAS TRIED FIRST — in a NESTED
#  compositor, because the rule in this repo is that hyprlock is never tested
#  by locking the live session. All three failed at parse time:
#
#      shape { color = <gradient> }   "cannot parse as an int" — shape takes
#                                     a flat colour, and a flat wash over a
#                                     blurred desktop is a band with a hard
#                                     edge exactly where this has to be
#                                     invisible
#      image { size = 4000, 420 }     "cannot parse as an int" — size is ONE int
#      image { size = 100% }          "cannot parse as an int"
#
#  Every one of those was a silent-looking config line that hyprlock reports
#  only on its own stderr, which `hyprctl configerrors` knows nothing about —
#  the same trap the `grace`/`no_fade_in` note above this file records. And a
#  FOURTH failure got past all of them by not being a config error at all: see
#  the note on `size` below, which crashed hyprlock outright.
#
#  WHY IT IS NEEDED AT ALL: the background is `screenshot`, i.e. whatever was
#  on screen at the instant of locking. Dimming it 20% is not enough on its
#  own, because a bright terminal or a white page under the clock is still
#  bright after a 20% cut. The gradient is what makes the clock legible
#  against ANY desktop rather than against a typical one.
#
#  Drawn before the labels: hyprlock composites widgets in declaration order,
#  so a gradient written after the clock would be drawn ON TOP of it.
image {
    monitor =
    path = ~/.cache/tide-island/lock-gradient.png
    # ONE int, and it is the WIDTH — hyprlock scales the height by the source
    # image's aspect ratio. That is not a detail: an early version of the
    # generator emitted an 8x1024 strip, and at this width hyprlock asked the
    # GPU for a 2400 x 307200 texture, failed to create the framebuffer, and
    # EXITED. On a real session that is a lock screen that dies at the instant
    # you lock it. Caught in a nested compositor; see scripts/lock-assets.sh.
    #
    # 2400 is wider than any monitor here, so the gradient spans the full width
    # with room to spare, and the source is 1600x280 so the height lands at
    # 2400 / (1600/280) = 420 px.
    size = 2400
    # No rounding: this reaches the screen edges by design, and a radius here
    # would cut a visible arc out of the top corners.
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = top
}

# ------------------------------------------------------------
#  Clock stack — macOS layout: day and date above, time below
#
#  Positions are PERCENTAGES, not pixels. They were 420 and 330 px,
#  written against the 2560x1440 display in the video. `valign = center`
#  measures the offset upward from the vertical centre, so on this
#  1366x768 panel 420px put the date at 804 — 36px above the top of the
#  screen, i.e. invisible — and clipped the top off the clock. Verified
#  by screenshotting a live lock, which is the only way to catch it:
#  nothing logs an off-screen label.
#
#  As percentages the same layout holds on both this panel and the
#  external monitor.
# ------------------------------------------------------------
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $fg
    font_size = 20
    font_family = Inter Medium
    position = 0, 26%
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $fg
    font_size = 92
    font_family = Inter Display Semibold
    position = 0, 17%
    halign = center
    valign = center
}

# ------------------------------------------------------------
#  Avatar and username — DESIGN-SPEC.md's macOS layout: date/day top, clock,
#  user + avatar, "press any key", password box.
#
#  This is the one surface a stranger sees, and until now it said nothing
#  about WHOSE machine it is. That is the whole argument for the pair: a lock
#  screen with a clock and a password box is a kiosk; a lock screen with a
#  face and a name is somebody's computer.
#
#  The image is generated rather than committed — scripts/lock-assets.sh
#  prefers ~/.face if a real photograph is there, and falls back to the
#  username's initial on a flat disc. See that file for why the fallback is
#  deliberately NOT themed.
# ------------------------------------------------------------
image {
    monitor =
    path = ~/.cache/tide-island/lock-avatar.png
    size = 110
    # Fully round: half of `size`, so the disc stays a disc if the size is
    # ever changed. The generated PNG is already circular; this rounds a real
    # photograph too, which is the case that needs it.
    rounding = 55
    border_size = 2
    border_color = $accent

    # ---- THE STACK, MEASURED OFF A REAL CAPTURE ----
    #
    # First attempt put this at 4%, which overlapped the clock: the clock sits
    # at 17% with a 92 px face, so its glyphs reach roughly 7% below centre and
    # a 110 px disc centred at 4% ABOVE centre lands inside them. Captured in
    # the nested compositor, which is the only way to see it — nothing logs two
    # widgets occupying the same rows.
    #
    # -2% puts the disc just under the clock's descenders, the name goes below
    # it, and the password box drops to -20% to stay clear of the name. The
    # whole stack is percentages so it holds on the external monitor too.
    position = 0, -2%
    halign = center
    valign = center
}

label {
    monitor =
    # `$USER` is not expanded by hyprlock, and `whoami` in a cmd[] is one
    # process spawn on a surface that is already racing to draw. `id -un` is
    # the same answer from the same libc call the shell would make.
    #
    # update:0 — this cannot change while the screen is locked, so polling it
    # would be a subprocess per interval for a string that is a constant.
    text = cmd[update:0] id -un
    color = $fg
    font_size = 15
    font_family = Inter Medium
    # -14%, not -11%. At -11% the name's cap-height touched the avatar's
    # bottom border — captured in the nested compositor, which is the only
    # place two widgets sharing a row is visible; nothing logs it.
    position = 0, -14%
    halign = center
    valign = center
}

# ------------------------------------------------------------
#  Input
#
#  The video hides the password box until you type, on the reasoning
#  that most lock-screen glances are just checking the clock.
#  hyprlock cannot hide the field outright, but fade_on_empty is the
#  closest native equivalent: it sits nearly invisible until there is
#  something in it.
# ------------------------------------------------------------
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.32
    dots_center = true

    outer_color = $accent
    inner_color = $bg_alt
    font_color = $fg
    check_color = $accent
    fail_color = $red

    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text = <i>Press any key</i>
    fail_text = <i>Wrong password</i>
    hide_input = false
    rounding = 12

    # -24%, not the old -80 px. Absolute pixels here were the same bug the
    # clock stack's own note records: -80 is a different place on a 768 px
    # panel than on a 1440 px one. -24% clears the name at -14% with the
    # field's own 50 px height taken into account.
    position = 0, -24%
    halign = center
    valign = center
}

# ------------------------------------------------------------
#  NOW PLAYING
#
#  Asked for as "i wish if it had a player in it".
#
#  IT IS A READOUT, NOT A TRANSPORT, and that is a limit of hyprlock rather
#  than a decision. 0.9.6 has four widget types — background, image, shape,
#  label — plus one input-field, and none of them takes a click or a key.
#  The only key this surface reads is the password. Drawing play/pause
#  buttons here would be drawing controls that cannot be wired to anything.
#
#  Nothing is lost by that: the hardware media keys are COMPOSITOR binds,
#  not client ones, so they keep working while the screen is locked. The
#  transport was already there and this is the display it never had.
#
#  IT DISAPPEARS WHEN NOTHING IS PLAYING. hyprlock draws a label's text and
#  nothing else, so scripts/lock-player.sh printing an empty string is an
#  invisible widget — which is why every path in it exits 0 with no output
#  rather than printing "Nothing playing". The art falls back to a 1x1
#  transparent PNG for the same reason, and that file has to EXIST: an
#  `image` whose path does not resolve takes hyprlock down with it, which
#  is the same class of failure as the framebuffer bug lock-assets.sh
#  documents.
#
#  Bottom-centred, below the input field, so it is the last thing in the
#  vertical stack and cannot push anything else off a short panel. All
#  positions are PERCENTAGES for the reason the clock stack's note gives:
#  the pixel values in the video were written against 2560x1440.
# ------------------------------------------------------------
image {
    monitor =
    path = ~/.cache/tide-island/lock-art.png
    size = 64
    # 12, not -1. `-1` is hyprlock's "make it a circle", and a circle here
    # sat directly under the circular avatar and read as the same element
    # twice rather than as album art. The script writes a SQUARE for this
    # reason — see its note — so the corner radius is decided exactly once.
    rounding = 12
    border_size = 0
    # 4 s, not 1 s. The art only changes when the TRACK changes, and each
    # reload is a playerctl call plus, for a remote artUrl, a curl — on a
    # surface that will sit there all night. The title label below polls
    # faster because it is one cheap call and it is the thing you look at.
    reload_time = 4
    reload_cmd = ~/.config/hypr/scripts/lock-player.sh art
    position = 0, 118
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-player.sh text
    color = $fg
    font_size = 13
    font_family = Inter Medium
    position = 0, 88
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-player.sh status
    color = $accent
    font_size = 12
    # The icon font, not Inter: these are Nerd Font private-use glyphs and
    # a text family renders them as nothing at all, with no warning. Same
    # trap the island's search field hit.
    font_family = JetBrainsMono Nerd Font
    position = 0, 66
    halign = center
    valign = bottom
}
