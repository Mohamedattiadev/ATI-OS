# ============================================================
#  hyprlock — lock screen
#
#  Follows the design described in the notch video (DESIGN-SPEC.md):
#  not a wallpaper, but your actual desktop at the instant of locking,
#  frozen, blurred and dimmed, with a macOS-style clock stack over it.
#
#  hyprlock's `path = screenshot` does the capture natively, so the
#  JPEG-vs-PNG timing problem that video hit does not apply here — that
#  was his own Quickshell implementation encoding the frame himself.
#
#  ############  SECURITY — READ BEFORE TRUSTING THIS  ############
#
#  The author of that video wired his lock screen to a standard-looking
#  PAM configuration and it accepted ANY password — any string at all —
#  and he only found out because he tested it deliberately.
#
#  hyprlock uses /etc/pam.d/hyprlock, which the package ships. AFTER
#  INSTALLING, TEST IT:
#
#      1. Lock the session      (hyprlock)
#      2. Type a WRONG password and press Enter
#      3. Confirm it is REJECTED
#      4. Only then trust it
#
#  If step 3 fails, do not use this until it is fixed. A lock screen
#  that looks right and admits anyone is worse than none, because you
#  will believe you are protected.
#  ################################################################
# ============================================================

source = ./colors.conf

general {
    hide_cursor = true

    # `grace`, `no_fade_in` and `disable_loading_bar` used to live here.
    # hyprlock 0.9.6 rejects all three ("config option does not exist")
    # and carries on with the rest, so they were dead lines rather than
    # errors — the only way to see it is hyprlock's own stderr, not
    # `hyprctl configerrors`, which knows nothing about this file.
    #
    # grace is now a COMMAND-LINE flag, not a config option. It defaults
    # to 0 (no grace period), which is the value we wanted anyway, and
    # hypridle passes it explicitly — see hypridle.conf's lock_cmd.
    # The other two were removed outright with no replacement.
    #
    # Valid general keys in 0.9.6, for when this needs editing again:
    #   fail_timeout  fractional_scaling  hide_cursor  ignore_empty_input
    #   immediate_render  screencopy_mode  text_trim
}

background {
    monitor =
    # The live desktop, frozen at the moment of locking.
    path = screenshot

    blur_passes = 3
    blur_size = 8
    noise = 0.011
    contrast = 0.9
    # ~20% dim, matching the spec — enough that the clock reads cleanly
    # over arbitrary content without hiding what was underneath.
    brightness = 0.8
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# ------------------------------------------------------------
#  Clock stack — macOS layout: day and date above, time below
#
#  Positions are PERCENTAGES, not pixels. They were 420 and 330 px,
#  written against the 2560x1440 display in the video. `valign = center`
#  measures the offset upward from the vertical centre, so on this
#  1366x768 panel 420px put the date at 804 — 36px above the top of the
#  screen, i.e. invisible — and clipped the top off the clock. Verified
#  by screenshotting a live lock, which is the only way to catch it:
#  nothing logs an off-screen label.
#
#  As percentages the same layout holds on both this panel and the
#  external monitor.
# ------------------------------------------------------------
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $fg
    font_size = 20
    font_family = Inter Medium
    position = 0, 26%
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $fg
    font_size = 92
    font_family = Inter Display Semibold
    position = 0, 17%
    halign = center
    valign = center
}

# ------------------------------------------------------------
#  Input
#
#  The video hides the password box until you type, on the reasoning
#  that most lock-screen glances are just checking the clock.
#  hyprlock cannot hide the field outright, but fade_on_empty is the
#  closest native equivalent: it sits nearly invisible until there is
#  something in it.
# ------------------------------------------------------------
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.32
    dots_center = true

    outer_color = $accent
    inner_color = $bg_alt
    font_color = $fg
    check_color = $accent
    fail_color = $red

    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text = <i>Press any key</i>
    fail_text = <i>Wrong password</i>
    hide_input = false
    rounding = 12

    position = 0, -80
    halign = center
    valign = center
}
