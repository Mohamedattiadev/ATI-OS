# ============================================================
#  hyprlock — lock screen
#
#  ---- REBUILT: THEMED, MINIMAL, AND WITH A WORKING TRANSPORT ----
#
#  Asked for as "upgrade it and make it follow the theme, make it minimal
#  and has the player < = >".
#
#  IT FOLLOWED THE THEME ALREADY, in the only sense a config can: every
#  colour below is a variable out of colors.conf, which theme-apply
#  rewrites. What did NOT follow the theme was the BACKGROUND — it was
#  `path = screenshot`, the live desktop frozen at the instant of locking,
#  which is the notch video's design and is a picture of whatever happened
#  to be on screen. A terminal, a browser, a half-read PDF. That is the
#  opposite of following a theme, and no amount of dimming makes it one.
#
#  It is the THEME'S OWN WALLPAPER now, blurred. `theme-wallpaper` keeps
#  ~/.cache/wall pointing at the image the active theme drew, so the lock
#  screen changes with the theme by construction and there is nothing to
#  keep in step.
#
#  MINIMAL is the rest of the ask, and it is a subtraction: the gradient
#  overlay, the avatar circle and the username label are gone. The gradient
#  existed to make the clock legible over an arbitrary screenshot, and a
#  blurred wallpaper at brightness 0.45 does that job better and with one
#  fewer generated asset. The avatar and name answered a question — "whose
#  machine is this" — that a single-user laptop does not ask.
#
#  What is left is the time, the date, the password, and what is playing.
#
#  ############  SECURITY — READ BEFORE TRUSTING THIS  ############
#
#  The author of that video wired his lock screen to a standard-looking
#  PAM configuration and it accepted ANY password — any string at all —
#  and he only found out because he tested it deliberately.
#
#  hyprlock uses /etc/pam.d/hyprlock, which the package ships. AFTER
#  INSTALLING, TEST IT:
#
#      1. Lock the session      (hyprlock)
#      2. Type a WRONG password and press Enter
#      3. Confirm it is REJECTED
#      4. Only then trust it
#
#  If step 3 fails, do not use this until it is fixed. A lock screen
#  that looks right and admits anyone is worse than none, because you
#  will believe you are protected.
#  ################################################################
# ============================================================

source = ./colors.conf

general {
    hide_cursor = true

    # `grace`, `no_fade_in` and `disable_loading_bar` used to live here.
    # hyprlock 0.9.6 rejects all three ("config option does not exist")
    # and carries on with the rest, so they were dead lines rather than
    # errors — the only way to see it is hyprlock's own stderr, not
    # `hyprctl configerrors`, which knows nothing about this file.
    #
    # grace is now a COMMAND-LINE flag, not a config option. It defaults
    # to 0 (no grace period), which is the value we wanted anyway, and
    # hypridle passes it explicitly — see hypridle.conf's lock_cmd.
    # The other two were removed outright with no replacement.
    #
    # Valid general keys in 0.9.6, for when this needs editing again:
    #   fail_timeout  fractional_scaling  hide_cursor  ignore_empty_input
    #   immediate_render  screencopy_mode  text_trim
}

# ------------------------------------------------------------
#  Background — the THEME's wallpaper, not the desktop
#
#  ~/.cache/wall is a symlink theme-wallpaper repoints on every theme
#  change, so this needs no per-theme handling of its own.
#
#  blur_passes 3 rather than a heavier stack: each pass is a full-screen
#  render at lock time, and this surface has to appear instantly — a lock
#  screen that fades in over half a second has already shown half a second
#  of your desktop to whoever is standing there.
#
#  brightness 0.45 is what the deleted gradient overlay used to buy. It is
#  applied to the whole surface rather than to a strip, so the clock is
#  legible wherever it sits and a bright wallpaper cannot defeat it.
# ------------------------------------------------------------
background {
    monitor =
    path = ~/.cache/wall
    blur_passes = 3
    blur_size = 6
    brightness = 0.45
    contrast = 0.9
    vibrancy = 0.15
}

# ------------------------------------------------------------
#  Clock stack
#
#  Positions are PERCENTAGES, not pixels, and this is the one piece of the
#  old file that must not be simplified away. They were 420 and 330 px,
#  written against the video's 2560x1440 display; `valign = center`
#  measures upward from the vertical centre, so on this 1366x768 panel 420
#  put the date at 804 — above the top edge, invisible — and clipped the
#  clock. Nothing logs an off-screen label.
# ------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $fg
    font_size = 96
    font_family = Inter Display SemiBold
    position = 0, 12%
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $fg
    font_size = 15
    font_family = Inter Medium
    position = 0, 2%
    halign = center
    valign = center
}

# ------------------------------------------------------------
#  Input
#
#  The video hides the password box until you type, on the reasoning that
#  most lock-screen glances are just checking the clock. hyprlock cannot
#  hide the field outright; fade_on_empty is the closest native
#  equivalent, and it sits nearly invisible until there is something in it.
# ------------------------------------------------------------
input-field {
    monitor =
    size = 300, 46
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.32
    dots_center = true

    outer_color = $accent
    inner_color = $bg_alt
    font_color = $fg
    check_color = $accent
    fail_color = $red

    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text = <i>Press any key</i>
    fail_text = <i>Wrong password</i>
    hide_input = false
    rounding = 12

    position = 0, -10%
    halign = center
    valign = center
}

# ------------------------------------------------------------
#  NOW PLAYING — a real transport, on `onclick`
#
#  The first version of this card was a readout, and its own comment said a
#  transport was impossible here: "hyprlock has four widget types and an
#  input-field; there is no button, no click target". The widget list was
#  right and the conclusion was drawn from the list instead of from the
#  program. `label` takes an `onclick`:
#
#      strings /usr/bin/hyprlock | grep -x onclick
#
#  and this parser rejects unknown keys loudly — that is how `general:grace`
#  and `no_fade_in` were caught — so a config carrying `onclick` and drawing
#  no complaint is one whose `onclick` is real.
#
#  EVERY PART DISAPPEARS WHEN NOTHING IS PLAYING, including the buttons.
#  hyprlock draws a label's text and nothing else, so scripts/lock-player.sh
#  printing an empty string is an invisible widget — which is why the glyphs
#  come from the script rather than being literals here. Three dead buttons
#  under an empty card would be worse than no card.
#
#  The art falls back to a 1x1 transparent PNG rather than to a missing
#  file: an `image` whose path does not resolve takes hyprlock down.
#
#  Bottom-centred, so it is last in the vertical stack and cannot push
#  anything off a short panel.
# ------------------------------------------------------------
image {
    monitor =
    path = ~/.cache/tide-island/lock-art.png
    size = 56
    rounding = 10
    border_size = 0
    # 4 s: the art only changes when the TRACK does, and each reload is a
    # playerctl call plus, for a remote artUrl, a curl. The labels poll
    # faster because they are cheap and they are what you read.
    reload_time = 4
    reload_cmd = ~/.config/hypr/scripts/lock-player.sh art
    position = 0, 150
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-player.sh text
    color = $fg
    font_size = 13
    font_family = Inter Medium
    position = 0, 118
    halign = center
    valign = bottom
}

# The three buttons. Nerd Font glyphs, all BMP private-use — the
# SUPPLEMENTARY ones this font also carries do not render in this stack,
# measured elsewhere in this repo. `onclick` runs playerctl directly; there
# is no wrapper, because there is nothing to decide.
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-player.sh prev
    color = $fg
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -58, 74
    halign = center
    valign = bottom
    onclick = playerctl previous
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/lock-player.sh toggle
    color = $accent
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    # Polled faster than its neighbours: this is the one label whose glyph
    # changes as a RESULT of pressing it, and a play button that stays a
    # play button for two seconds after you click reads as a dead control.
    position = 0, 72
    halign = center
    valign = bottom
    onclick = playerctl play-pause
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-player.sh next
    color = $fg
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 58, 74
    halign = center
    valign = bottom
    onclick = playerctl next
}
