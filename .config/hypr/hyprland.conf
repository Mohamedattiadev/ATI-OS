# ============================================================
#  Hyprland — ported from the qtile config in ../qtile/config.py
#
#  This is the "usable daily driver" pass: window management,
#  workspaces, and every keybinding that did not depend on
#  qtile's Python API or on X11.  What is deliberately NOT here
#  is tracked in MIGRATION.md — read that before wondering why
#  a key does nothing.
#
#  Layout note: qtile's MonadTall is a single-master column
#  layout.  Hyprland's `master` layout is the honest equivalent
#  and is what we default to, so mod+h/l shrink/grow and the
#  focus keys keep the muscle memory they had.  `dwindle` is
#  loaded too and mod+Tab swaps between them.
# ============================================================

# ============================================================
#  Session environment — the half of the theme that was NOT ported
# ============================================================
#  Reported as "this app does not follow the theme", and the theme was
#  never the problem. `theme-apply` HAS been generating a full 21-role Qt
#  palette into ~/.config/qt6ct/ and ~/.config/qt5ct/ this whole time —
#  the files are there and current. Nothing was reading them.
#
#  Qt only loads qt6ct when QT_QPA_PLATFORMTHEME says so, and that export
#  lived in ~/.xinitrc, which is the X11/qtile entry point. Hyprland does
#  not source it, and this file had NO `env` lines at all, so every Qt app
#  in this session fell back to Qt's built-in LIGHT palette. Measured:
#
#      tr '\0' '\n' < /proc/$(pgrep -x pcmanfm-qt)/environ | grep QT_QPA
#      -> nothing
#
#  That is the whole bug. The generated colours were correct and unread.
#
#  `env` is exported to everything the compositor spawns, so it is the
#  equivalent of .xinitrc's exports. It applies at PROCESS START: already
#  running apps keep the old (missing) value until they are restarted —
#  restart the app, not the compositor.
env = QT_QPA_PLATFORMTHEME,qt6ct

#  Cursor, same story and the same file. Xcursor honours both, and
#  Hyprland additionally needs the theme set on its own cursor via
#  hyprcursor/XCURSOR for client-side cursors to match the compositor's.
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,breeze_cursors

source = ./monitors.conf
source = ./input.conf
source = ./looks.conf
source = ./rules.conf
source = ./binds.conf
source = ./submaps.conf
source = ./autostart.conf

# Liquid glass. `hyprpm add` + `hyprpm enable` are done; autostart.conf
# runs `hyprpm reload` so the plugin is loaded on every session start.
#
# Native blur in looks.conf deliberately stays ON. An earlier note here
# said the two "cannot both act on the same windows" and that blur had to
# be disabled globally — that is not how the plugin works. It sets
# `noblur` on each glassed window itself (manage_window_blur, on by
# default), so native blur keeps serving every surface hyprglass does not
# touch. What must stay off is blur:new_optimizations, whose cached blur
# hides the glass on static windows — looks.conf has it false, with the
# reason at the config site.
source = ./hyprglass.conf
