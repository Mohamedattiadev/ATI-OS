# ============================================================
#  Hyprland — ported from the qtile config in ../qtile/config.py
#
#  This is the "usable daily driver" pass: window management,
#  workspaces, and every keybinding that did not depend on
#  qtile's Python API or on X11.  What is deliberately NOT here
#  is tracked in MIGRATION.md — read that before wondering why
#  a key does nothing.
#
#  Layout note: qtile's MonadTall is a single-master column
#  layout.  Hyprland's `master` layout is the honest equivalent
#  and is what we default to, so mod+h/l shrink/grow and the
#  focus keys keep the muscle memory they had.  `dwindle` is
#  loaded too and mod+Tab swaps between them.
# ============================================================

source = ./monitors.conf
source = ./input.conf
source = ./looks.conf
source = ./rules.conf
source = ./binds.conf
source = ./submaps.conf
source = ./autostart.conf

# Liquid glass. `hyprpm add` + `hyprpm enable` are done; autostart.conf
# runs `hyprpm reload` so the plugin is loaded on every session start.
#
# Native blur in looks.conf deliberately stays ON. An earlier note here
# said the two "cannot both act on the same windows" and that blur had to
# be disabled globally — that is not how the plugin works. It sets
# `noblur` on each glassed window itself (manage_window_blur, on by
# default), so native blur keeps serving every surface hyprglass does not
# touch. What must stay off is blur:new_optimizations, whose cached blur
# hides the glass on static windows — looks.conf has it false, with the
# reason at the config site.
source = ./hyprglass.conf
