# ============================================================
#  hypridle — idle behaviour
#
#  Deliberately conservative: this machine runs long-lived work
#  (qupdate daemon, adhkar, battery-events) and the qtile session had
#  no aggressive idle policy, so nothing here suspends the system.
#  Screen off and lock only.
# ============================================================

general {
    # --grace 0 is explicit on purpose: `grace` stopped being a config
    # option in hyprlock 0.9.6 and is now a flag. 0 means the lock takes
    # effect immediately, with no window in which mouse movement unlocks.
    # ---- THE ASSETS ARE GENERATED BEFORE EVERY LOCK, NOT AT STARTUP ----
    #
    # hyprlock.conf draws two images that scripts/lock-assets.sh produces: the
    # avatar and the top gradient. A missing image is not an error hyprlock
    # reports usefully — it draws nothing and carries on — so "the lock screen
    # lost its avatar" would present as a cosmetic mystery rather than as a
    # missing file.
    #
    # Here rather than in autostart.conf, and that is deliberate: this runs on
    # every lock, so a cache cleared mid-session, a fresh machine that has
    # never locked, or a ~/.face added since login all repair themselves
    # without a re-login. The script is idempotent, costs two ImageMagick
    # invocations, and does NOT overwrite a real ~/.face.
    #
    # Chained with `;` and not `&&`: if the generator fails — no ImageMagick,
    # a full disk — the screen must still LOCK. A lock that is skipped because
    # a decoration could not be drawn is a security failure caused by a
    # cosmetic one.
    lock_cmd = ~/.config/hypr/scripts/lock-assets.sh >/dev/null 2>&1 ; pidof hyprlock || hyprlock --grace 0
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Dim the backlight as a warning shot, and restore it on activity.
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Lock.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Screen off.  Well after the lock, so the display going dark is never
# the thing that surprises you into losing unsaved work.
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# No suspend listener on purpose — see the header.
