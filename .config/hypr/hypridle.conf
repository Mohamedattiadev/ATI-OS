# ============================================================
#  hypridle — idle behaviour
#
#  Deliberately conservative: this machine runs long-lived work
#  (qupdate daemon, ati-adhkar, battery-events) and the qtile session had
#  no aggressive idle policy, so nothing here suspends the system.
#  Screen off and lock only.
# ============================================================

general {
    # --grace 0 is explicit on purpose: `grace` stopped being a config
    # option in hyprlock 0.9.6 and is now a flag. 0 means the lock takes
    # effect immediately, with no window in which mouse movement unlocks.
    # ---- THE ART IS PRIMED BEFORE EVERY LOCK, NOT AT STARTUP ----
    #
    # This used to run scripts/lock-assets.sh, which generated the avatar and
    # the top gradient. Both widgets are gone — the lock screen is the theme's
    # blurred wallpaper now, which does the gradient's job, and the avatar was
    # answering a question a single-user laptop does not ask. That script went
    # with them.
    #
    # What replaces it does the same job for the one image the lock screen
    # still draws: the album art. `lock-player.sh art` writes it, or writes a
    # 1x1 transparent PNG when nothing is playing — and that file has to
    # EXIST, because an `image` whose path does not resolve takes hyprlock
    # down rather than drawing nothing.
    #
    # Here rather than in autostart.conf, and that is deliberate: this runs on
    # every lock, so a cache cleared mid-session or a machine that has never
    # locked repairs itself without a re-login. hyprlock also re-runs it on
    # its own 4 s timer once up; this is only about the FIRST frame.
    #
    # Chained with `;` and not `&&`: if it fails — no ImageMagick, a full
    # disk — the screen must still LOCK. A lock skipped because a decoration
    # could not be drawn is a security failure caused by a cosmetic one.
    lock_cmd = ~/.config/hypr/scripts/lock-player.sh art >/dev/null 2>&1 ; pidof hyprlock || hyprlock --grace 0
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# ============================================================
#  NOTHING HERE FIRES ON A TIMER ANY MORE
# ============================================================
#
# Asked for directly: "i want the screen not turn off to lock screen at all
# till i want."
#
# So the idle POLICY is gone and the idle DAEMON stays, which is the
# distinction that makes this safe rather than reckless. What is left in
# `general` above is the part that has nothing to do with sitting still:
#
#   lock_cmd         how the session locks WHEN SOMETHING ASKS IT TO —
#                    $mod SHIFT X (binds.conf), `loginctl lock-session` from
#                    anywhere, or the line below
#   before_sleep_cmd lock on suspend. KEPT, and it is not what was reported:
#                    closing the lid or suspending is a deliberate act, and a
#                    laptop that suspends unlocked is a different problem from
#                    a laptop that locks while you are reading it
#   after_sleep_cmd  turn the display back on when it comes back
#
# Removing hypridle entirely would take those three with it, and would also
# leave nothing holding the systemd idle inhibitor — so the three listeners
# are what goes, not the daemon.
#
# WHAT WAS HERE, so putting any of it back is one paste rather than a
# rediscovery:
#
#     # Dim the backlight as a warning shot, and restore it on activity.
#     listener {
#         timeout = 300
#         on-timeout = brightnessctl -s set 10
#         on-resume = brightnessctl -r
#     }
#
#     # Lock.
#     listener {
#         timeout = 600
#         on-timeout = loginctl lock-session
#     }
#
#     # Screen off. Well after the lock, so the display going dark is never
#     # the thing that surprises you into losing unsaved work.
#     listener {
#         timeout = 900
#         on-timeout = hyprctl dispatch dpms off
#         on-resume = hyprctl dispatch dpms on
#     }
#
# The DIM goes with the other two on purpose. It is not a lock and it
# restores on any key, but `brightnessctl set 10` on this panel is very
# nearly off, and a screen that goes dark by itself after five minutes is
# what "the screen turns off" means to the person watching it. Keeping the
# one listener that produces the reported symptom, on the grounds that it is
# technically a different mechanism, would be answering a different question.
#
# The consequence, stated rather than left implied: an unattended machine now
# stays unlocked and lit until it suspends. That is the trade that was asked
# for. $mod SHIFT X locks it, and the panel is still driven by the battery's
# own DPMS on suspend.
#
# No suspend listener either, and that part predates this — see the header.
