# ============================================================
#  Submaps  (qtile KeyChord -> Hyprland submap)
#
#  Faithful detail from the qtile chords, preserved here:
#
#  1. Every chord kept workspace switching live while inside it —
#     each mode rebound 1-9 to go_to_group_or_notify.  Reproduced.
#  2. Every chord exited on BOTH Escape and `q` (ungrab_chord).
#     Reproduced.
#  3. qtile chords were one-shot unless mode=True.  Hyprland submaps
#     are always sticky, so the explicit exits above matter more here
#     than they did there.
#  4. qtile chords ran with swallow=True, which ate EVERY key while the
#     chord was open. Hyprland submaps do not: a key with no bind in the
#     active submap is passed straight through to the focused window.
#
#     That difference has a symptom, and it is the reported one — "SUPER+P
#     types a literal p into the window". Inside the `rofi` submap there is
#     no SUPER-modified bind at all, so SUPER+P matches nothing, leaks to
#     the client, and types a `p`. From the outside it is indistinguishable
#     from the bind being broken, and pressing it again does the same thing
#     forever, because you never leave.
#
#     Every submap's own ENTRY combination now exits it, so the entry key
#     is a toggle and can never be the key that leaks. That is also what
#     qtile did for the modes it put on a single keystroke: Audio-Mode and
#     Display-Mode each rebound alt+3 / alt+4 to close-and-ungrab, "so
#     alt+3 toggles".
# ============================================================

# ------------------------------------------------------------
#  resize   ($mod R)   — qtile Resize-Mode
#
#  qtile bound shrink()/grow()/reset() from MonadTall.  Under the
#  master layout those are mfact adjustments; splitratio is the
#  dwindle equivalent, so both are bound and whichever layout is
#  live responds.
# ------------------------------------------------------------
submap = resize
# The entry combination, so $mod R toggles rather than only entering.
# Also the reason it can never leak a bare `r` into the focused window.
bind = $mod, R, submap, reset
bind = SHIFT, H, layoutmsg, splitratio -0.05
bind = SHIFT, L, layoutmsg, splitratio +0.05
bind = SHIFT, H, layoutmsg, mfact -0.05
bind = SHIFT, L, layoutmsg, mfact +0.05
bind = SHIFT, N, layoutmsg, mfact exact 0.55

# Plain hjkl resize too — qtile had only shift+h/l, but the bare keys
# were unbound inside this mode, so this adds reach without conflict.
binde = , H, resizeactive, -20 0
binde = , J, resizeactive, 0 20
binde = , K, resizeactive, 0 -20
binde = , L, resizeactive, 20 0

bind = , 1, workspace, 1
bind = , 2, workspace, 2
bind = , 3, workspace, 3
bind = , 4, workspace, 4
bind = , 5, workspace, 5
bind = , 6, workspace, 6
bind = , 7, workspace, 7
bind = , 8, workspace, 8
bind = , 9, workspace, 9

bind = , escape, submap, reset
bind = , Q, submap, reset
submap = reset

# ------------------------------------------------------------
#  rofi   ($mod P)   — qtile Rofi-Mode
#
#  The single best-porting chord in the config: almost every key was
#  a plain spawn() of a dmscripts/rofi launcher, so it transfers
#  verbatim.  Each exits the submap after firing, matching qtile's
#  one-shot chord behaviour.
#
#  b, n and w opened nested popup chords in qtile. They are all live here,
#  each landing straight in the thing the chord existed to reach:
#  n = Wi-Fi list, b = Bluetooth list, w = wallpaper picker, c = theme
#  picker. One keystroke instead of two, because the island's panels take
#  the keyboard themselves and do their own navigation.
# ------------------------------------------------------------
submap = rofi
# The entry combination. This is the specific fix for "SUPER+P types a
# literal p": without it, SUPER+P inside this submap matches nothing and
# Hyprland hands the keypress to the focused window. Note this submap has
# no plain `q` exit either — q is dm-logout here, faithful to qtile — so
# Escape was the only way out and getting stuck was easy.
bind = $mod, P, submap, reset
# n and b: qtile's WifiPopup and BluetoothPopup, on the keys they had in
# the Rofi chord. They open the island's own lists rather than a port.
# Each is a standalone island popup in its own right — the same shape the
# wallpaper and theme pickers open in — and NOT, as it was until now, the
# control centre with a wing unfolded off its side. See
# quickshell/tide-island-fork/qml/connectivity/ConnectivityPanelLayer.qml.
# (The cross-reference here used to say "see the note in binds.conf".
# There is no such note and there never was: the explanation lives in the
# QML, which is where the ported panel is.)
bind = , N, exec, bar-action tide toggleWifiPanel
bind = , N, submap, reset
bind = , B, exec, bar-action tide toggleBluetoothPanel
bind = , B, submap, reset
# A was `rofi_anki` — the last wizard in this chord that opened a rofi
# window. It is the island's picker now, and the port did NOT copy the
# script: rofi_anki gained an `--answers FILE` mode, the picker asks its
# eight questions and hands them over, and every line of card logic stays
# where it was. The qtile session's default path is still the rofi prompts.
# See the `anki` note in hypr/scripts/island-picker.py.
bind = , A, exec, bar-action tide showPicker anki
bind = , A, submap, reset
# C is the ISLAND's theme picker, not rofi's, on the user's explicit call:
# $mod P then c opens the popup. rofi's theme-toggle keeps working and
# moves to SHIFT+C — it is still the one the qtile session uses, and it
# still works when the island is not running, so it is worth a key.
# Both drive AtiScriptsV1/theme-apply and both read
# ~/.cache/qtile/theme_mode, so the two can never disagree.
bind = , C, exec, bar-action tide toggleThemePicker
bind = , C, submap, reset
bind = SHIFT, C, exec, theme-toggle
bind = SHIFT, C, submap, reset
# W is the wallpaper picker — qtile's WallpaperPopup key, back on the key
# it had inside the Rofi chord. It was on $mod SHIFT B because W was
# being reserved for a deferred popup chord; the chord is not coming, so
# the reservation was costing the key it was meant to protect.
bind = , W, exec, bar-action tide toggleWallpaperPicker
bind = , W, submap, reset
# The island's theme picker (ThemePickerLayer.qml) is fork work — upstream
# Tide Island ships a wallpaper picker and no theme picker. Its keys:
# arrows move, Enter or click applies, Escape closes.
#
# Do NOT test either picker by synthesising its keystroke: wtype creates
# and destroys a virtual keyboard, which resets the submap before the bind
# can fire. Test the dispatcher instead:
#   bar-action tide toggleThemePicker
#   bar-action tide toggleWallpaperPicker
# ---- EVERY KEY BELOW BUT ONE IS NOW THE ISLAND'S PICKER ----
#
# D, L, M and O went first (list-shaped menus). E, F, H, I, P, R, S, T, Y
# and Z followed once the picker grew a page stack and a prompt mode, which
# is what the multi-step ones needed: a screenshot asks "where does it go",
# a spell-check asks for a sentence and then which mistake to fix, and
# dm-confedit is a directory walk. The panel holds a stack of opaque pages
# and the script decides what each id means — see PickerLayer.qml.
#
# The rofi originals are untouched on disk and the qtile session still uses
# every one of them. What each port dropped, and why, is written against
# the menu in hypr/scripts/island-picker.py; three of them drop something
# real (ati-record's screen capture, ati-pass's write half, rofi_todo's
# sessions) and all three say so there.
#
# V (rofi_ilovepdf) WAS the only key in this chord still opening rofi. It
# is not any more, and the reason it was is worth keeping because it was
# wrong in an instructive way.
#
# This file said: "rofi_ilovepdf is a FILE MANAGER ... The picker protocol
# carries exactly one id back per page, so multi-select cannot be expressed
# in it at all — porting V means either building selection state into
# PickerLayer.qml or shipping a PDF toolkit that has lost merge."
#
# One id per page is not a limit when the page COMES BACK. `tog:<path>`
# toggles a file in a set and returns the SAME page re-rendered with ticks
# and a running order — 1., 2., 3. — which is also better than the original,
# because rofi's multi-select returns lines in list order and `order_files`
# existed only to recover the order you actually wanted. The set lives under
# $XDG_RUNTIME_DIR, held by island-picker.py, exactly as the spell-checker
# already held its working text. PickerLayer.qml is not touched.
#
# This is the same shape of mistake island-picker.py's own header records
# making about the PROMPTING menus, and it went the same way: the primitive
# was already there and the conclusion had been drawn before it existed.
#
# The 1,267-line toolkit is NOT reimplemented. rofi_ilovepdf grew
# `--list-tools` and `--exec`, and the menu drives those — so the conversion
# logic, the encryption checks and the page-range validation stay in the one
# file that has always owned them, and the qtile session keeps the
# interactive script unchanged.
bind = , D, exec, bar-action tide showPicker documents
bind = , D, submap, reset
bind = , E, exec, bar-action tide showPicker translate
bind = , E, submap, reset
bind = , F, exec, bar-action tide showPicker confedit
bind = , F, submap, reset
bind = , H, exec, bar-action tide showPicker hub
bind = , H, submap, reset
bind = , I, exec, bar-action tide showPicker screenshot
bind = , I, submap, reset
# J — jump to a workspace by NAME, the picker's third menu. The plain
# digits at the bottom of this submap already switch to a workspace by
# number and are faster for 1-8; this is for the ones with names and for
# seeing what is on each before you go, which a digit cannot tell you.
bind = , J, exec, bar-action tide showPicker workspaces
bind = , J, submap, reset
# K, SHIFT+K and J are the island's generic list picker
# (qml/island/PickerLayer.qml, fed by hypr/scripts/island-picker.py).
#
# K replaces rofi-kill rather than sitting beside it, because it IS
# rofi-kill: same list (processes by RSS, not by CPU — a runaway process is
# the one holding the memory, and CPU ordering churns between drawing the
# list and reading it), same one-shot shape, same key. SIGTERM and never
# SIGKILL, which rofi-kill also does: this list is reached by a keypress
# from a fuzzy-matched row, and SIGKILL there is how an editor's unsaved
# buffer dies to a typo.
#
# SHIFT+K is the same verb one level up — kill a WINDOW instead of a
# process — following the SHIFT convention already set by SHIFT+C (island
# theme picker beside rofi's) and SHIFT+S (Wi-Fi QR).
#
# The panel is never handed a command. island-picker.py returns rows of
# {id, label, detail} and takes an `id` back; a picker that executes
# strings supplied by a script executes whatever can write to that script.
#
# Until this commit all three were unreachable: PickerLayer.qml existed and
# the IPC was registered, but nothing bound a key to it, so the whole
# feature was dead code that looked finished.
bind = , K, exec, bar-action tide showPicker processes
bind = , K, submap, reset
bind = SHIFT, K, exec, bar-action tide showPicker windows
bind = SHIFT, K, submap, reset
bind = , L, exec, bar-action tide showPicker brightness
bind = , L, submap, reset
bind = , M, exec, bar-action tide showPicker man
bind = , M, submap, reset
bind = , O, exec, bar-action tide showPicker notes
bind = , O, submap, reset
bind = , P, exec, bar-action tide showPicker pass
bind = , P, submap, reset
# The island's power menu, not rofi's dm-logout — same move as
# $mod SHIFT Q in binds.conf, and the same actions. Full path rather than
# $qsi for the reason written up there: a Hyprland variable defined in
# another file is not in scope here at all.
bind = , Q, exec, bar-action tide togglePowerMenu
bind = , Q, submap, reset
bind = , R, exec, bar-action tide showPicker record
bind = , R, submap, reset
bind = , S, exec, bar-action tide showPicker spellcheck
bind = , S, submap, reset
# SHIFT+S: qtile's WifiQR, which lived one level deeper than this — $mod P,
# then n for Wifi-Mode, then s. That middle level is gone here: `n` opens the
# island's network list directly rather than a chord, so there is nowhere to
# put a plain `s`, and plain `s` at THIS level is already dm-spellcheck,
# which is a qtile port and keeps its key.
#
# Shifting the letter is the same convention SHIFT+C established for the
# island's theme picker beside rofi's: the key still says what it does, and
# no key reserved for a deferred popup chord is spent.
bind = SHIFT, S, exec, bar-action tide toggleWifiQr
bind = SHIFT, S, submap, reset
bind = , T, exec, bar-action tide showPicker todo
bind = , T, submap, reset
bind = , V, exec, bar-action tide showPicker ilovepdf
bind = , V, submap, reset
bind = , X, exec, dunstctl close-all
bind = , X, submap, reset
bind = , Y, exec, bar-action tide showPicker youtube
bind = , Y, submap, reset
bind = , Z, exec, bar-action tide showPicker shared
bind = , Z, submap, reset

bind = , 1, workspace, 1
bind = , 2, workspace, 2
bind = , 3, workspace, 3
bind = , 4, workspace, 4
bind = , 5, workspace, 5
bind = , 6, workspace, 6
bind = , 7, workspace, 7
bind = , 8, workspace, 8
bind = , 9, workspace, 9

bind = , escape, submap, reset
submap = reset

# ------------------------------------------------------------
#  media   ($mod slash)   — qtile Media-Mode
#
#  This one was reported as "win+/ does nothing", and it did nothing:
#  binds.conf had the entry line commented out with the deferred popups,
#  because the count of 17 bindings made it look like a popup port. It is
#  not. Six of the seventeen are real keys and the other eleven are the
#  nine workspace binds every chord repeats plus q and Escape.
#
#  qtile ran these through scripts/volume_control.py and
#  brightness_control.py. This note used to say they were NOT used here,
#  because "the island draws the OSD" for the hardware keys and routing one
#  path through a qtile module and the other through wpctl "would give the
#  same key two different OSDs and two different rounding behaviours".
#
#  The second half of that was right and is now what fixes the first half.
#  The island draws the OSD only while the island is UP, and bar-switch
#  stops it to start the topbar — so under the qtile-style bar these keys
#  changed the volume with no feedback at all, which is what was reported.
#
#  Every path goes through scripts/media-osd.sh now: one step size, one
#  ceiling, one OSD, and it raises qtile's notification only when nothing
#  else is drawing one. The numbers are still qtile's: ±5 and a 150%
#  ceiling (`-l 1.5`, where volume_control.py's min(150, ...) lands).
#
#  Everything is on SHIFT here, exactly as qtile had it. That is not
#  decoration: the unshifted letters stay free, so the mode swallows
#  nothing it does not own.
# ------------------------------------------------------------
submap = media
# The entry combination; see the header note about leaking keys.
bind = $mod, slash, submap, reset
bindel = SHIFT, K, exec, ~/.config/hypr/scripts/media-osd.sh volume up
bindel = SHIFT, J, exec, ~/.config/hypr/scripts/media-osd.sh volume down
bind   = SHIFT, M, exec, ~/.config/hypr/scripts/media-osd.sh volume mute
bindel = SHIFT, L, exec, ~/.config/hypr/scripts/media-osd.sh brightness up
bindel = SHIFT, H, exec, ~/.config/hypr/scripts/media-osd.sh brightness down
# mpv picture-in-picture. qtile's mpv_manager.toggle_pip_mode does not
# port — it drives qtile's own window objects — so the behaviour is
# reimplemented on hyprctl in scripts/mpv-pip.sh, with that file's
# geometry constants.
bind   = SHIFT, P, exec, ~/.config/hypr/scripts/mpv-pip.sh

bind = , 1, workspace, 1
bind = , 2, workspace, 2
bind = , 3, workspace, 3
bind = , 4, workspace, 4
bind = , 5, workspace, 5
bind = , 6, workspace, 6
bind = , 7, workspace, 7
bind = , 8, workspace, 8
bind = , 9, workspace, 9

bind = , escape, submap, reset
bind = , Q, submap, reset
submap = reset

# ------------------------------------------------------------
#  hint   ($mod SHIFT F)   — qtile Hint-Mode (Hintium)
#
#  Hintium is no longer X11-only (see binds.conf) so this ports
#  verbatim: h/s/f/v/V/e pick a mode and leave, exactly like qtile's
#  KeyChord with mode=True + lazy.ungrab_chord() on every entry. Every
#  key is unshifted except the one that was in qtile too (caret search),
#  since the six direct $alt binds already own the rest of the letters
#  outside this submap.
# ------------------------------------------------------------
submap = hint
# The entry combination; see the header note about leaking keys.
bind = $mod SHIFT, F, submap, reset
bind = , H, exec, $HINTIUM
bind = , H, submap, reset
bind = , S, exec, $HINTIUM --scroll
bind = , S, submap, reset
bind = , F, exec, $HINTIUM --search
bind = , F, submap, reset
bind = , V, exec, $HINTIUM --caret
bind = , V, submap, reset
bind = SHIFT, V, exec, $HINTIUM --caret-search
bind = SHIFT, V, submap, reset
bind = , E, exec, $HINTIUM --edit
bind = , E, submap, reset

bind = , 1, workspace, 1
bind = , 2, workspace, 2
bind = , 3, workspace, 3
bind = , 4, workspace, 4
bind = , 5, workspace, 5
bind = , 6, workspace, 6
bind = , 7, workspace, 7
bind = , 8, workspace, 8
bind = , 9, workspace, 9

bind = , escape, submap, reset
bind = , Q, submap, reset
submap = reset

# ------------------------------------------------------------
#  draw   ($mod SHIFT W)   — WAS qtile Draw-Mode / gromit-mpx
#
#  Removed for good this time. gromit's X11 grab, proxied through
#  XWayland-rootless, does not reach native Wayland surfaces — measured,
#  not theorised, across three separate fix attempts (z-order, forced
#  fullscreen, forced full-frame repaint) that each ruled out a different
#  layer and landed on the same wall. wayscriber replaces it: genuinely
#  Wayland-native (wlr-layer-shell), no submap needed — see binds.conf's
#  `$mod SHIFT, W` for the single toggle bind and why no relay is needed.
# ------------------------------------------------------------

# ------------------------------------------------------------
#  lang   ($mod SPACE)   — qtile Lang-Switch
#
#  qtile showed these as raw keycodes (0x1a, 0x1c, 0x26, 0x28) because
#  they were bound by keycode to survive layout changes — the whole
#  point of a layout switcher.  Decoded against the X11 keymap:
#      0x1a = 26 = e -> us     0x1c = 28 = t -> tr
#      0x26 = 38 = a -> ara    0x28 = 40 = d -> de
#  matching configured_keyboards=["us","ara","tr","de"].
#
#  Hyprland switches layouts by index into input:kb_layout, so the
#  order in input.conf must stay us,ara,tr,de for these to be right.
#  Device name comes from `hyprctl devices`; the wildcard below hits
#  every keyboard, which is what you want on a laptop + dock.
# ------------------------------------------------------------
submap = lang
# The entry combination; see the header note about leaking keys.
bind = $mod, SPACE, submap, reset
bind = , E, exec, hyprctl switchxkblayout all 0
bind = , E, submap, reset
bind = , A, exec, hyprctl switchxkblayout all 1
bind = , A, submap, reset
bind = , T, exec, hyprctl switchxkblayout all 2
bind = , T, submap, reset
bind = , D, exec, hyprctl switchxkblayout all 3
bind = , D, submap, reset

bind = , escape, submap, reset
bind = , Q, submap, reset
submap = reset

# ------------------------------------------------------------
#  cheatsheet   ($mod SHIFT K)   — qtile CheatSheet-Mode
#
#  qtile's chord had 16 bindings and four of them (j, k, Tab,
#  Shift+Tab) existed only to move a viewport around 129 rows of
#  hand-maintained text.  rofi replaces all four with typing what you
#  are looking for, so they are deliberately not reproduced.  The rest
#  is faithful: k for the WM sheet, v for vim, f for fish.
#
#  `k` shows HYPRLAND's bindings, not qtile's, and it reads them from
#  `hyprctl binds` at the moment you press it — so the sheet cannot
#  drift from the config the way qtile's hand-written 129 rows did.
#  See scripts/cheatsheet.py.
#
#  qtile entered this chord by SHOWING the qtile sheet immediately
#  (auto_enable_cheatsheet).  Reproduced by k, one keypress later,
#  rather than on entry: the sheet grabs the keyboard itself, so
#  opening one on entry would mean the v and f bindings could never
#  be reached.
#
#  ---- NOW IN THE ISLAND, NOT IN ROFI ----
#
#  cheatsheet.py's own header explains why it was rofi: item 3's rule
#  is that interactive popups get rebuilt in the shell and launcher
#  problems stay on rofi, and a cheatsheet is read-and-dismiss.  That
#  reasoning was sound and it was overruled anyway — every other
#  surface here lives in the notch, and a rofi window over the desktop
#  for the one chord that explains the desktop was the odd one out.
#
#  What rofi actually contributed was the TYPING, not the window:
#  qtile spent four of its sixteen bindings scrolling a viewport and
#  rofi replaced all four with a search field.  qml/cheatsheet/
#  CheatsheetLayer.qml is built around reproducing that, so k/v/f pick
#  the sheet the panel OPENS on and Tab cycles them once it is up —
#  which is the one thing neither rofi nor qtile could do.
#
#  The script is still the backend: the panel runs
#  `cheatsheet.py --sheet-json`, off the same builders that print the
#  rofi sheet, so `cheatsheet.py hypr` in a terminal still works and
#  there is exactly one copy of the content.
# ------------------------------------------------------------
$tide = bar-action tide
submap = cheatsheet
bind = $mod SHIFT, K, submap, reset
bind = , K, exec, $tide showCheatsheet hypr
bind = , K, submap, reset
bind = , V, exec, $tide showCheatsheet vim
bind = , V, submap, reset
bind = , F, exec, $tide showCheatsheet fish
bind = , F, submap, reset
# I is the ISLAND's own keymap — the settings panel's h/j/k/l and g/G, the
# picker's keys, the connectivity panels' keys. Unlike the three above it
# is not derived from anything: Quickshell has no `hyprctl binds`, so the
# rows are a hand-kept copy of the QML key handlers. cheatsheet.py names
# the file each section was read out of, so a row can be checked by
# opening one file.
bind = , I, exec, $tide showCheatsheet island
bind = , I, submap, reset

# D and T — the reference pair — USED TO BE HERE and deliberately are not.
#
# Asked for directly: "the win+shift+k just the cheatsheets vim hyper
# fish". This chord is now scoped to that — the four sheets that answer
# "what are the keys for <thing>" — and the two reference sheets belong to
# `$mod SHIFT /`, which opens straight onto docs with no chord in front of
# it. See the block above that bind in binds.conf.
#
# NOTHING BECAME UNREACHABLE, which is the only reason this is a scoping
# change rather than a removal: CheatsheetLayer's Tab cycle is
# hypr, vim, fish, island, docs, trouble, so both sheets are still one Tab
# away from every sheet this chord opens, and `cheatsheet.py docs` still
# prints them in a terminal.

bind = , 1, workspace, 1
bind = , 2, workspace, 2
bind = , 3, workspace, 3
bind = , 4, workspace, 4
bind = , 5, workspace, 5
bind = , 6, workspace, 6
bind = , 7, workspace, 7
bind = , 8, workspace, 8
bind = , 9, workspace, 9

bind = , escape, submap, reset
bind = , Q, submap, reset
submap = reset

# ------------------------------------------------------------
#  passthrough   ($mod F12)   — qtile PASSTHROUGH mode
#
#  qtile's version ungrabbed everything so a VM/remote session could
#  see the keys.  Hyprland has no true global ungrab; an empty submap
#  is the accepted equivalent — it swallows nothing except its own
#  exit key, so every other combination reaches the focused client.
# ------------------------------------------------------------
#  ---- ESCAPE DOES NOT LEAVE; IT ASKS ----
#
#  qtile's _enable_passthrough does three things and this had one of them.
#  Ported in full (see scripts/passthrough.sh for the bar switch and the two
#  notifications, and CHORD_CHIP_LABELS for what the chip says):
#
#      $mod F12   enter: bar -> bottom, notify PASSTHROUGH MODE
#      Escape     does NOT exit — it enters PASSTHROUGH-CONFIRM
#      y          really leave: restore the bar, notify NORMAL MODE
#      n / Esc    go back into passthrough
#
#  The confirm step is the whole point of the mode. Passthrough exists so a
#  VM or a remote session gets every key, and Escape is a key those sessions
#  use constantly — an Escape that silently dropped you out of passthrough
#  would fire the first time you pressed Escape INSIDE the VM, which is the
#  one thing the mode is for. That is why config.py has a second chord for it
#  and why CHORD_CHIP_LABELS carries an entry that is only ever a question.
#
#  $mod F12 stays bound inside passthrough as the direct way out, because a
#  mode that swallows the keyboard needs an exit that does not depend on
#  remembering a two-step. It goes through the same script, so the bar and
#  the notification are not skipped.
submap = passthrough
bind = , escape, submap, passthrough-confirm
bind = $mod, F12, exec, ~/.config/hypr/scripts/passthrough.sh exit
bind = $mod, F12, submap, reset
submap = reset

#  The confirm chord. Three keys and nothing else — every other key is
#  swallowed here, deliberately: this is a question, and a question that
#  quietly accepts "j" as an answer is not one.
submap = passthrough-confirm
bind = , Y, exec, ~/.config/hypr/scripts/passthrough.sh exit
bind = , Y, submap, reset
bind = , N, submap, passthrough
bind = , escape, submap, passthrough
submap = reset
