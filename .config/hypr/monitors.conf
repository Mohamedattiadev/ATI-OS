# ============================================================
#  Monitors
#
#  qtile discovered outputs at runtime via `xrandr --listmonitors`
#  (_monitor_count() in config.py) and built one Screen per output.
#  Hyprland does that natively — the catch-all below gives every
#  connected output its preferred mode, auto position, scale 1.
#
#  To pin a specific layout, replace the catch-all with explicit
#  lines and check names with:  hyprctl monitors
# ============================================================

monitor = , preferred, auto, 1

# Example of an explicit setup, kept commented for when you need it:
# monitor = eDP-1,  1920x1080@60, 0x0,    1
# monitor = HDMI-A-1, 1920x1080@60, 1920x0, 1

# qtile put the systray + bottom bar on screen 0 only.  Hyprland has no
# equivalent concept; the bar (Tide-island / Quickshell) decides per-output
# what it draws.  See MIGRATION.md.
