# ============================================================
#  Input
#
#  THE CAPS->ALT PROBLEM (read this one, it is load-bearing)
#
#  This laptop's physical Alt key is dead in hardware.  Under X11
#  the workaround lived in ~/.Xmodmap:
#
#      clear lock / clear mod1
#      keycode 66 = Alt_L
#      add mod1 = Alt_L Alt_R
#
#  i.e. Caps Lock *becomes* Alt_L, and ~40 bindings in this config
#  use ALT as their modifier.  Without this remap, roughly a third
#  of the keyboard does nothing.
#
#  xmodmap does not exist on Wayland, and xkb ships no `caps:alt`
#  option (it has caps:super, caps:ctrl_modifier, caps:escape,
#  caps:hyper — but not alt).  So there are two real routes:
#
#  ROUTE A — keyd (recommended, and what ../keyd/ is set up for)
#      Remaps at the evdev layer, below the display server, so the
#      same remap serves BOTH qtile/X11 and Hyprland.  One config,
#      no divergence while you run both sessions.  See MIGRATION.md
#      for the drop-in keyd config.
#
#  ROUTE B — a custom xkb keymap fed to Hyprland via kb_file
#      Self-contained in this directory, but Hyprland-only, so the
#      remap would have to be maintained twice while you dual-run.
#      Left commented below.
#
#  Route A is active by default: nothing here touches Caps, because
#  keyd has already turned it into Alt before Hyprland sees the key.
# ============================================================

input {
    # Matches configured_keyboards=["us", "ara", "tr", "de"] from the
    # qtile KeyboardLayout widget.  Order matters: it is the order the
    # Lang-Switch submap and any cycle-forward binding walk through.
    kb_layout = us,ara,tr,de
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    # ROUTE B, if you ever want the remap to live here instead of keyd:
    # kb_file = ~/.config/hypr/caps-as-alt.xkb

    follow_mouse = 1
    mouse_refocus = false

    # qtile's floating/focus behaviour was focus-follows-mouse with no
    # warp; this is the closest equivalent.
    float_switch_override_focus = 0

    # ---- SCROLL DIRECTION: read /etc/X11/xorg.conf.d/30-touchpad.conf ----
    #
    # Reported as "scrolling is the opposite way round from qtile". It was,
    # and the X11 session is the thing that decides what "right" means here,
    # so it was read rather than guessed:
    #
    #     Section "InputClass"
    #         Identifier  "Touchpad"
    #         MatchIsTouchpad "on"
    #         Driver      "libinput"
    #         Option      "Tapping" "on"
    #     EndSection
    #
    # One option, and it is not this one. `NaturalScrolling` is absent, and
    # xf86-input-libinput's default for it is **off** — so under qtile/X11
    # both the touchpad and the mouse scroll the TRADITIONAL way (content
    # goes up when the fingers go up). Nothing else in xorg.conf.d touches
    # scrolling: the only other file is 00-keyboard.conf.
    #
    # Hyprland had `natural_scroll = true` here, i.e. exactly inverted. Hence
    # the report.
    #
    # ---- TWO SETTINGS, NOT ONE ----
    #
    # `input:natural_scroll` (pointers/mice) and `input:touchpad:natural_scroll`
    # are SEPARATE options with separate defaults, and fixing one leaves the
    # other. Measured before the change:
    #
    #     hyprctl getoption input:natural_scroll           -> int: 0   set: false
    #     hyprctl getoption input:touchpad:natural_scroll  -> int: 1   set: true
    #
    # So the mouse was already correct by default and only the touchpad was
    # inverted. The mouse line below is still written out explicitly: an
    # option that is right only because nobody set it is one upstream default
    # change away from being wrong, and this file is the place that is
    # supposed to say what X11 does.
    natural_scroll = false

    touchpad {
        natural_scroll = false
        disable_while_typing = true
        tap-to-click = true

        # DELIBERATE DEVIATION, left as-is because the report was about
        # direction and this is speed. X11 has no scroll-factor knob at all
        # (autostart.sh drove it with an `xinput set-prop` scroll-distance
        # loop, dropped in the port), so there is no qtile number to match;
        # 0.5 is this config's own choice and halves the travel per swipe.
        # Set it to 1.0 if Hyprland's scrolling feels slow next to qtile's.
        scroll_factor = 0.5
    }

    sensitivity = 0
}

# Gestures were reworked in Hyprland 0.5x: the old
# `gestures { workspace_swipe = ... }` block no longer exists and is
# rejected outright. The replacement is one `gesture =` line per
# binding, in the form:
#     gesture = <finger count>, <direction>, <action>
gesture = 3, horizontal, workspace

# Per-device overrides go here, e.g.:
# device {
#     name = <from `hyprctl devices`>
#     sensitivity = -0.2
# }
