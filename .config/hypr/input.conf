# ============================================================
#  Input
#
#  THE CAPS->ALT PROBLEM (read this one, it is load-bearing)
#
#  This laptop's physical Alt key is dead in hardware.  Under X11
#  the workaround lived in ~/.Xmodmap:
#
#      clear lock / clear mod1
#      keycode 66 = Alt_L
#      add mod1 = Alt_L Alt_R
#
#  i.e. Caps Lock *becomes* Alt_L, and ~40 bindings in this config
#  use ALT as their modifier.  Without this remap, roughly a third
#  of the keyboard does nothing.
#
#  xmodmap does not exist on Wayland, and xkb ships no `caps:alt`
#  option (it has caps:super, caps:ctrl_modifier, caps:escape,
#  caps:hyper — but not alt).  So there are two real routes:
#
#  ROUTE A — keyd (recommended, and what ../keyd/ is set up for)
#      Remaps at the evdev layer, below the display server, so the
#      same remap serves BOTH qtile/X11 and Hyprland.  One config,
#      no divergence while you run both sessions.  See MIGRATION.md
#      for the drop-in keyd config.
#
#  ROUTE B — a custom xkb keymap fed to Hyprland via kb_file
#      Self-contained in this directory, but Hyprland-only, so the
#      remap would have to be maintained twice while you dual-run.
#      Left commented below.
#
#  Route A is active by default: nothing here touches Caps, because
#  keyd has already turned it into Alt before Hyprland sees the key.
# ============================================================

input {
    # Matches configured_keyboards=["us", "ara", "tr", "de"] from the
    # qtile KeyboardLayout widget.  Order matters: it is the order the
    # Lang-Switch submap and any cycle-forward binding walk through.
    kb_layout = us,ara,tr,de
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    # ROUTE B, if you ever want the remap to live here instead of keyd:
    # kb_file = ~/.config/hypr/caps-as-alt.xkb

    follow_mouse = 1
    mouse_refocus = false

    # qtile's floating/focus behaviour was focus-follows-mouse with no
    # warp; this is the closest equivalent.
    float_switch_override_focus = 0

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        scroll_factor = 0.5
    }

    sensitivity = 0
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 400
}

# Per-device overrides go here, e.g.:
# device {
#     name = <from `hyprctl devices`>
#     sensitivity = -0.2
# }
