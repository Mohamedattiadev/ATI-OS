# ============================================================
#  Window rules
#
#  Ported from the Match() lists in config.py + scripts/float_windows.py.
#
#  Translation note: qtile matched on wm_class / wm_instance_class /
#  title (X11 properties).  Hyprland matches on `class` and `title`,
#  which for XWayland clients are the same strings, and for native
#  Wayland clients come from xdg-shell app_id.  Most app_ids match the
#  old WM_CLASS; verify any that misbehave with:  hyprctl clients
# ============================================================

# ------------------------------------------------------------
#  Floating dialogs — the qtile floating_layout Match list
# ------------------------------------------------------------
windowrule = float true, match:class ^(confirmreset)$
windowrule = float true, match:class ^(makebranch)$
windowrule = float true, match:class ^(maketag)$
windowrule = float true, match:class ^(dialog)$
windowrule = float true, match:class ^(download)$
windowrule = float true, match:class ^(error)$
windowrule = float true, match:class ^(file_progress)$
windowrule = float true, match:class ^(notification)$
windowrule = float true, match:class ^(splash)$
windowrule = float true, match:class ^(toolbar)$
windowrule = float true, match:title ^(branchdialog)$
windowrule = float true, match:title ^(Confirmation)$
windowrule = float true, match:title ^(pinentry)$
windowrule = float true, match:title ^(Qalculate!)$

# ------------------------------------------------------------
#  THE DIALOGS THAT ACTUALLY APPEAR — qtile's wm_type rules, on Wayland
# ------------------------------------------------------------
#
#  Reported: "when I download something from the browser, or upload an image
#  or a file, a dialog appears — it should float and be in the middle like
#  qtile".
#
#  The class rules above are qtile's floating_layout list and they are a
#  faithful port of the wrong half. That list is
#  `[*layout.Floating.default_float_rules, ...]`, and the defaults it starts
#  from are mostly WINDOW TYPES, not classes:
#
#      wm_type: utility / notification / toolbar / splash / DIALOG
#
#  `wm_type=dialog` is what floats a file chooser, a download prompt, a
#  save-as. It is an X11 property, so under Wayland it does not exist and
#  nothing above can match one. The `class ^(dialog)$` line looks like it
#  covers this and never has: no toolkit sets an app_id of "dialog".
#
#  MEASURED, with a real GTK file chooser open on this session:
#
#      class='xdg-desktop-portal-gtk'  title='Open File'
#      floating=False   at=[10,48]   size=[1346,710]
#      grouped=[...6 windows...]
#
#  So it tiled at almost full screen AND joined the max layout's group,
#  which is a dialog becoming a tab in the stack behind you.
#
#  Hyprland has no "is a dialog" matcher — the client JSON carries no modal
#  or parent field, checked field by field on that window — so the rules are
#  by class and title, in four groups.
#
#  1. THE PORTAL, which is how every Wayland browser and most GTK/Qt apps ask
#     for a file now. One process per portal implementation.
windowrule = float true,   match:class ^(xdg-desktop-portal-gtk)$
windowrule = size 900 600, match:class ^(xdg-desktop-portal-gtk)$
windowrule = center true,  match:class ^(xdg-desktop-portal-gtk)$
windowrule = float true,   match:class ^(xdg-desktop-portal-kde)$
windowrule = center true,  match:class ^(xdg-desktop-portal-kde)$
windowrule = float true,   match:class ^(org\.freedesktop\.impl\.portal\.desktop\.(gtk|kde))$
windowrule = center true,  match:class ^(org\.freedesktop\.impl\.portal\.desktop\.(gtk|kde))$

#  2. APPS THAT DRAW THEIR OWN CHOOSER instead of using the portal, where the
#     class is the APPLICATION's and only the title says it is a dialog. That
#     is why these match on title alone — matching the class would float the
#     browser itself, which is the opposite of the ask.
windowrule = float true,  match:title ^(Open|Open File|Open Files|Open Folder|Select a File|Select Files|Select Folder|Choose a file|Choose Files)$
windowrule = center true, match:title ^(Open|Open File|Open Files|Open Folder|Select a File|Select Files|Select Folder|Choose a file|Choose Files)$
windowrule = float true,  match:title ^(Save|Save As|Save File|Save Image|Enter name of file to save to)$
windowrule = center true, match:title ^(Save|Save As|Save File|Save Image|Enter name of file to save to)$
windowrule = float true,  match:title ^(File Upload|Upload File|Upload Files|File Download|Downloads)$
windowrule = center true, match:title ^(File Upload|Upload File|Upload Files|File Download|Downloads)$

#  3. THE AUTHENTICATION PROMPTS, which are the other thing wm_type=dialog
#     caught and which are worse to lose: a polkit or pinentry window tiled
#     behind a full-screen client is a password prompt you cannot see.
windowrule = float true,  match:class ^(polkit-gnome-authentication-agent-1|hyprpolkitagent|org\.kde\.polkit-kde-authentication-agent-1)$
windowrule = center true, match:class ^(polkit-gnome-authentication-agent-1|hyprpolkitagent|org\.kde\.polkit-kde-authentication-agent-1)$
windowrule = float true,  match:class ^(pinentry-gtk|pinentry-gtk-2|pinentry-gnome3|pinentry-qt|pinentry)$
windowrule = center true, match:class ^(pinentry-gtk|pinentry-gtk-2|pinentry-gnome3|pinentry-qt|pinentry)$
windowrule = float true,  match:class ^(ssh-askpass|x11-ssh-askpass)$
windowrule = center true, match:class ^(ssh-askpass|x11-ssh-askpass)$
windowrule = center true, match:title ^(pinentry)$

#  4. THE SCRIPT DIALOGS. qtile's list has `Yad`; zenity is the same shape and
#     is what this tree's own scripts reach for.
windowrule = float true,  match:class ^([Yy]ad|zenity|org\.gnome\.Zenity)$
windowrule = center true, match:class ^([Yy]ad|zenity|org\.gnome\.Zenity)$

#  A dialog must never join a GROUP either. Max and TreeTab are groups here
#  (scripts/layout-cycle.sh), and the measurement above caught the file
#  chooser being folded into one with five other windows — a modal turned
#  into a tab behind the window that opened it. `float true` keeps it out,
#  because Hyprland only groups tiled windows.

# ------------------------------------------------------------
#  The island's settings app
# ------------------------------------------------------------
#  scripts/island-settings-app.py — a GTK4/libadwaita window over the same
#  island-settings.py schema the in-island panel edits. It floats for the
#  reason every preferences window does: it is consulted beside the thing it
#  configures, not worked in. Tiled into a master stack beside a terminal it
#  gets ~340 px, and every row in it is a label plus a paragraph of
#  description, so the description wraps to nine lines and the control is
#  pushed off the right edge. Measured with a real capture, not assumed.
#
#  The size is deliberate: 980x780 fits the widest group ("Typography", four
#  font rows carrying a family name and a Choose button) without the entry
#  wrapping, and still fits inside this machine's 1366x768 panel with the
#  island's 33 px reserved strip accounted for.
windowrule = float true, match:class ^(dev\.ati\.IslandSettings)$
windowrule = size 980 720, match:class ^(dev\.ati\.IslandSettings)$
windowrule = center true, match:class ^(dev\.ati\.IslandSettings)$

# ------------------------------------------------------------
#  Hyprland's own dialog window, which must never take the keyboard
# ------------------------------------------------------------
#  `hyprland-dialog` is the class Hyprland spawns for its config-error box
#  and — the one that matters here — its ANR ("Application Not Responding")
#  prompt. Caught while instrumenting a theme change from workspace 2 by
#  polling `pgrep -af hyprland-dialog` every 150 ms:
#
#      hyprland-dialog --title Application Not Responding
#        --text An application Error loading https://yewtu.be/ - qutebrowser
#          - org.qutebrowser.qutebrowser is not responding.
#          What do you want to do with it?
#        --buttons Terminate;Wait
#
#  On the event socket it maps at t=13.93s, takes the keyboard the same
#  frame, and is gone by t=15.04 — about 1.1 s of your typing going into a
#  dialog you never asked for, in the middle of a theme change.
#
#  It is NOT qutebrowser's fault and not the config-source call's: measured
#  on its own, `qutebrowser ":config-source"` returns in 1.37 s and no
#  dialog appears at all. It only appears during a full `theme-apply`,
#  where brave is being killed and relaunched, dunst restarted, the
#  Chromium extension repacked and the boot splash regenerated all at once.
#  qb misses Hyprland's 5 default pings because the machine is saturated,
#  not because it is hung. (`misc:anr_missed_pings` was unset when this was
#  written; it is 20 in looks.conf now — see the correction below.)
#
#  This paragraph used to end: "Deliberately NOT fixed by turning ANR off
#  (misc:enable_anr_dialog) or by raising the ping count: an app that really
#  has hung is worth being told about, and both of those trade that away."
#
#  HALF OF THAT WAS WRONG, and the half that was wrong is the one that had
#  to be acted on — the box came back, reported as "when I reload the config
#  it shows message terminal or wait". `Terminate` is the word.
#
#  The two options were lumped together and they are not comparable.
#  `enable_anr_dialog = false` does trade the feature away. Raising the ping
#  count does not: a genuinely hung app is hung permanently, so it still
#  gets reported, just later. Calibrated by SIGSTOPping a throwaway kitty
#  and timing the box — 5 pings is 7.9 s, 20 pings is 30.8 s — so the whole
#  cost is not hearing about stalls in the 8-31 s band. The stall measured
#  RIGHT HERE is in that band and was a false positive: qutebrowser was
#  answering again 1.1 s after the box appeared, which is sooner than you
#  can read it. looks.conf carries the change and the numbers.
#
#  no_initial_focus stays, and is now the second line of defence rather than
#  the only one: it keeps the box on screen and clickable — it just no
#  longer steals the keyboard to tell you something you are about to
#  dismiss. It matters for the real hangs that still reach it.
windowrule = no_initial_focus true, match:class ^(hyprland-dialog)$

# Media / viewers
windowrule = float true, match:class ^(mpv|mpvk)$
windowrule = float true, match:class ^(imv)$
# CLASS, not title. This rule was `match:title ^(feh)$` and had never matched
# anything: feh's title is "feh [1 of 1] - <filename>" and its class is plain
# "feh", both read off a live window. So feh has been TILING this whole time
# while a rule that looked correct sat here. qtile matches wm_class for the
# same window, which is what made the difference visible.
windowrule = float true, match:class ^(feh)$

# ---- THE FLOAT SIZES, WHICH WERE MISSING ----
#
# Reported as "the float window should open its sizes, not like the qtile".
# Every one of these already had `float true` here and NO size rule, so it
# floated at whatever the application asked for — which for imv is the image's
# own dimensions and for feh is whatever it feels like. qtile does not leave
# that to the app: scripts/float_windows.py subscribes to client_new and calls
# cmd_set_size_floating() with an explicit size for each, then centres it.
#
# These are those numbers, verbatim:
#
#     satty          1000 x 700   centred
#     imv             800 x 600   centred
#     feh             250 x 250   centred
#     edit-field      650 x 200
#     link-preview    200 x 150   at 100,250
#
# `center true` rather than a `move`, except where qtile itself gave explicit
# coordinates — float_windows.py calls cmd_center() for satty, imv and feh and
# cmd_set_position_floating(100, 250) for link-preview only, and the
# difference is deliberate there: a link preview belongs out of the way, not
# under the pointer.
#
# satty gets a `float true` of its own because it never had one. It is the
# screenshot annotator dm-satty opens, and its class is com.gabm.satty, read
# off its .desktop StartupWMClass rather than guessed.
windowrule = float true,      match:class ^(com\.gabm\.satty|satty)$
windowrule = size 1000 700,   match:class ^(com\.gabm\.satty|satty)$
windowrule = center true,     match:class ^(com\.gabm\.satty|satty)$

windowrule = size 800 600,    match:class ^(imv)$
windowrule = center true,     match:class ^(imv)$

windowrule = size 250 250,    match:class ^(feh)$
windowrule = center true,     match:class ^(feh)$

# The nvim edit-field. qtile matches on the WINDOW NAME, not the class, because
# it is a terminal spawned for one job and its class is the terminal's.
windowrule = float true,      match:title ^(edit-field)$
windowrule = size 650 200,    match:title ^(edit-field)$

# PORTED, but NOT here and it never could be: qtile's float_extra_qutebrowsers
# floats the SECOND and later qutebrowser at 900x600 and leaves the first
# tiled. That is a rule about how many instances already exist, and a
# windowrule matches a window against its OWN properties — it cannot count its
# siblings. It lives in scripts/float-extra.sh, an openwindow listener built on
# workspace-layout.sh's shape, and autostart.conf starts it.
windowrule = float true, match:class ^(clip-view)$
windowrule = float true, match:class ^(docs-view)$

# ------------------------------------------------------------
#  The TODOS summary window ($mod SHIFT S) — see scripts/sum-toggle.sh
#
#  qtile's float_rules match `Match(wm_class="sum-md")` FIRST and
#  `Match(title="sum.md")` only as a fallback, and sum_app.py says why in
#  as many words: WM_CLASS exists before the MapRequest, WM_NAME races it,
#  so a title-only rule loses often enough that the window tiles for a
#  frame before anything floats it. Same ordering here.
#
#  SIZE IS NOT HERE, and the reason overturns something this file used to
#  claim. MIGRATION.md's percentage matrix says a percentage `size` applies
#  on a normal workspace. It does — as an INLINE `dispatch exec` rule, which
#  is what that matrix was measured with. As a static `windowrule` line it
#  is silently inert, exactly like `move`. Measured back to back, same
#  kitty, same workspace, 1366x768:
#
#      windowrule = size 55% 65%      -> 735x715   (ignored)
#      windowrule = size 751 499      -> 751x499   (applied)
#      [float; size 55% 65%] exec     -> 751x499   (applied)
#
#  Percentages still have to be resolved per monitor, so scripts/
#  sum-toggle.sh computes 55%x65% of the focused monitor and passes PIXELS
#  as an inline exec rule — the same shape as scratchpad.sh, and it works
#  here for the same reason: kitty is a process Hyprland itself spawns.
#
#  `center true` DOES work as a static rule and stays, so a summary window
#  opened by any other route is still placed rather than left wherever the
#  floating layer drops it. Verified: a 735-wide window landed at x=316,
#  which is (1366-735)/2.
#
#  There is deliberately NO `workspace name:S` rule here. Group("S")'s
#  `Match(title="nvimsum")` in config.py has not matched anything since the
#  alacritty era — kitty is spawned `--title sum.md` and `--title` overrides
#  the program's own — so qtile never filed this window on S. What it does
#  instead is `win.togroup(qtile.current_group.name)`: the window follows
#  you. Add the rule if you want it pinned to S; it is left out because
#  qtile does not do it.
windowrule = float true,       match:class ^(sum-md)$
windowrule = center true,      match:class ^(sum-md)$
windowrule = float true, match:title ^(sum\.md)$

# Personal floats carried over from float_windows.py
windowrule = float true, match:title ^(link-preview)$
# qtile's own coordinates for this one, not centred — see the size block above.
windowrule = size 200 150, match:title ^(link-preview)$
windowrule = move 100 250, match:title ^(link-preview)$
windowrule = float true, match:title ^(Phone pairing QR)$
windowrule = float true, match:title ^(tastycharts)$
windowrule = float true, match:title ^(tastytrade)$
windowrule = float true, match:title ^(tastytrade - Portfolio Report)$

# ------------------------------------------------------------
#  Scratchpads
#
#  Geometry deliberately does NOT live here — it is computed in
#  scripts/scratchpad.sh and passed as inline exec rules at spawn.
#
#  This block used to hold `size 60% 60%, match:workspace special:term1`
#  and friends.  On Hyprland 0.56.2 that is silently inert: percentage
#  `move` never applies, and percentage `size` does not apply on a
#  special workspace.  `float` DOES apply, so the scratchpads floated at
#  full tiled size and looked almost right, with no error and an empty
#  `hyprctl configerrors`.  Pixel values work; percentages do not.  The
#  measured matrix is in the header comment of scripts/scratchpad.sh.
#
#  Percentages still have to be resolved per-monitor, so the script does
#  it against the focused monitor rather than hardcoding this laptop's
#  1366x768 into the config.
# ------------------------------------------------------------

# Catch a client started OUTSIDE the scratchpad script (e.g. qalculate
# launched from a menu) and put it where the toggle expects to find it.
# Geometry still comes from the script's path, so these only set the
# workspace.
windowrule = workspace special:calc, match:class ^(qalculate-gtk)$

# ------------------------------------------------------------
#  Apps -> workspaces   (qtile: the `matches=[Match(...)]` on each Group)
#
#  This is the half of qtile's group system that had never been ported.
#  qtile files an app onto its group the moment it opens, from anywhere;
#  without these rules every app simply opened on whatever workspace was
#  current, which is exactly the "everything in one workspace" symptom.
#
#  Transcribed from `groups = [...]` in ../qtile/config.py.
#
#  ---- WHY THE PATTERNS LIST SO MANY ALTERNATIVES ----
#
#  qtile matched X11 WM_CLASS. Hyprland matches `class`, which for a
#  native Wayland client is the xdg-shell app_id — and those are NOT the
#  same string for several of these apps. Verified against the running
#  system and the .desktop StartupWMClass entries:
#
#      qutebrowser  -> org.qutebrowser.qutebrowser   (confirmed live)
#      obsidian     -> md.Obsidian                   (per .desktop)
#      anki         -> anki, not qtile's "Anki"      (per .desktop)
#      telegram     -> org.telegram.desktop
#      nautilus     -> org.gnome.Nautilus
#
#  Hyprland uses ECMAScript std::regex, which has NO inline (?i) flag, so
#  case variants have to be spelled out rather than flagged. Chrome is the
#  reason qtile's own comment lists three spellings: it reports "chrome"
#  for some windows and "google-chrome" for others, and matching only one
#  lets half the windows escape to the current workspace.
#
#  Anything not listed here deliberately opens on the current workspace,
#  same as qtile.
#
#  ---- EVERY ONE OF THESE IS `silent`, AND THAT IS THE PORT, NOT A TWEAK ----
#
#  Without `silent` a `workspace N` rule does two things: it files the window
#  on N *and* it drags you to N to look at it. qtile only ever did the first.
#  Its group assignment is a Match on Group(matches=[...]), consumed in
#  manage() -> group.add(); nothing in ../qtile/config.py calls toscreen()
#  from client_new (checked: the only client_new hook is
#  _override_match_from_saved, which does a togroup and no more). So in
#  qtile an app appearing from anywhere landed on its group and you stayed
#  where you were.
#
#  Following is done by the LAUNCHER instead, and always was: $mod B is
#  `toggle-app.sh "^brave-browser$" 5 brave`, and toggle-app.sh dispatches
#  `workspace 5` itself before spawning (branch 3, scripts/toggle-app.sh:126).
#  So pressing the key still takes you there; the rule no longer does it a
#  second time, and nothing else can do it by accident.
#
#  What "by accident" meant in practice: `theme-apply` kills and relaunches
#  brave, chromium, firefox and pcmanfm-qt to make them pick up the new
#  palette. Each relaunched window mapped, matched its rule, and the rule
#  yanked the session onto workspace 5 (then 2, then 3) while the user was
#  typing somewhere else — "after changing the theme the brave qutebrowser
#  and etc restart ok and it takes me to focus on them while I am in another
#  place". The kill was never the part that stole focus. The re-map was, and
#  it stole it through this file.
# ------------------------------------------------------------

# 1 — ticktick
windowrule = workspace 1 silent, match:class ^([Tt]ick[Tt]ick)$

# 2 — browsers/readers (qtile layout: max)
windowrule = workspace 2 silent, match:class ^(org\.qutebrowser\.qutebrowser|qutebrowser|zen-browser|zen|vlc|ops|firefox)$

# 3 — file managers
windowrule = workspace 3 silent, match:class ^(org\.gnome\.Nautilus|nautilus|pcmanfm-qt|pcmanfm)$

# 4 — editors + terminal.  kitty lives here, which is what makes
#     $mod N land on 4 (see scripts/toggle-app.sh).
windowrule = workspace 4 silent, match:class ^([Cc]ode|dev\.zed\.Zed|kitty|cursor)$

# 5 — brave (qtile layout: max)
windowrule = workspace 5 silent, match:class ^(brave-browser|brave|Brave-browser)$

# ------------------------------------------------------------
#  The three browser SCRATCHPADS, caught at map time
# ------------------------------------------------------------
#  "chatgpt / deepseek / whatsapp glitch and do not behave like the
#  terminal scratchpads." Measured, cold-spawning the whatsapp one and
#  polling `hyprctl clients` every 50 ms:
#
#      t=1.20s   class brave-web.whatsapp.com__-Whatsapp
#                workspace 4   TILED   735x715 @ 10,43
#      t=1.51s   workspace special:whats   floating   956x614 @ 205,77
#
#  So for ~310 ms the window is a real TILE on whatever workspace you are
#  on — it shoves the existing layout aside, then vanishes to the
#  scratchpad. That is the whole of the glitch, and the terminals never
#  show it because their geometry arrives as inline `dispatch exec` rules
#  that Hyprland applies as the window maps.
#
#  Those inline rules cannot work for these three. `brave --app=...` hands
#  the URL to the ALREADY RUNNING brave and exits, so the window is
#  created by a process Hyprland never spawned, and rules attached to the
#  spawned process match nothing (scripts/scratchpad.sh documents the
#  measurement). Its fallback — poll for the new address, then place it —
#  is what produces the 310 ms, because it can only ever act AFTER the
#  window exists.
#
#  A windowrule has no such problem: it is matched as the window maps,
#  whoever created it. The classes are stable and derived by brave itself
#  from the URL and profile directory (it ignores --class for --app
#  windows), so they can be matched literally — read off the live windows
#  rather than guessed.
#
#  scratchpad.sh still sets the pixel size and position afterwards, and
#  that stays: percentage `size`/`move` do not apply on a special
#  workspace (see its header), so the exact geometry still has to be
#  computed per monitor. The difference is that it now happens on a
#  workspace that is already hidden, where nothing can see it.
windowrule = workspace special:chatgpt silent, match:class ^(brave-chat\.openai\.com__-Chatgpt)$
windowrule = float true,                       match:class ^(brave-chat\.openai\.com__-Chatgpt)$

windowrule = workspace special:deepseek silent, match:class ^(brave-chat\.deepseek\.com__-Deepseek)$
windowrule = float true,                        match:class ^(brave-chat\.deepseek\.com__-Deepseek)$
windowrule = opacity 0.95,                      match:class ^(brave-chat\.deepseek\.com__-Deepseek)$

windowrule = workspace special:whats silent, match:class ^(brave-web\.whatsapp\.com__-Whatsapp)$
windowrule = float true,                     match:class ^(brave-web\.whatsapp\.com__-Whatsapp)$
windowrule = opacity 0.95,                   match:class ^(brave-web\.whatsapp\.com__-Whatsapp)$

# 6 — chrome/chromium
windowrule = workspace 6 silent, match:class ^(google-chrome|chrome|Google-chrome|chromium|Chromium)$

# 8 — documents: LibreOffice + the PDF/ebook readers (qtile layout: max).
#     DOCUMENT_APP_CLASSES in config.py, "soffice" included because every
#     LibreOffice window carries it as its instance name.
windowrule = workspace 8 silent, match:class ^(libreoffice-(writer|calc|impress|draw|base|math|startcenter)|soffice|okular|org\.pwmt\.zathura|zathura)$

# S — Anki + Obsidian.  qtile's group is literally named "S"; Hyprland
#     supports named workspaces, so it stays "S" rather than being
#     renumbered into the 1-9 range.
#
#     The `match:title ^(nvimsum)$` line that used to sit here has gone.
#     It was the port of Group("S")'s `Match(title="nvimsum")`, which is
#     itself dead config in qtile — nothing has been titled `nvimsum`
#     since alacritty was replaced by kitty, and the summary window is
#     spawned `--title sum.md`. See the sum-md block near the top of this
#     file and scripts/sum-toggle.sh.
windowrule = workspace name:S silent, match:class ^([Aa]nki|md\.Obsidian|obsidian)$

# 9 — messaging
windowrule = workspace 9, match:class ^(thunderbird|org\.telegram\.desktop|TelegramDesktop|telegram-desktop|discord)$

# ------------------------------------------------------------
#  Misc behaviour
# ------------------------------------------------------------
# Picture-in-picture (qtile had toggle_pip_mode in Media-Mode).
windowrule = float true, match:title ^(Picture-in-Picture)$
windowrule = pin true, match:title ^(Picture-in-Picture)$
windowrule = size 25%  25%, match:title ^(Picture-in-Picture)$
windowrule = move 74% 74%, match:title ^(Picture-in-Picture)$

# Inhibit idle while media plays fullscreen.
windowrule = idle_inhibit fullscreen, match:class ^(.*)$

# XWayland apps that need it
windowrule = no_blur true, match:xwayland true, match:title ^(gromit-mpx)$
windowrule = no_focus true, match:xwayland true, match:title ^(gromit-mpx)$

# Suppress the maximize event browsers fire on startup.
windowrule = suppress_event maximize, match:class ^(brave-browser|brave|chromium|firefox)$
