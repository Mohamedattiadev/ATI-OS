# ============================================================
#  Window rules
#
#  Ported from the Match() lists in config.py + scripts/float_windows.py.
#
#  Translation note: qtile matched on wm_class / wm_instance_class /
#  title (X11 properties).  Hyprland matches on `class` and `title`,
#  which for XWayland clients are the same strings, and for native
#  Wayland clients come from xdg-shell app_id.  Most app_ids match the
#  old WM_CLASS; verify any that misbehave with:  hyprctl clients
# ============================================================

# ------------------------------------------------------------
#  Floating dialogs — the qtile floating_layout Match list
# ------------------------------------------------------------
windowrule = float true, match:class ^(confirmreset)$
windowrule = float true, match:class ^(makebranch)$
windowrule = float true, match:class ^(maketag)$
windowrule = float true, match:class ^(dialog)$
windowrule = float true, match:class ^(download)$
windowrule = float true, match:class ^(error)$
windowrule = float true, match:class ^(file_progress)$
windowrule = float true, match:class ^(notification)$
windowrule = float true, match:class ^(splash)$
windowrule = float true, match:class ^(toolbar)$
windowrule = float true, match:title ^(branchdialog)$
windowrule = float true, match:title ^(Confirmation)$
windowrule = float true, match:title ^(pinentry)$
windowrule = float true, match:title ^(Qalculate!)$

# Media / viewers
windowrule = float true, match:class ^(mpv|mpvk)$
windowrule = float true, match:class ^(imv)$
windowrule = float true, match:title ^(feh)$
windowrule = float true, match:class ^(clip-view)$
windowrule = float true, match:class ^(docs-view)$

# ------------------------------------------------------------
#  The TODOS summary window ($mod SHIFT S) — see scripts/sum-toggle.sh
#
#  qtile's float_rules match `Match(wm_class="sum-md")` FIRST and
#  `Match(title="sum.md")` only as a fallback, and sum_app.py says why in
#  as many words: WM_CLASS exists before the MapRequest, WM_NAME races it,
#  so a title-only rule loses often enough that the window tiles for a
#  frame before anything floats it. Same ordering here.
#
#  SIZE IS NOT HERE, and the reason overturns something this file used to
#  claim. MIGRATION.md's percentage matrix says a percentage `size` applies
#  on a normal workspace. It does — as an INLINE `dispatch exec` rule, which
#  is what that matrix was measured with. As a static `windowrule` line it
#  is silently inert, exactly like `move`. Measured back to back, same
#  kitty, same workspace, 1366x768:
#
#      windowrule = size 55% 65%      -> 735x715   (ignored)
#      windowrule = size 751 499      -> 751x499   (applied)
#      [float; size 55% 65%] exec     -> 751x499   (applied)
#
#  Percentages still have to be resolved per monitor, so scripts/
#  sum-toggle.sh computes 55%x65% of the focused monitor and passes PIXELS
#  as an inline exec rule — the same shape as scratchpad.sh, and it works
#  here for the same reason: kitty is a process Hyprland itself spawns.
#
#  `center true` DOES work as a static rule and stays, so a summary window
#  opened by any other route is still placed rather than left wherever the
#  floating layer drops it. Verified: a 735-wide window landed at x=316,
#  which is (1366-735)/2.
#
#  There is deliberately NO `workspace name:S` rule here. Group("S")'s
#  `Match(title="nvimsum")` in config.py has not matched anything since the
#  alacritty era — kitty is spawned `--title sum.md` and `--title` overrides
#  the program's own — so qtile never filed this window on S. What it does
#  instead is `win.togroup(qtile.current_group.name)`: the window follows
#  you. Add the rule if you want it pinned to S; it is left out because
#  qtile does not do it.
windowrule = float true,       match:class ^(sum-md)$
windowrule = center true,      match:class ^(sum-md)$
windowrule = float true, match:title ^(sum\.md)$

# Personal floats carried over from float_windows.py
windowrule = float true, match:title ^(link-preview)$
windowrule = float true, match:title ^(Phone pairing QR)$
windowrule = float true, match:title ^(tastycharts)$
windowrule = float true, match:title ^(tastytrade)$
windowrule = float true, match:title ^(tastytrade - Portfolio Report)$

# ------------------------------------------------------------
#  Scratchpads
#
#  Geometry deliberately does NOT live here — it is computed in
#  scripts/scratchpad.sh and passed as inline exec rules at spawn.
#
#  This block used to hold `size 60% 60%, match:workspace special:term1`
#  and friends.  On Hyprland 0.56.2 that is silently inert: percentage
#  `move` never applies, and percentage `size` does not apply on a
#  special workspace.  `float` DOES apply, so the scratchpads floated at
#  full tiled size and looked almost right, with no error and an empty
#  `hyprctl configerrors`.  Pixel values work; percentages do not.  The
#  measured matrix is in the header comment of scripts/scratchpad.sh.
#
#  Percentages still have to be resolved per-monitor, so the script does
#  it against the focused monitor rather than hardcoding this laptop's
#  1366x768 into the config.
# ------------------------------------------------------------

# Catch a client started OUTSIDE the scratchpad script (e.g. qalculate
# launched from a menu) and put it where the toggle expects to find it.
# Geometry still comes from the script's path, so these only set the
# workspace.
windowrule = workspace special:calc, match:class ^(qalculate-gtk)$

# ------------------------------------------------------------
#  Apps -> workspaces   (qtile: the `matches=[Match(...)]` on each Group)
#
#  This is the half of qtile's group system that had never been ported.
#  qtile files an app onto its group the moment it opens, from anywhere;
#  without these rules every app simply opened on whatever workspace was
#  current, which is exactly the "everything in one workspace" symptom.
#
#  Transcribed from `groups = [...]` in ../qtile/config.py.
#
#  ---- WHY THE PATTERNS LIST SO MANY ALTERNATIVES ----
#
#  qtile matched X11 WM_CLASS. Hyprland matches `class`, which for a
#  native Wayland client is the xdg-shell app_id — and those are NOT the
#  same string for several of these apps. Verified against the running
#  system and the .desktop StartupWMClass entries:
#
#      qutebrowser  -> org.qutebrowser.qutebrowser   (confirmed live)
#      obsidian     -> md.Obsidian                   (per .desktop)
#      anki         -> anki, not qtile's "Anki"      (per .desktop)
#      telegram     -> org.telegram.desktop
#      nautilus     -> org.gnome.Nautilus
#
#  Hyprland uses ECMAScript std::regex, which has NO inline (?i) flag, so
#  case variants have to be spelled out rather than flagged. Chrome is the
#  reason qtile's own comment lists three spellings: it reports "chrome"
#  for some windows and "google-chrome" for others, and matching only one
#  lets half the windows escape to the current workspace.
#
#  Anything not listed here deliberately opens on the current workspace,
#  same as qtile.
# ------------------------------------------------------------

# 1 — ticktick
windowrule = workspace 1, match:class ^([Tt]ick[Tt]ick)$

# 2 — browsers/readers (qtile layout: max)
windowrule = workspace 2, match:class ^(org\.qutebrowser\.qutebrowser|qutebrowser|zen-browser|zen|vlc|ops|firefox)$

# 3 — file managers
windowrule = workspace 3, match:class ^(org\.gnome\.Nautilus|nautilus|pcmanfm-qt|pcmanfm)$

# 4 — editors + terminal.  kitty lives here, which is what makes
#     $mod N land on 4 (see scripts/toggle-app.sh).
windowrule = workspace 4, match:class ^([Cc]ode|dev\.zed\.Zed|kitty|cursor)$

# 5 — brave (qtile layout: max)
windowrule = workspace 5, match:class ^(brave-browser|brave|Brave-browser)$

# ------------------------------------------------------------
#  The three browser SCRATCHPADS, caught at map time
# ------------------------------------------------------------
#  "chatgpt / deepseek / whatsapp glitch and do not behave like the
#  terminal scratchpads." Measured, cold-spawning the whatsapp one and
#  polling `hyprctl clients` every 50 ms:
#
#      t=1.20s   class brave-web.whatsapp.com__-Whatsapp
#                workspace 4   TILED   735x715 @ 10,43
#      t=1.51s   workspace special:whats   floating   956x614 @ 205,77
#
#  So for ~310 ms the window is a real TILE on whatever workspace you are
#  on — it shoves the existing layout aside, then vanishes to the
#  scratchpad. That is the whole of the glitch, and the terminals never
#  show it because their geometry arrives as inline `dispatch exec` rules
#  that Hyprland applies as the window maps.
#
#  Those inline rules cannot work for these three. `brave --app=...` hands
#  the URL to the ALREADY RUNNING brave and exits, so the window is
#  created by a process Hyprland never spawned, and rules attached to the
#  spawned process match nothing (scripts/scratchpad.sh documents the
#  measurement). Its fallback — poll for the new address, then place it —
#  is what produces the 310 ms, because it can only ever act AFTER the
#  window exists.
#
#  A windowrule has no such problem: it is matched as the window maps,
#  whoever created it. The classes are stable and derived by brave itself
#  from the URL and profile directory (it ignores --class for --app
#  windows), so they can be matched literally — read off the live windows
#  rather than guessed.
#
#  scratchpad.sh still sets the pixel size and position afterwards, and
#  that stays: percentage `size`/`move` do not apply on a special
#  workspace (see its header), so the exact geometry still has to be
#  computed per monitor. The difference is that it now happens on a
#  workspace that is already hidden, where nothing can see it.
windowrule = workspace special:chatgpt silent, match:class ^(brave-chat\.openai\.com__-Chatgpt)$
windowrule = float true,                       match:class ^(brave-chat\.openai\.com__-Chatgpt)$

windowrule = workspace special:deepseek silent, match:class ^(brave-chat\.deepseek\.com__-Deepseek)$
windowrule = float true,                        match:class ^(brave-chat\.deepseek\.com__-Deepseek)$
windowrule = opacity 0.95,                      match:class ^(brave-chat\.deepseek\.com__-Deepseek)$

windowrule = workspace special:whats silent, match:class ^(brave-web\.whatsapp\.com__-Whatsapp)$
windowrule = float true,                     match:class ^(brave-web\.whatsapp\.com__-Whatsapp)$
windowrule = opacity 0.95,                   match:class ^(brave-web\.whatsapp\.com__-Whatsapp)$

# 6 — chrome/chromium
windowrule = workspace 6, match:class ^(google-chrome|chrome|Google-chrome|chromium|Chromium)$

# 8 — documents: LibreOffice + the PDF/ebook readers (qtile layout: max).
#     DOCUMENT_APP_CLASSES in config.py, "soffice" included because every
#     LibreOffice window carries it as its instance name.
windowrule = workspace 8, match:class ^(libreoffice-(writer|calc|impress|draw|base|math|startcenter)|soffice|okular|org\.pwmt\.zathura|zathura)$

# S — Anki + Obsidian.  qtile's group is literally named "S"; Hyprland
#     supports named workspaces, so it stays "S" rather than being
#     renumbered into the 1-9 range.
#
#     The `match:title ^(nvimsum)$` line that used to sit here has gone.
#     It was the port of Group("S")'s `Match(title="nvimsum")`, which is
#     itself dead config in qtile — nothing has been titled `nvimsum`
#     since alacritty was replaced by kitty, and the summary window is
#     spawned `--title sum.md`. See the sum-md block near the top of this
#     file and scripts/sum-toggle.sh.
windowrule = workspace name:S, match:class ^([Aa]nki|md\.Obsidian|obsidian)$

# 9 — messaging
windowrule = workspace 9, match:class ^(thunderbird|org\.telegram\.desktop|TelegramDesktop|telegram-desktop|discord)$

# ------------------------------------------------------------
#  Misc behaviour
# ------------------------------------------------------------
# Picture-in-picture (qtile had toggle_pip_mode in Media-Mode).
windowrule = float true, match:title ^(Picture-in-Picture)$
windowrule = pin true, match:title ^(Picture-in-Picture)$
windowrule = size 25%  25%, match:title ^(Picture-in-Picture)$
windowrule = move 74% 74%, match:title ^(Picture-in-Picture)$

# Inhibit idle while media plays fullscreen.
windowrule = idle_inhibit fullscreen, match:class ^(.*)$

# XWayland apps that need it
windowrule = no_blur true, match:xwayland true, match:title ^(gromit-mpx)$
windowrule = no_focus true, match:xwayland true, match:title ^(gromit-mpx)$

# Suppress the maximize event browsers fire on startup.
windowrule = suppress_event maximize, match:class ^(brave-browser|brave|chromium|firefox)$
