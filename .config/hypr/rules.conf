# ============================================================
#  Window rules
#
#  Ported from the Match() lists in config.py + scripts/float_windows.py.
#
#  Translation note: qtile matched on wm_class / wm_instance_class /
#  title (X11 properties).  Hyprland matches on `class` and `title`,
#  which for XWayland clients are the same strings, and for native
#  Wayland clients come from xdg-shell app_id.  Most app_ids match the
#  old WM_CLASS; verify any that misbehave with:  hyprctl clients
# ============================================================

# ------------------------------------------------------------
#  Floating dialogs — the qtile floating_layout Match list
# ------------------------------------------------------------
windowrulev2 = float, class:^(confirmreset)$
windowrulev2 = float, class:^(makebranch)$
windowrulev2 = float, class:^(maketag)$
windowrulev2 = float, class:^(dialog)$
windowrulev2 = float, class:^(download)$
windowrulev2 = float, class:^(error)$
windowrulev2 = float, class:^(file_progress)$
windowrulev2 = float, class:^(notification)$
windowrulev2 = float, class:^(splash)$
windowrulev2 = float, class:^(toolbar)$
windowrulev2 = float, title:^(branchdialog)$
windowrulev2 = float, title:^(Confirmation)$
windowrulev2 = float, title:^(pinentry)$
windowrulev2 = float, title:^(Qalculate!)$

# Media / viewers
windowrulev2 = float, class:^(mpv|mpvk)$
windowrulev2 = float, class:^(imv)$
windowrulev2 = float, title:^(feh)$
windowrulev2 = float, class:^(clip-view)$
windowrulev2 = float, class:^(docs-view)$

# Personal floats carried over from float_windows.py
windowrulev2 = float, title:^(sum.md)$
windowrulev2 = float, title:^(nvimsum)$
windowrulev2 = float, title:^(link-preview)$
windowrulev2 = float, title:^(Phone pairing QR)$
windowrulev2 = float, title:^(tastycharts)$
windowrulev2 = float, title:^(tastytrade)$
windowrulev2 = float, title:^(tastytrade - Portfolio Report)$

# ------------------------------------------------------------
#  Scratchpads
#
#  Geometry is transcribed from the DropDown() definitions in
#  config.py.  qtile expressed size/position as fractions of the
#  screen; Hyprland accepts percentages directly, so:
#      width=0.6 height=0.6 x=0.2 y=0.1  ->  60% 60% at 20% 10%
# ------------------------------------------------------------

# term1 / term2 / calc: width=0.6 height=0.6 x=0.2 y=0.1
windowrulev2 = float,          workspace:special:term1
windowrulev2 = size 60% 60%,   workspace:special:term1
windowrulev2 = move 20% 10%,   workspace:special:term1

windowrulev2 = float,          workspace:special:term2
windowrulev2 = size 60% 60%,   workspace:special:term2
windowrulev2 = move 20% 10%,   workspace:special:term2

windowrulev2 = float,          workspace:special:calc
windowrulev2 = size 60% 60%,   workspace:special:calc
windowrulev2 = move 20% 10%,   workspace:special:calc

# chatgpt / deepseek / whats: width=0.7 height=0.8 x=0.15 y=0.1
windowrulev2 = float,          workspace:special:chatgpt
windowrulev2 = size 70% 80%,   workspace:special:chatgpt
windowrulev2 = move 15% 10%,   workspace:special:chatgpt

windowrulev2 = float,          workspace:special:deepseek
windowrulev2 = size 70% 80%,   workspace:special:deepseek
windowrulev2 = move 15% 10%,   workspace:special:deepseek
# The one dropdown that was not fully opaque (opacity=0.95 in config.py).
windowrulev2 = opacity 0.95,   workspace:special:deepseek

windowrulev2 = float,          workspace:special:whats
windowrulev2 = size 70% 80%,   workspace:special:whats
windowrulev2 = move 15% 10%,   workspace:special:whats
windowrulev2 = opacity 0.95,   workspace:special:whats

# Spawn each scratchpad's client into its own special workspace.
# qtile spawned lazily on first toggle; these do the same via exec-once
# in autostart.conf being absent — Hyprland spawns on first toggle only
# if you add the exec, so the rules here just catch the window.
windowrulev2 = workspace special:calc,     class:^(qalculate-gtk)$
windowrulev2 = workspace special:chatgpt,  title:^(.*chat\.openai\.com.*)$
windowrulev2 = workspace special:deepseek, title:^(.*chat\.deepseek\.com.*)$

# ------------------------------------------------------------
#  Misc behaviour
# ------------------------------------------------------------
# Picture-in-picture (qtile had toggle_pip_mode in Media-Mode).
windowrulev2 = float,       title:^(Picture-in-Picture)$
windowrulev2 = pin,         title:^(Picture-in-Picture)$
windowrulev2 = size 25%  25%, title:^(Picture-in-Picture)$
windowrulev2 = move 74% 74%,  title:^(Picture-in-Picture)$

# Inhibit idle while media plays fullscreen.
windowrulev2 = idleinhibit fullscreen, class:^(.*)$

# XWayland apps that need it
windowrulev2 = noblur, xwayland:1, title:^(gromit-mpx)$
windowrulev2 = nofocus, xwayland:1, title:^(gromit-mpx)$

# Suppress the maximize event browsers fire on startup.
windowrulev2 = suppressevent maximize, class:^(brave-browser|brave|chromium|firefox)$
