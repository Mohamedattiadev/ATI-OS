<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
  <!-- Set preferred serif, sans serif, and monospace fonts.

       These lists used to name Arimo / Tinos / Cousine (ttf-croscore) and
       Noto Sans Arabic (noto-fonts). Not one of those is installed, nor
       declared in arch-config/modules/fonts.yaml. fontconfig does not warn
       about a family it cannot find, it substitutes, so the whole block was
       inert and every generic alias was decided by fontconfig's own defaults.

       Not a cosmetic detail here: eww/fonts.scss routes $ui-font through
       `sans-serif` deliberately, so that eww, dunst and the qtile popups
       (which inherit qtile_extras' "sans" default) share one typeface. Which
       typeface that was got decided by whatever else happened to be
       installed: add ttf-croscore and the desktop silently changes face.
       Same silent-substitution trap rofi's base.rasi documents next door.

       Named explicitly now, and only from families fonts.yaml guarantees.
       The picks are the ones already winning on the reference machine, so
       this pins the current rendering rather than restyling it. Cairo and
       Amiri follow for Arabic, which the CJK families do not cover;
       fontconfig falls through the list per codepoint. -->
  <alias>
   <family>sans-serif</family>
   <prefer>
    <family>Noto Sans CJK KR</family>
    <family>Cairo</family>
   </prefer>
  </alias>

  <alias>
   <family>serif</family>
   <prefer>
    <family>Noto Serif CJK KR</family>
    <family>Amiri</family>
   </prefer>
  </alias>

  <alias>
   <family>Sans</family>
   <prefer>
    <family>Noto Sans CJK KR</family>
    <family>Cairo</family>
   </prefer>
  </alias>

  <alias>
   <family>monospace</family>
   <prefer>
    <family>Noto Sans Mono CJK KR</family>
    <family>Cairo</family>
   </prefer>
  </alias>
  <!-- Aliases for commonly used MS fonts. -->
  <match>
    <test name="family"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Arimo</string>
    </edit>
  </match>
  <match>
    <test name="family"><string>Helvetica</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Arimo</string>
    </edit>
  </match>
  <match>
    <test name="family"><string>Verdana</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Arimo</string>
    </edit>
  </match>
  <match>
    <test name="family"><string>Tahoma</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Arimo</string>
    </edit>
  </match>
  <match>
    <!-- Insert joke here -->
    <test name="family"><string>Comic Sans MS</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Arimo</string>
    </edit>
  </match>
  <match>
    <test name="family"><string>Times New Roman</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Tinos</string>
    </edit>
  </match>
  <match>
    <test name="family"><string>Times</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Tinos</string>
    </edit>
  </match>
  <match>
    <test name="family"><string>Courier New</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Cousine</string>
    </edit>
  </match>
</fontconfig>
