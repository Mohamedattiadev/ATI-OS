[ui.toolbar]
# "simple" keeps Select/Pen/Marker/Step marker/Eraser inline and puts
# everything else one click behind the Shape picker — the "regular"
# default (which was showing, per the screenshot) has line+arrow inline
# too and reads as a longer, busier strip for no gain on this desktop.
layout_mode = "simple"

# Icons over text labels — same information, roughly half the width per
# button, which is most of "too big" right there.
use_icons = true

# The toolbar's own icons+layout scale, not the OS/monitor scale. 0.8
# rather than the packaged 1.0 default.
scale = 0.8

# Comes up small (a single 44px round chip) rather than the full strip;
# F2 still cycles full <-> micro <-> hidden on demand.
top_display_mode = "micro"

