LABEL arch
TEXT HELP
Boot ATI-OS on BIOS: Arch Linux with a configured qtile desktop.
Run `ati-os-install` once it has booted.
ENDTEXT
MENU LABEL ATI-OS — ^Install (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot ATI-OS on BIOS with the speakup screen reader, for speech feedback.
ENDTEXT
MENU LABEL ATI-OS — Install with ^speech (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
